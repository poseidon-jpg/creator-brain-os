<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sunrise (renderAt example)</title>
<!-- A 1920x1080 SVG scene with the page contract the Element Picker likes best:
       window.DURATION   how long the video is, in seconds
       window.renderAt(t)  draws the frame at time t (it may return a promise)
       window.ready      (optional) a promise that resolves when fonts and images are loaded
     Because the whole frame is a pure function of t, the picker can scrub it exactly and pick any element.
     Add ?capture to the address (the picker does) and it will not play on its own. -->
<style>
  @font-face { font-family: 'Outfit'; font-weight: 500; src: url(fonts/outfit-500.woff2) format('woff2'); }
  @font-face { font-family: 'Outfit'; font-weight: 700; src: url(fonts/outfit-700.woff2) format('woff2'); }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #101a3a; font-family: 'Outfit', system-ui, sans-serif; }
  svg#scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #title { position: absolute; left: 0; width: 1920px; top: 130px; text-align: center; font-size: 132px; font-weight: 700; letter-spacing: -.02em; color: #fff7e6; }
  #sub { position: absolute; left: 0; width: 1920px; top: 300px; text-align: center; font-size: 40px; font-weight: 500; letter-spacing: .3em; color: #ffd9a0; }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop id="skyTop" offset="0" stop-color="#101a3a"/>
      <stop id="skyBot" offset="1" stop-color="#ff9a5b"/>
    </linearGradient>
  </defs>
  <rect id="sky" width="1920" height="1080" fill="url(#skyGrad)"/>
  <circle id="sun" cx="960" cy="900" r="150" fill="#ffd25e"/>
  <g id="cloudA"><ellipse cx="0" cy="0" rx="150" ry="46" fill="#ffffff" opacity=".85"/><ellipse cx="-70" cy="-26" rx="80" ry="40" fill="#ffffff" opacity=".85"/></g>
  <g id="cloudB"><ellipse cx="0" cy="0" rx="190" ry="54" fill="#ffffff" opacity=".7"/><ellipse cx="80" cy="-30" rx="96" ry="44" fill="#ffffff" opacity=".7"/></g>
  <path id="bird" d="M0 0 Q 30 -30 60 0 Q 90 -30 120 0" fill="none" stroke="#16151a" stroke-width="7" stroke-linecap="round"/>
  <path id="hillBack" d="M0 800 C 300 660 620 700 960 780 C 1300 860 1600 700 1920 760 L1920 1080 L0 1080Z" fill="#33407a"/>
  <path id="hillFront" d="M0 900 C 360 820 700 900 1060 940 C 1400 980 1700 880 1920 920 L1920 1080 L0 1080Z" fill="#1c2552"/>
  <rect id="house" x="1380" y="800" width="150" height="110" fill="#f4efe6"/>
  <polygon id="roof" points="1360,800 1455,730 1550,800" fill="#ec3b2b"/>
</svg>
<div id="title">Sunrise</div>
<div id="sub">A RENDERAT EXAMPLE</div>
<script>
  window.DURATION = 5;
  const $ = (id) => document.getElementById(id);
  const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  const mix = (a, b, k) => a + (b - a) * k;
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mixHex = (a, b, k) => 'rgb(' + hex(a).map((v, i) => Math.round(mix(v, hex(b)[i], k))).join(',') + ')';

  // the whole frame at time t
  window.renderAt = function (t) {
    const k = ease(t / 3.2);
    $('sun').setAttribute('cy', mix(980, 600, k));
    $('sun').setAttribute('r', mix(150, 180, k));
    $('skyTop').setAttribute('stop-color', mixHex('#101a3a', '#3b5fd1', k));
    $('skyBot').setAttribute('stop-color', mixHex('#ff9a5b', '#ffe3a8', k));
    $('cloudA').setAttribute('transform', 'translate(' + mix(-300, 1500, t / 5) + ' 470)');
    $('cloudB').setAttribute('transform', 'translate(' + mix(2200, 400, t / 5) + ' 560)');
    $('bird').setAttribute('transform', 'translate(' + mix(200, 1700, t / 5) + ' ' + (560 + Math.sin(t * 3) * 40) + ') scale(' + (1 + 0.4 * Math.sin(t * 11)) + ' 1)');
    $('hillBack').setAttribute('transform', 'translate(0 ' + mix(60, 0, ease(t / 1.4)) + ')');
    $('hillFront').setAttribute('transform', 'translate(0 ' + mix(120, 0, ease((t - 0.2) / 1.4)) + ')');
    $('house').setAttribute('opacity', ease((t - 1.6) / 0.6));
    $('roof').setAttribute('opacity', ease((t - 1.8) / 0.6));
    $('roof').setAttribute('transform', 'rotate(' + mix(-14, 0, ease((t - 1.8) / 0.8)) + ' 1455 800)');
    $('title').style.opacity = ease((t - 0.8) / 0.8);
    $('title').style.transform = 'translateY(' + mix(40, 0, ease((t - 0.8) / 0.8)) + 'px)';
    $('sub').style.opacity = ease((t - 1.5) / 0.8);
  };
  window.ready = document.fonts.ready;
  window.renderAt(0);
  // play on its own unless the picker (or a recorder) asks for control with ?capture
  if (!location.search.includes('capture')) {
    const t0 = performance.now();
    (function loop() { window.renderAt(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); })();
  }
</script>
</body>
</html>
