<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teleprompter Desktop</title>
<style>
  /* Desktop page: the phone's script on your computer, on the same line at the same speed, so you can look at either
     screen mid-take. The text copies the phone's width and font size, scaled up by Size, so every line breaks where it
     breaks on the phone. With no phone open it works on its own. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: #000; color: #f5f5f5; overflow: hidden; font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; overflow: hidden; cursor: grab; }
  #stage.drag { cursor: grabbing; }
  #col { position: absolute; left: 50%; top: 0; --z: 2; will-change: transform;
    font-family: Georgia, 'Times New Roman', serif; line-height: 1.6; letter-spacing: 0.02em; }
  #col h1 { font-size: 1.4em; color: #ff6b2c; margin: 1.2em 0 0.4em; border-bottom: calc(1px * var(--z)) solid #333; padding-bottom: calc(8px * var(--z)); }
  #col h2 { font-size: 1.2em; color: #ffbe2e; margin: 1em 0 0.3em; }
  #col h3 { font-size: 1.05em; color: #ffbe2e; margin: 0.8em 0 0.3em; }
  #col p { margin-bottom: 0.8em; }
  #col strong { color: #ff6b2c; }
  #col hr { border: none; border-top: calc(1px * var(--z)) solid #333; margin: 1.5em 0; }
  #col ul, #col ol { margin-left: 1.2em; margin-bottom: 0.8em; }
  #col li { margin-bottom: 0.4em; }
  #col blockquote { border-left: calc(3px * var(--z)) solid #444; padding-left: 0.6em; color: #ccc; margin-bottom: 0.8em; }
  #col pre { white-space: pre-wrap; font-size: 0.6em; color: #ccc; margin-bottom: 0.8em; }
  #col .hint { color: #666; text-align: center; font-size: 0.6em; font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; }

  /* reading line: drag it to where your eyes sit, double-click to reset */
  #readline { position: fixed; left: 0; right: 0; top: 40%; height: 28px; margin-top: -14px; z-index: 9; cursor: ns-resize; user-select: none; }
  #readline::before { content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 2px; background: rgba(255, 107, 44, 0.35); }
  #readline .grip { position: absolute; right: 12px; top: 0; width: 44px; height: 28px; display: flex; align-items: center; justify-content: center; }
  #readline .grip::before { content: ""; width: 26px; height: 8px; border-radius: 4px; background: rgba(255, 107, 44, 0.35); }
  #readline.dragging::before, #readline.dragging .grip::before { background: rgba(255, 107, 44, 0.8); }

  #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    padding: 12px 20px; background: rgba(0, 0, 0, 0.92); border-top: 1px solid #333; transition: opacity .4s; }
  body.playing #bar { opacity: 0.15; }
  body.playing #bar:hover, body.playing #bar:focus-within { opacity: 1; }
  #bar select, #bar button { background: #222; color: #fff; border: 1px solid #444; padding: 10px 16px; border-radius: 6px; font-size: 15px; cursor: pointer; }
  #bar select { max-width: 320px; }
  #bar button:hover { background: #444; }
  #bar button.active { background: #ff6b2c; border-color: #ff6b2c; }
  #play { min-width: 110px; font-weight: 700; font-size: 17px; }
  .sl { display: flex; align-items: center; gap: 8px; color: #aaa; font-size: 14px; }
  .sl b { color: #fff; min-width: 38px; }
  .sl input { width: 150px; accent-color: #ff6b2c; }
  #link { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #999; }
  #link i { width: 9px; height: 9px; border-radius: 50%; background: #555; }
  #link.on i { background: #ff6b2c; box-shadow: 0 0 8px rgba(255, 107, 44, 0.8); }
  #keys { font-size: 12px; color: #666; }
  #phone-url { font-size: 13px; color: #999; }
  #phone-url b { color: #ffbe2e; font-weight: 600; user-select: all; }
</style>
</head>
<body>
<div id="stage"><div id="col"><p class="hint">Pick a script below, or open one on your phone.</p></div></div>
<div id="readline" title="Reading line: drag it, double-click to reset"><div class="grip"></div></div>
<div id="bar">
  <select id="script"><option value="">Pick a script...</option></select>
  <button id="play">Play</button>
  <label class="sl">Speed <b id="speed-l">1.0</b><input type="range" id="speed" min="0.1" max="5" step="0.1" value="1"></label>
  <label class="sl">Size <b id="zoom-l">2.0x</b><input type="range" id="zoom" min="1" max="4" step="0.1" value="2"></label>
  <span id="keys">Space play · arrows scroll · + and - speed</span>
  <span id="phone-url"></span>
  <span id="link"><i></i><span id="link-t">Connecting</span></span>
</div>
<script src="/md.js"></script>
<script src="/sync.js"></script>
<script>
const $ = id => document.getElementById(id);
const stage = $('stage'), col = $('col'), sel = $('script'), playBtn = $('play'), speed = $('speed'), zoom = $('zoom'), readline = $('readline');
const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const load = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

// ---- layout: the phone's text width and font size (it reports them), times Size ----
let L = { w: 364, fs: 32 }, Z = 2, pos = 0, readFrac = 0.4;
{ const z = parseFloat(load('tpd-zoom')); if (z >= 1 && z <= 4) Z = z;
  const r = parseFloat(load('tpd-readline')); if (r >= 0.1 && r <= 0.85) readFrac = r;
  const s = parseFloat(load('tpd-speed')); if (s >= 0.1 && s <= 5) speed.value = s; }
zoom.value = Z;
function lay() {
  col.style.width = (L.w * Z) + 'px';
  col.style.fontSize = (L.fs * Z) + 'px';
  col.style.setProperty('--z', Z);
  $('zoom-l').textContent = Z.toFixed(1) + 'x';
}
// pos = the text's y (in its own px) that sits on the reading line
const readY = () => readFrac * innerHeight;
const clampPos = y => Math.min(Math.max(y, -0.3 * innerHeight), col.offsetHeight);
function paint() { col.style.transform = `translate3d(-50%, ${readY() - pos}px, 0)`; readline.style.top = (readFrac * 100) + '%'; }
lay(); paint();

// ---- scripts ----
let curFile = null, lastMd = '', lastRev = 0;
async function loadScripts() {
  try {
    const list = await (await fetch('/api/scripts', { cache: 'no-store' })).json();
    if (!list.length) col.innerHTML = '<p class="hint">No scripts yet. Ask your agent to send a script to the teleprompter.</p>';
    list.forEach(s => { const o = document.createElement('option'); o.value = s.file; o.textContent = s.name; sel.appendChild(o); });
    if (curFile) sel.value = curFile;
  } catch (e) {}
}
// why: 'user' (picked here) and 'agent' tell the phone; 'sync' came from the phone and keeps its place; else a quiet load
async function loadScript(file, why) {
  if (!file) return;
  if (![...sel.options].some(o => o.value === file)) { const o = document.createElement('option'); o.value = file; o.textContent = file.replace(/\.md$/, ''); sel.appendChild(o); }
  try {
    const res = await fetch('/scripts/' + encodeURIComponent(file), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const md = await res.text();
    curFile = file; lastMd = md; lastRev = 0; sel.value = file;
    col.innerHTML = renderMarkdown(md);
    sync.relayout();
    if (why !== 'sync') { pos = 0; paint(); sync.stop(); }
    document.title = file.replace(/\.md$/, '') + ' · Teleprompter';
    store('tpd-last', file);
    if (why === 'user' || why === 'agent') sync.claim();
  } catch (e) { col.innerHTML = '<p class="hint">Could not load that script.</p>'; }
}
sel.addEventListener('change', () => { loadScript(sel.value, 'user'); sel.blur(); });

// ---- the sync engine (sync.js) ----
function relTop(el) { let y = 0; while (el && el !== col) { y += el.offsetTop; el = el.offsetParent; } return y; }
const sync = TPSync({
  role: 'desk', speed: parseFloat(speed.value),
  root: () => col,
  topOf: relTop,
  getY: () => pos,
  setY: y => { pos = clampPos(y); paint(); },
  addY: dy => { pos = clampPos(pos + dy); paint(); },
  viewH: () => innerHeight,
  scale: () => Z,
  file: () => curFile,
  loadFile: f => loadScript(f, 'sync'),
  onPlaying: p => { playBtn.textContent = p ? 'Pause' : 'Play'; playBtn.classList.toggle('active', p); document.body.classList.toggle('playing', p); },
  onSpeed: v => { speed.value = v; $('speed-l').textContent = (+v).toFixed(1); store('tpd-speed', v); },
  onLayout: l => { if (l && l.w && l.fs) { L = { w: l.w, fs: l.fs }; lay(); } },
  onStatus: s => {
    $('link').classList.toggle('on', s.online && s.peers.phone > 0);
    $('link-t').textContent = !s.online ? 'Offline, retrying' : s.peers.phone ? 'Synced with phone' : 'No phone open';
    $('phone-url').style.display = s.online && s.peers.phone ? 'none' : '';
  },
});
$('speed-l').textContent = (+speed.value).toFixed(1);

// the address to type on your phone (same wifi)
fetch('/api/info', { cache: 'no-store' }).then(r => r.json()).then(i => {
  const p = i.links && i.links.phone && i.links.phone[0];
  $('phone-url').innerHTML = p ? 'Phone: <b></b>' : 'Phone link off (HOST is local only)';
  if (p) $('phone-url').querySelector('b').textContent = p.url;
}).catch(() => {});

// ---- controls ----
playBtn.addEventListener('click', () => { sync.play(!sync.playing); playBtn.blur(); });
speed.addEventListener('input', () => { const v = parseFloat(speed.value); $('speed-l').textContent = v.toFixed(1); store('tpd-speed', v); sync.setSpeed(v); });
zoom.addEventListener('input', () => { sync.keepPlace(() => { Z = parseFloat(zoom.value); lay(); }); paint(); store('tpd-zoom', Z); });
function nudge(dy) { pos = clampPos(pos + dy); paint(); sync.moved(); }
stage.addEventListener('wheel', e => { e.preventDefault(); nudge(e.deltaY * (e.deltaMode === 1 ? 40 : 1)); }, { passive: false });
let dragY = null;
stage.addEventListener('pointerdown', e => { if (e.button !== 0) return; dragY = e.clientY; stage.classList.add('drag'); stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => { if (dragY === null) return; nudge(dragY - e.clientY); dragY = e.clientY; });
const endDrag = () => { dragY = null; stage.classList.remove('drag'); };
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  const line = L.fs * Z * 1.6;
  if (e.key === ' ') { e.preventDefault(); sync.play(!sync.playing); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); nudge(line); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); nudge(-line); }
  else if (e.key === 'PageDown') { e.preventDefault(); nudge(innerHeight * 0.7); }
  else if (e.key === 'PageUp') { e.preventDefault(); nudge(-innerHeight * 0.7); }
  else if (e.key === 'Home') { e.preventDefault(); nudge(-pos); }
  else if (e.key === '+' || e.key === '=' || e.key === '-') {
    const v = Math.min(5, Math.max(0.1, Math.round((parseFloat(speed.value) + (e.key === '-' ? -0.1 : 0.1)) * 10) / 10));
    speed.value = v; speed.dispatchEvent(new Event('input'));
  }
});
// reading line: drag to move, double-click resets
let rlDrag = false;
readline.addEventListener('pointerdown', e => { e.preventDefault(); rlDrag = true; readline.classList.add('dragging'); readline.setPointerCapture(e.pointerId); });
readline.addEventListener('pointermove', e => { if (!rlDrag) return; readFrac = Math.min(0.85, Math.max(0.1, e.clientY / innerHeight)); paint(); });
readline.addEventListener('pointerup', () => { rlDrag = false; readline.classList.remove('dragging'); store('tpd-readline', readFrac.toFixed(4)); });
readline.addEventListener('dblclick', () => { readFrac = 0.4; paint(); store('tpd-readline', '0.4'); });
addEventListener('resize', paint);

// ---- live updates: a script your agent opens, or a change to the open script on disk ----
let lastLiveSeq = null;
async function refreshInPlace() {
  const md = await (await fetch('/scripts/' + encodeURIComponent(curFile), { cache: 'no-store' })).text();
  if (md === lastMd) return;
  lastMd = md; col.innerHTML = renderMarkdown(md); sync.relayout(); pos = clampPos(pos); paint();
}
async function livePoll() {
  if (document.hidden) return;
  try {
    const r = await (await fetch('/api/live' + (curFile ? '?f=' + encodeURIComponent(curFile) : ''), { cache: 'no-store' })).json();
    if (r.live && r.liveSeq !== lastLiveSeq) {
      const first = lastLiveSeq === null; lastLiveSeq = r.liveSeq;
      if (!(first && curFile)) { await loadScript(r.live, first ? 'first' : 'agent'); lastRev = r.liveRev; return; }
    }
    if (curFile && r.curRev) { if (lastRev && r.curRev !== lastRev) await refreshInPlace(); lastRev = r.curRev; }
  } catch (e) {}
}
setInterval(livePoll, 1500);
loadScripts().then(() => setTimeout(async () => {
  await livePoll();
  if (curFile) return;
  const last = load('tpd-last');
  if (last && [...sel.options].some(o => o.value === last)) loadScript(last, 'first');
}, 800));
</script>
</body>
</html>
