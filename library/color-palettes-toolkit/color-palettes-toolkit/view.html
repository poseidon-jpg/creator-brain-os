<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview - Brand Color Palettes Toolkit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Cpath d='M38 18 L58 24 L62 42 L48 60 L24 56 L18 34 Z' fill='%23ff6b1a'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
:root, html[data-theme="dark"]{--paper:#131311;--card:#24221c;--ink:#e8e2d2;--muted:#8d8775;--orange:#ff6b1a;--shadow:#000;--tile-border:#24221c;color-scheme:dark;}
html[data-theme="light"]{--paper:#f2efe8;--card:#faf8f2;--ink:#1c1a16;--muted:#6f6a5c;--orange:#ff6b1a;--shadow:rgba(28,26,22,.9);--tile-border:#1c1a16;color-scheme:light;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:400 15px/1.5 'Outfit',system-ui,sans-serif;transition:background .25s,color .25s;}
a{color:inherit;text-decoration:none}
.bar{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--paper);border-bottom:2px solid var(--ink);flex-wrap:wrap;}
.back{border:2px solid var(--tile-border);background:var(--card);padding:7px 14px;font-weight:600;font-size:13px;border-radius:8px;box-shadow:0 0 0 rgba(0,0,0,0);transition:transform .15s ease,box-shadow .15s ease;}
.back:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--shadow);}
.back:active{transform:translate(1px,1px);box-shadow:0 0 0 rgba(0,0,0,0);transition-duration:.06s;}
::selection{background:#ff6b1a;color:#fff;}
.name{font-weight:600;font-size:17px;letter-spacing:-.3px;}
.cat{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.spacer{flex:1}
.act{border:2px solid var(--tile-border);background:var(--card);color:var(--ink);padding:7px 14px;font:600 13px 'Outfit',sans-serif;cursor:pointer;border-radius:8px;box-shadow:0 0 0 rgba(0,0,0,0);transition:transform .15s ease,box-shadow .15s ease;}
.act:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--shadow);}
.act:active{transform:translate(1px,1px);box-shadow:0 0 0 rgba(0,0,0,0);transition-duration:.06s;}
.act.pri{background:var(--orange);color:#fff;border-color:var(--orange);}
.ok{font-size:12.5px;color:var(--orange);font-weight:600;min-width:70px;}
iframe{flex:1;width:100%;border:none;background:#fff;}
</style></head>
<body>
<div class="bar">
  <a class="back" href="index.html">← All systems</a>
  <div><div class="name" id="name">Loading...</div><div class="cat" id="cat"></div></div>
  <div class="spacer"></div>
  <span class="ok" id="ok"></span>
  <button class="act pri" id="copy">Copy DESIGN md</button>
  <a class="act" id="raw" target="_blank">Open DESIGN md</a>
  <button class="act" id="themeToggle" title="Toggle dark / light" aria-label="Toggle theme">◐</button>
</div>
<iframe id="frame" title="Design system preview"></iframe>
<script>
const slug = new URLSearchParams(location.search).get('s') || 'claude';
const safe = slug.replace(/[^a-z0-9.\-]/gi,'');
const mdPath = 'systems/' + safe + '/DESIGN.md';
document.getElementById('frame').src = 'previews/' + safe + '.html';
document.getElementById('raw').href = mdPath;
fetch('catalog.json').then(r=>r.json()).then(d => {
  const s = d.find(x=>x.slug===safe);
  if(s){ document.getElementById('name').textContent = s.title; document.getElementById('cat').textContent = s.category + ' · ' + s.font; document.title = s.title + ' - Brand Color Palettes Toolkit'; }
});
document.getElementById('copy').onclick = async () => {
  const ok = document.getElementById('ok');
  try{
    await navigator.clipboard.writeText(location.href + '\n(Color palette reference - I have it locally too: ' + mdPath + ' inside the color-palettes-toolkit repo I cloned from GitHub. Apply those exact colors to what you build for me.)');
    ok.textContent = 'Copied!';
  }catch(e){ ok.textContent = 'Open raw instead'; }
  setTimeout(()=>ok.textContent='', 2200);
};
document.documentElement.dataset.theme = localStorage.getItem('robo-theme') || 'dark';
document.getElementById('themeToggle').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('robo-theme', next);
};
</script>
</body></html>
