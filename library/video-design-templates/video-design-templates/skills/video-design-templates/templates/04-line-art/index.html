<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sonnet 5.5 - Line Art</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #060912; }
  canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<svg width="0" height="0" style="position:absolute"><path id="p" d=""/></svg>
<script>
const W = 1920, H = 1080;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mkLayer = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const lineCv = mkLayer(), lctx = lineCv.getContext('2d');
const moonCv = mkLayer(), mctx = moonCv.getContext('2d');
const wordCv = mkLayer(), wctx = wordCv.getContext('2d');
const refCv = mkLayer(), rctx = refCv.getContext('2d');
/* lit doorways: the arches that glow once the moon fills */
const DOORS = [
  { p: new Path2D('M546 720 V684 A29 29 0 0 1 604 684 V720 Z'), at: 0.34, y0: 652, y1: 720 },
  { p: new Path2D('M880 720 V664 A42 42 0 0 1 964 664 V720 Z'), at: 0.50, y0: 620, y1: 720 },
  { p: new Path2D('M360 722 C376 720 384 698 360 674 C336 698 344 722 360 722 Z'), at: 0.66, y0: 672, y1: 722 },
];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  outQuart: x => 1 - Math.pow(1 - x, 4),
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inQuad: x => x * x,
  smooth: x => x * x * (3 - 2 * x),
};
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => mulberry32((n * 7919 + 13) | 0)();

/* ============ the one line, in final-composition coordinates ============ */
const GY = 720;                       // ground line
const MOON = [1000, 262], MR = 132;   // the moon that closes the line
const FINAL = { cx: 1000, cy: 520, z: 1.1 };  // resting camera: moon centred over the wordmark
const BOT = [MOON[0], MOON[1] + MR];  // where the pen arrives under the moon
const SEG = [
  ['ground', 'M -400 720 H 360'],
  ['seed',   'C 376 720 384 698 360 674 C 336 698 344 722 360 722 L 360 674'],
  ['sprout', 'C 358 662 352 652 354 640 ' +
             'C 338 626 312 614 286 622 C 304 644 334 654 354 640 ' +
             'C 357 624 364 608 370 594 ' +
             'C 388 580 416 570 446 578 C 432 602 400 610 370 594 ' +
             'C 366 584 360 574 361 566 ' +
             'C 350 556 330 551 312 556 C 324 572 348 576 361 566 ' +
             'C 360 548 368 540 392 540'],
  ['roofA',  'H 650'],
  ['hallA',  'V 720 H 604 V 684 A 29 29 0 0 0 546 684 V 720 H 470 V 540'],
  ['retr',   'H 650'],
  ['towerB', 'V 450 L 735 426 V 720'],
  ['stepC',  'H 775 V 640 H 815 V 600 H 855 V 720'],
  ['archD',  'H 880 V 664 A 42 42 0 0 1 964 664 V 720'],
  ['spireE', 'H 990 V 636 L 1008 610 L 1017 500 L 1026 610 L 1044 636 V 720'],
  ['run',    'H 1450'],
  ['curl',   'C 1540 720 1612 710 1624 664 C 1634 622 1586 592 1552 612 C 1522 630 1538 668 1574 662 C 1608 656 1606 612 1568 590'],
  ['arc',    `C 1490 540 1360 424 1230 412 C 1150 405 1080 ${BOT[1]} ${BOT[0]} ${BOT[1]}`],
  ['moon',   `A ${MR} ${MR} 0 0 1 ${MOON[0]} ${MOON[1] - MR} A ${MR} ${MR} 0 0 1 ${BOT[0]} ${BOT[1]}`],
];
const pathEl = document.getElementById('p');
const STEP = 1.5;
let pts = [], TOTAL = 0; const MARK = {};
function buildPath() {
  let d = '';
  for (const [name, s] of SEG) { d += (d ? ' ' : '') + s; pathEl.setAttribute('d', d); MARK[name] = pathEl.getTotalLength(); }
  TOTAL = pathEl.getTotalLength();
  pts = [];
  for (let s = 0; s <= TOTAL; s += STEP) { const p = pathEl.getPointAtLength(s); pts.push([p.x, p.y]); }
  const pe = pathEl.getPointAtLength(TOTAL); pts.push([pe.x, pe.y]);
}
function ptAt(s) {
  s = clamp(s, 0, TOTAL);
  const f = s / STEP, i = Math.floor(f), k = f - i;
  const a = pts[Math.min(i, pts.length - 1)], b = pts[Math.min(i + 1, pts.length - 1)];
  return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
}

/* ============ time -> drawn length ============ */
const T = { end: 2.78, fill0: 2.62, fill1: 3.22, word0: 2.95, word1: 3.6, sub0: 3.35, glint0: 3.3, glint1: 4.8 };
let Lof = null;
function monotone(xs, ys, endSlope = 0) { // Fritsch-Carlson
  const n = xs.length, d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2] * endSlope;
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : 2 / (1 / d[i - 1] + 1 / d[i]);
  return x => {
    if (x <= xs[0]) return ys[0] + m[0] * (x - xs[0]);
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}
const drawnAt = t => clamp(Lof(t), 0, TOTAL);
function buildTiming() {
  const M = MARK;
  const KEYS = [
    [0.00, M.ground - 430],
    [0.32, M.ground],
    [0.47, M.seed],
    [1.02, M.sprout],
    [1.14, M.roofA],
    [1.49, M.hallA],
    [1.55, M.retr],
    [1.70, M.towerB],
    [1.84, M.stepC],
    [1.94, M.archD],
    [2.06, M.spireE],
    [2.12, M.run],
    [2.28, M.curl],
    [2.46, M.arc],
    [T.end, TOTAL],
  ];
  Lof = monotone(KEYS.map(k => k[0]), KEYS.map(k => k[1]), 0.1);
}

/* ============ camera ============ */
const zOf = (() => {
  let f = null;
  return t => { if (!f) f = monotone([0, 0.5, 1.4, 2.0, 2.65, 5.0], [2.1, 1.98, 1.62, 1.28, FINAL.z, FINAL.z], 0); return f(t); };
})();
function camera(t) {
  let fx = 0, fy = 0, ws = 0; const N = 14, span = 0.5;
  for (let k = 0; k < N; k++) { const w = 1 - k / N; const p = ptAt(drawnAt(Math.max(0, t - k * span / N))); fx += p[0] * w; fy += p[1] * w; ws += w; }
  fx /= ws; fy /= ws;
  const punch = t > T.fill0 ? 0.016 * Math.exp(-(t - T.fill0) * 6.5) * E.smooth(prog(t, T.fill0, T.fill0 + 0.08)) : 0;
  const z = zOf(t) * (1 + 0.03 * E.inOutSine(prog(t, 2.7, 5.0)) + punch);
  const w = E.inOutCubic(prog(t, 1.9, 2.95));
  const cx = lerp(fx + 190 / z, FINAL.cx, w), cy = lerp(fy - 80 / z, FINAL.cy, w);
  return { z, cx, cy };
}

/* ============ static textures ============ */
const grain = document.createElement('canvas'); grain.width = grain.height = 512;
{
  const g = grain.getContext('2d'), id = g.createImageData(512, 512), r = mulberry32(77);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0);
}
const sprite = document.createElement('canvas'); sprite.width = sprite.height = 256;
{
  const g = sprite.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(255,244,214,1)'); gr.addColorStop(0.12, 'rgba(255,226,160,0.55)');
  gr.addColorStop(0.4, 'rgba(230,180,90,0.14)'); gr.addColorStop(1, 'rgba(230,180,90,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
}
const bokeh = document.createElement('canvas'); bokeh.width = bokeh.height = 64;
{
  const g = bokeh.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,230,170,0.9)'); gr.addColorStop(0.55, 'rgba(255,220,150,0.55)'); gr.addColorStop(0.9, 'rgba(255,215,140,0.22)'); gr.addColorStop(1, 'rgba(255,215,140,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
}
/* dust motes: three depth layers, world-fixed so the camera move shows parallax */
const DUST = [];
{
  const r = mulberry32(2026);
  for (let i = 0; i < 96; i++) {
    const layer = i < 44 ? 0 : i < 80 ? 1 : 2;
    DUST.push({
      layer, x: r() * 2200, y: r() * 1300, ph: r() * 6.28, sp: 0.5 + r() * 1.4,
      r: layer === 0 ? 0.5 + r() * 0.7 : layer === 1 ? 0.9 + r() * 1.2 : 6 + r() * 11,
      a: layer === 0 ? 0.18 + r() * 0.25 : layer === 1 ? 0.2 + r() * 0.3 : 0.03 + r() * 0.05,
      par: layer === 0 ? 0.22 : layer === 1 ? 0.55 : 1.35,
      rise: layer === 0 ? 3 : layer === 1 ? 7 : 14,
      cool: r() < 0.35,
    });
  }
}

/* stars that wake up once the moon is full: seeded, kept clear of the moon and the wordmark */
const STARS = [];
{
  const r = mulberry32(555);
  while (STARS.length < 46) {
    const x = r() * 1920, y = 30 + r() * 640;
    if (Math.hypot(x - 960, y - 262) < 230) continue;            // not on the moon
    if (y > 380 && x > 300 && x < 1700) continue;                 // not in the skyline's airspace
    STARS.push({ x, y, ph: r() * 6.28, sp: 1.2 + r() * 2.4, r: 0.7 + r() * 1.1, big: r() < 0.2, on: 2.75 + r() * 1.0, a: 0.35 + r() * 0.5 });
  }
}
function drawStars(t, cam) {
  ctx.globalCompositeOperation = 'lighter';
  for (const s of STARS) {
    const k = E.outCubic(prog(t, s.on, s.on + 0.5));
    if (k <= 0) continue;
    const tw = 0.55 + 0.45 * Math.sin(t * s.sp + s.ph);
    const a = s.a * k * tw;
    const x = s.x - (cam.cx - 960) * 0.06, y = s.y - (cam.cy - 540) * 0.06;
    ctx.fillStyle = `rgba(255,236,190,${a})`;
    ctx.beginPath(); ctx.arc(x, y, s.r, 0, 6.2832); ctx.fill();
    if (s.big) {
      const L2 = (5 + 9 * tw) * k;
      ctx.strokeStyle = `rgba(255,236,190,${a * 0.8})`; ctx.lineWidth = 0.9;
      ctx.beginPath(); ctx.moveTo(x - L2, y); ctx.lineTo(x + L2, y); ctx.moveTo(x, y - L2); ctx.lineTo(x, y + L2); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ============ colour helpers ============ */
const C_BASE = [196, 160, 98], C_WARM = [236, 204, 140], C_HOT = [255, 246, 222], C_SET = [222, 190, 126];
const mix = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function strokeRange(g, a, b) {
  if (b - a < 0.5) return;
  const i0 = Math.floor(a / STEP), i1 = Math.floor(b / STEP);
  const p0 = ptAt(a); g.beginPath(); g.moveTo(p0[0], p0[1]);
  for (let i = i0 + 1; i <= i1; i++) g.lineTo(pts[i][0], pts[i][1]);
  const p1 = ptAt(b); g.lineTo(p1[0], p1[1]);
  g.stroke();
}
const mod = (a, n) => ((a % n) + n) % n;

/* ============ wordmark ============ */
const WORD = 'SONNET';
const WORD_FS = 84, WORD_Y = 902, SUB_Y = 976;
let glyphW = null;
function measureWord() {
  wctx.font = `500 ${WORD_FS}px 'Cormorant Garamond'`;
  glyphW = [...WORD].map(ch => wctx.measureText(ch).width);
}

/* ============ render ============ */
function renderAt(t) {
  const L = drawnAt(t);
  const done = prog(t, T.end, T.end + 0.4);
  const cam = camera(t);
  const toScreen = (p) => [(p[0] - cam.cx) * cam.z + W / 2, (p[1] - cam.cy) * cam.z + H / 2];
  const tip = ptAt(L), tipS = toScreen(tip);
  const camT = [cam.z, 0, 0, cam.z, W / 2 - cam.cx * cam.z, H / 2 - cam.cy * cam.z];
  const penOn = 1 - prog(t, T.end + 0.05, T.end + 0.42);
  const tf = t - T.fill0, fk = prog(t, T.fill0, T.fill1);

  // ---------- background ----------
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.filter = 'none';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#060912'; ctx.fillRect(0, 0, W, H);
  const bw = E.inOutCubic(prog(t, 1.2, 2.9));
  const bx = lerp(tipS[0], 960, bw), by = lerp(tipS[1], 420, bw);
  let gr = ctx.createRadialGradient(bx, by, 0, bx, by, 1200);
  gr.addColorStop(0, '#1A2744'); gr.addColorStop(0.42, '#101A30'); gr.addColorStop(1, '#060912');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);

  // pool of light the pen throws on the paper
  if (penOn > 0) {
    ctx.globalCompositeOperation = 'lighter';
    gr = ctx.createRadialGradient(tipS[0], tipS[1], 0, tipS[0], tipS[1], 380);
    gr.addColorStop(0, `rgba(130,150,205,${0.13 * penOn})`); gr.addColorStop(1, 'rgba(130,150,205,0)');
    ctx.fillStyle = gr; ctx.fillRect(tipS[0] - 380, tipS[1] - 380, 760, 760);
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- dust (behind the line): far + mid layers ----------
  const drawDust = (layers) => {
    ctx.globalCompositeOperation = 'lighter';
    for (const d of DUST) {
      if (!layers.includes(d.layer)) continue;
      const sx = mod(d.x - cam.cx * cam.z * d.par * 0.5 + 60, 2100) - 90;
      const sy = mod(d.y - t * d.rise - cam.cy * cam.z * d.par * 0.5 + 60, 1250) - 90;
      const tw = 0.6 + 0.4 * Math.sin(t * d.sp * 2 + d.ph);
      const fade = d.layer === 2 ? 1 : lerp(0.35, 1, prog(t, 0, 0.5));
      ctx.globalAlpha = d.a * tw * fade;
      const r = d.r * (d.layer === 2 ? (0.8 + 0.2 * cam.z) : 1);
      if (d.layer === 2) {
        ctx.drawImage(bokeh, sx - r, sy - r, r * 2, r * 2);
      } else {
        ctx.fillStyle = d.cool ? 'rgb(190,205,255)' : 'rgb(255,226,165)';
        ctx.beginPath(); ctx.arc(sx, sy, r, 0, 6.2832); ctx.fill();
      }
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  };
  drawDust([0, 1]);
  drawStars(t, cam);

  // ---------- moon: halo + gold disc (behind the line) ----------
  if (fk > 0) {
    ctx.setTransform(...camT);
    const flash = Math.exp(-Math.max(0, tf) * 4.2) * E.outCubic(prog(t, T.fill0, T.fill0 + 0.25));
    const breathe = 0.5 + 0.5 * Math.sin(t * 2.2);
    const haloA = (0.2 + 0.5 * flash + 0.035 * breathe) * E.smooth(prog(t, T.fill0, T.fill0 + 0.5));
    ctx.globalCompositeOperation = 'lighter';
    gr = ctx.createRadialGradient(MOON[0], MOON[1], MR * 0.5, MOON[0], MOON[1], MR * 3.6);
    gr.addColorStop(0, `rgba(245,205,125,${haloA})`); gr.addColorStop(0.3, `rgba(205,150,80,${0.3 * haloA})`); gr.addColorStop(1, 'rgba(205,150,80,0)');
    ctx.fillStyle = gr; ctx.fillRect(MOON[0] - MR * 3.6, MOON[1] - MR * 3.6, MR * 7.2, MR * 7.2);
    ctx.globalCompositeOperation = 'source-over';

    const m = mctx;
    m.setTransform(1, 0, 0, 1, 0, 0); m.clearRect(0, 0, W, H); m.setTransform(...camT);
    m.globalCompositeOperation = 'source-over';
    m.save();
    m.beginPath(); m.arc(MOON[0], MOON[1], MR, 0, Math.PI * 2); m.clip();
    const gold = m.createLinearGradient(MOON[0] - MR, MOON[1] - MR, MOON[0] + MR * 0.85, MOON[1] + MR);
    gold.addColorStop(0, '#F9E8BC'); gold.addColorStop(0.42, '#E4C482'); gold.addColorStop(1, '#A47737');
    m.fillStyle = gold; m.fillRect(MOON[0] - MR, MOON[1] - MR, MR * 2, MR * 2);
    // soft volume: lit upper-left, shaded lower-right
    const vg = m.createRadialGradient(MOON[0] - MR * 0.45, MOON[1] - MR * 0.5, MR * 0.1, MOON[0], MOON[1], MR * 1.15);
    vg.addColorStop(0, 'rgba(255,248,226,0.34)'); vg.addColorStop(0.55, 'rgba(255,240,200,0)'); vg.addColorStop(1, 'rgba(120,70,20,0.28)');
    m.fillStyle = vg; m.fillRect(MOON[0] - MR, MOON[1] - MR, MR * 2, MR * 2);
    // a sheen crosses the gold (not the cut-out) once, in the hold
    const sh = prog(t, 3.35, 4.55);
    if (sh > 0 && sh < 1) {
      const sx = lerp(MOON[0] - MR * 1.9, MOON[0] + MR * 1.9, E.inOutSine(sh));
      const sg = m.createLinearGradient(sx - 60, MOON[1] - 70, sx + 60, MOON[1] + 70);
      sg.addColorStop(0, 'rgba(255,250,235,0)'); sg.addColorStop(0.5, 'rgba(255,250,235,0.4)'); sg.addColorStop(1, 'rgba(255,250,235,0)');
      m.fillStyle = sg; m.fillRect(MOON[0] - MR, MOON[1] - MR, MR * 2, MR * 2);
    }
    // the S, cut out of the disc and filled with deep night
    m.font = `600 ${MR * 1.9}px 'Cormorant Garamond'`; m.textAlign = 'center'; m.textBaseline = 'alphabetic';
    const tm = m.measureText('S');
    const sy = MOON[1] + (tm.actualBoundingBoxAscent - tm.actualBoundingBoxDescent) / 2;
    const dg = m.createLinearGradient(0, MOON[1] - MR * 0.8, 0, MOON[1] + MR * 0.8);
    dg.addColorStop(0, '#0A101F'); dg.addColorStop(1, '#16203A');
    m.fillStyle = 'rgba(255,244,208,0.7)'; m.fillText('S', MOON[0] + 2.5, sy + 3.5);   // lit lip, lower right
    m.fillStyle = 'rgba(105,66,22,0.55)'; m.fillText('S', MOON[0] - 1.5, sy - 2);       // shadow lip, upper left
    m.fillStyle = dg; m.fillText('S', MOON[0], sy);
    // flash as it fills + sheen in the hold
    if (flash > 0.01) { m.globalCompositeOperation = 'source-atop'; m.fillStyle = `rgba(255,248,225,${0.5 * flash})`; m.fillRect(MOON[0] - MR, MOON[1] - MR, MR * 2, MR * 2); }
    m.restore();
    // reveal: gold spreads out from the point where the pen stopped
    if (fk < 1) {
      const rr = lerp(10, MR * 2 + 90, E.outCubic(fk)), edge = 70;
      m.globalCompositeOperation = 'destination-in';
      const rg = m.createRadialGradient(BOT[0], BOT[1], Math.max(0, rr - edge), BOT[0], BOT[1], rr);
      rg.addColorStop(0, 'rgba(0,0,0,1)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
      m.fillStyle = rg; m.fillRect(MOON[0] - MR * 3, MOON[1] - MR * 3, MR * 6, MR * 6);
    }
    m.globalCompositeOperation = 'source-over';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(moonCv, 0, 0);
  }

  // ---------- the line on its own layer ----------
  lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.clearRect(0, 0, W, H);
  lctx.setTransform(...camT);
  lctx.lineJoin = 'round'; lctx.lineCap = 'butt';
  lctx.lineWidth = 2.05 / Math.pow(cam.z, 0.45);
  const AGE = 1250, CH = 22;
  const agedEnd = Math.max(0, L - AGE);
  const baseC = mix(C_BASE, C_SET, done);
  lctx.strokeStyle = rgb(baseC, 0.92);
  if (agedEnd > 0) strokeRange(lctx, 0, agedEnd + 0.5);
  for (let s = agedEnd; s < L; s += CH) {
    const e = Math.min(L, s + CH);
    const age = (L - (s + e) / 2) / AGE;
    const heat = Math.pow(1 - age, 3.2) * (1 - done);
    const c = age < 0.12 ? mix(C_WARM, C_HOT, (1 - age / 0.12) * (1 - done)) : mix(baseC, C_WARM, heat / 0.66 > 1 ? 1 : heat / 0.66);
    lctx.strokeStyle = rgb(c, 0.92 + 0.08 * heat);
    strokeRange(lctx, s, e + 0.5);
  }
  // doorways light up one after another once the moon is full
  for (const d of DOORS) {
    const k = E.outCubic(prog(t, T.fill0 + d.at, T.fill0 + d.at + 0.5)) * (1 + 0.05 * Math.sin(t * 9 + d.at * 20) * Math.sin(t * 3.1 + d.at * 7));
    if (k <= 0) continue;
    const dg = lctx.createLinearGradient(0, d.y0, 0, d.y1);
    dg.addColorStop(0, `rgba(255,203,118,${0.55 * k})`); dg.addColorStop(1, `rgba(255,233,172,${0.95 * k})`);
    lctx.fillStyle = dg; lctx.fill(d.p);
  }
  // travelling glint along the finished line
  const gk = prog(t, T.glint0, T.glint1);
  if (gk > 0 && gk < 1) {
    const head = lerp(-300, TOTAL + 300, E.inOutSine(gk));
    for (let s = Math.max(0, head - 460); s < Math.min(TOTAL, head); s += 14) {
      const a = 1 - (head - s) / 460;
      lctx.strokeStyle = rgb(C_HOT, 0.85 * a * a);
      strokeRange(lctx, s, Math.min(TOTAL, s + 14.5));
    }
  }
  // the line emerges from the dark at the left edge
  lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.globalCompositeOperation = 'destination-in';
  const em = lctx.createLinearGradient(0, 0, 170, 0);
  em.addColorStop(0, 'rgba(0,0,0,0.04)'); em.addColorStop(0.5, 'rgba(0,0,0,0.4)'); em.addColorStop(1, 'rgba(0,0,0,1)');
  lctx.fillStyle = em; lctx.fillRect(0, 0, W, H); lctx.globalCompositeOperation = 'source-over';
  // composite with a two-level bloom (and a brighter pulse when the pen lifts)
  const pulse = Math.exp(-Math.max(0, t - T.end) * 5) * prog(t, T.end - 0.05, T.end + 0.05);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  ctx.filter = 'blur(18px)'; ctx.globalAlpha = 0.5 + 0.5 * pulse; ctx.drawImage(lineCv, 0, 0);
  ctx.filter = 'blur(4px)'; ctx.globalAlpha = 0.72 + 0.3 * pulse; ctx.drawImage(lineCv, 0, 0);
  ctx.filter = 'none'; ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(lineCv, 0, 0);

  // ---------- ground reflection: the line mirrored on polished night, fading fast ----------
  {
    const gy = toScreen([0, GY])[1];
    if (gy < H - 4) {
      const r = rctx;
      r.setTransform(1, 0, 0, 1, 0, 0); r.globalCompositeOperation = 'source-over'; r.clearRect(0, 0, W, H);
      r.save(); r.translate(0, 2 * gy); r.scale(1, -1); r.drawImage(lineCv, 0, 0); r.restore();
      const rh = 92 * cam.z;
      r.globalCompositeOperation = 'destination-in';
      const fg = r.createLinearGradient(0, gy, 0, gy + rh);
      fg.addColorStop(0, 'rgba(0,0,0,0.9)'); fg.addColorStop(1, 'rgba(0,0,0,0)');
      r.fillStyle = fg; r.fillRect(0, gy + 1, W, rh);
      r.globalCompositeOperation = 'source-over';
      ctx.globalCompositeOperation = 'lighter'; ctx.filter = 'blur(1.4px)'; ctx.globalAlpha = 0.2;
      ctx.drawImage(refCv, 0, 0);
      ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
  }

  // ---------- opening ring: a pulse around the pen as it ignites ----------
  for (let k = 0; k < 2; k++) {
    const u = prog(t, k * 0.07, 0.5 + k * 0.07);
    if (u <= 0 || u >= 1) continue;
    const rad = 18 + 74 * E.outCubic(u) + k * 10;
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 2.2 * (1 - u) + 0.6; ctx.strokeStyle = `rgba(255,236,180,${(1 - u) * (1 - u) * (k ? 0.35 : 0.85)})`;
    ctx.beginPath(); ctx.arc(tipS[0], tipS[1], rad, 0, 6.2832); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- pen tip: hot core, glow, streak, sparks ----------
  if (penOn > 0) {
    ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 36; k++) {
      const te0 = Math.floor(t / 0.018) * 0.018 - k * 0.018;
      if (te0 < 0) break;
      const age = t - te0;
      if (age > 0.62) continue;
      const id = Math.round(te0 / 0.018);
      const p = ptAt(drawnAt(te0));
      const ang = hash(id) * Math.PI * 2, sp = 18 + hash(id + 999) * 44;
      const px = p[0] + Math.cos(ang) * sp * age, py = p[1] + Math.sin(ang) * sp * age + 30 * age * age;
      const s = toScreen([px, py]);
      const a = (1 - age / 0.62) * 0.8 * penOn * (hash(id + 5) > 0.35 ? 1 : 0);
      const r = (1.1 + hash(id + 7) * 1.5) * Math.sqrt(cam.z);
      ctx.fillStyle = `rgba(255,226,170,${a})`;
      ctx.beginPath(); ctx.arc(s[0], s[1], r, 0, Math.PI * 2); ctx.fill();
    }
    const flick = 0.93 + 0.07 * Math.sin(t * 57) * Math.sin(t * 23);
    const R = 76 * flick * (0.74 + 0.26 * cam.z);
    // shutter: smear the glow along the path it travelled during this frame
    const Lprev = drawnAt(Math.max(0, t - 0.014));
    const pp = toScreen(ptAt(Lprev));
    const N = clamp(Math.round(Math.hypot(tipS[0] - pp[0], tipS[1] - pp[1]) / 9), 1, 14);
    for (let i = 0; i < N; i++) {
      const sp = i === 0 ? tipS : toScreen(ptAt(lerp(L, Lprev, i / (N - 1 || 1))));
      ctx.globalAlpha = penOn * (i === 0 ? 1 : 0.5 / Math.sqrt(N));
      ctx.drawImage(sprite, sp[0] - R, sp[1] - R, R * 2, R * 2);
      if (i === 0) ctx.drawImage(sprite, sp[0] - R * 0.3, sp[1] - R * 0.3, R * 0.6, R * 0.6);
    }
    // anamorphic streak
    ctx.globalAlpha = penOn;
    const sg = ctx.createLinearGradient(tipS[0] - 150, 0, tipS[0] + 150, 0);
    sg.addColorStop(0, 'rgba(255,230,170,0)'); sg.addColorStop(0.5, 'rgba(255,240,205,0.5)'); sg.addColorStop(1, 'rgba(255,230,170,0)');
    ctx.fillStyle = sg; ctx.fillRect(tipS[0] - 150, tipS[1] - 1, 300, 2);
    ctx.globalAlpha = 1;
    ctx.fillStyle = `rgba(255,252,240,${penOn})`;
    ctx.beginPath(); ctx.arc(tipS[0], tipS[1], 2.6 * Math.sqrt(cam.z), 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- moon flourishes: shock ring + sparks ----------
  if (tf > 0) {
    const u = prog(t, T.fill0, T.fill0 + 0.9);
    if (u < 1) {
      ctx.setTransform(...camT); ctx.globalCompositeOperation = 'lighter';
      const rad = MR * (1.02 + 1.1 * E.outCubic(u));
      ctx.lineWidth = 3 * (1 - u) + 0.5; ctx.strokeStyle = `rgba(255,228,160,${0.55 * (1 - u) * (1 - u)})`;
      ctx.beginPath(); ctx.arc(MOON[0], MOON[1], rad, 0, 6.2832); ctx.stroke();
      for (let i = 0; i < 46; i++) {
        const a = hash(i * 3 + 500) * 6.2832, v = 160 + hash(i * 3 + 501) * 330, life = 0.55 + hash(i * 3 + 502) * 0.55;
        const age = tf - hash(i * 3 + 503) * 0.12;
        if (age <= 0 || age > life) continue;
        const k = 5, dist = v * (1 - Math.exp(-k * age)) / k;
        const x = MOON[0] + Math.cos(a) * (MR * 0.96 + dist), y = MOON[1] + Math.sin(a) * (MR * 0.96 + dist) + 40 * age * age;
        ctx.fillStyle = `rgba(255,226,165,${(1 - age / life) * 0.85})`;
        ctx.beginPath(); ctx.arc(x, y, 1.4 + hash(i + 77) * 1.8, 0, 6.2832); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over'; ctx.setTransform(1, 0, 0, 1, 0, 0);
    }
  }

  // ---------- foreground bokeh ----------
  drawDust([2]);

  // ---------- vignette + grain ----------
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  gr = ctx.createRadialGradient(960, 520, 420, 960, 540, 1250);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);

  // ---------- wordmark: letters settle in from the centre while the tracking closes ----------
  const wk = prog(t, T.word0, T.word1);
  if (wk > 0) {
    const w = wctx;
    w.setTransform(1, 0, 0, 1, 0, 0); w.clearRect(0, 0, W, H);
    const tr = lerp(0.74, 0.40, E.outCubic(wk)) * WORD_FS;
    const total = glyphW.reduce((a, b) => a + b, 0) + tr * (WORD.length - 1);
    let x = 960 - total / 2;
    const mid = (WORD.length - 1) / 2;
    w.font = `500 ${WORD_FS}px 'Cormorant Garamond'`; w.textBaseline = 'alphabetic';
    const fg = w.createLinearGradient(0, WORD_Y - WORD_FS * 0.7, 0, WORD_Y);
    fg.addColorStop(0, '#F6E6BC'); fg.addColorStop(0.55, '#E3C98C'); fg.addColorStop(1, '#BE9A58');
    [...WORD].forEach((ch, i) => {
      const d = Math.abs(i - mid) / mid;
      const u = E.outCubic(prog(t, T.word0 + d * 0.3, T.word0 + 0.6 + d * 0.3));
      if (u > 0.002) {
        w.save();
        w.globalAlpha = u;
        if (u < 0.98) w.filter = `blur(${((1 - u) * 9).toFixed(2)}px)`;
        w.fillStyle = fg;
        w.fillText(ch, x, WORD_Y + (1 - u) * 16);
        w.restore();
      }
      x += glyphW[i] + tr;
    });
    // a soft sheen crosses the letters once, in the hold
    const sk = prog(t, 3.5, 4.4);
    if (sk > 0 && sk < 1) {
      const sx = lerp(960 - total / 2 - 160, 960 + total / 2 + 160, E.inOutSine(sk));
      const sg = w.createLinearGradient(sx - 90, WORD_Y - 80, sx + 90, WORD_Y + 10);
      sg.addColorStop(0, 'rgba(255,252,240,0)'); sg.addColorStop(0.5, 'rgba(255,252,240,0.85)'); sg.addColorStop(1, 'rgba(255,252,240,0)');
      w.globalCompositeOperation = 'source-atop'; w.fillStyle = sg; w.fillRect(0, WORD_Y - 120, W, 160); w.globalCompositeOperation = 'source-over';
    }
    // version tag: 5.5 between two hairlines that draw outward
    const su = E.outCubic(prog(t, T.sub0, T.sub0 + 0.6));
    if (su > 0) {
      w.save();
      w.font = `300 38px 'Inter'`; w.textBaseline = 'middle'; w.textAlign = 'left';
      const ls = lerp(22, 7, su), txt = '5.5';
      const gw = [...txt].map(c => w.measureText(c).width);
      const tw = gw.reduce((a, b) => a + b, 0) + ls * (txt.length - 1);
      let sx = 960 - tw / 2;
      w.globalAlpha = su; w.fillStyle = '#D6BE86';
      [...txt].forEach((c, i) => { w.fillText(c, sx, SUB_Y); sx += gw[i] + ls; });
      const hl = 150 * E.outCubic(prog(t, T.sub0 + 0.1, T.sub0 + 0.8)), gap = tw / 2 + 28;
      w.globalAlpha = 0.75 * su; w.strokeStyle = '#C9AE74'; w.lineWidth = 1.4;
      w.beginPath(); w.moveTo(960 - gap, SUB_Y); w.lineTo(960 - gap - hl, SUB_Y); w.moveTo(960 + gap, SUB_Y); w.lineTo(960 + gap + hl, SUB_Y); w.stroke();
      w.fillStyle = '#E2CA92'; w.globalAlpha = su;
      for (const sgn of [-1, 1]) { const cx2 = 960 + sgn * (gap + hl); w.beginPath(); w.moveTo(cx2, SUB_Y - 3.5); w.lineTo(cx2 + 3.5, SUB_Y); w.lineTo(cx2, SUB_Y + 3.5); w.lineTo(cx2 - 3.5, SUB_Y); w.closePath(); w.fill(); }
      w.restore();
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.filter = 'blur(16px)'; ctx.globalAlpha = 0.34; ctx.drawImage(wordCv, 0, 0);
    ctx.filter = 'none'; ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(wordCv, 0, 0);
  }

  // film grain on top of everything
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.05;
  const fr = Math.floor(t * 30), ox = Math.floor(hash(fr) * 512), oy = Math.floor(hash(fr + 3) * 512);
  ctx.fillStyle = ctx.createPattern(grain, 'repeat');
  ctx.translate(-ox, -oy); ctx.fillRect(ox, oy, W, H); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

window.DURATION = 5;
window.ready = Promise.all([
  document.fonts.load("500 84px 'Cormorant Garamond'"), document.fonts.load("600 250px 'Cormorant Garamond'"), document.fonts.load("300 30px 'Inter'")
]).then(() => document.fonts.ready).then(() => {
  buildPath(); buildTiming(); measureWord();
  window.__marks = { MARK, TOTAL };
  renderAt(0);
});
window.renderAt = renderAt;
if (!location.search.includes('capture')) {
  window.ready.then(() => { const t0 = performance.now(); (function loop() { renderAt(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); })(); });
}
</script>
</body>
</html>
