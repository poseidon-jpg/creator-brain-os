<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sonnet 5.5 - Collage Cut-out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Abril+Fatface&family=Alfa+Slab+One&family=Archivo+Black&family=Bebas+Neue&family=Big+Shoulders+Stencil+Display:wght@900&family=Playfair+Display:wght@900&family=Rye&family=Space+Mono:wght@700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #8f7458; }
  canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// SONNET 5.5 - a cut-out collage animated on 12 fps steps, like a rostrum-camera stop-motion table.
// A halftone gentleman has his head snipped open, a book of verse, a stopwatch, a rocket and a nebula burst out,
// a ransom-note band spells SONNET 5.5, the red circle floods the frame into a magazine cover.
// Every pixel is a function of t only: t is snapped to 12 fps steps (n), every wobble is seeded from n.
(function () {
  const W = 1920, H = 1080, TAU = Math.PI * 2;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  // ---------- seeded helpers ----------
  function h(a, b, c) {
    let x = (a | 0) * 374761393 + (b | 0) * 668265263 + (c | 0) * 1442695041;
    x = Math.imul(x ^ (x >>> 13), 1274126177);
    return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const kf = (n, start, arr) => (n < start ? null : arr[Math.min(n - start, arr.length - 1)]);
  // stop-motion boil: every piece shifts a hair on each 12 fps step
  function J(id, n, amt) { amt = amt === undefined ? 1 : amt; return { x: (h(id, n, 1) - 0.5) * 2.8 * amt, y: (h(id, n, 2) - 0.5) * 2.8 * amt, r: (h(id, n, 3) - 0.5) * 0.010 * amt }; }

  // ---------- assets ----------
  const NAMES = ['kraft2.jpg', 'red2.jpg', 'portrait.png', 'hand.png', 'nebula.jpg', 'earth.png', 'rocket.png', 'star.png', 'hawk.png', 'rose1.png', 'rose2.png', 'butterfly.png', 'news1.png', 'news2.png', 'news3.png', 'quill.png', 'stopwatch.png', 'book.png', 'laurel.png', 'plane.png'];
  const IMG = {};
  const loadImg = (n) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('missing ' + n)); i.src = 'assets/' + n; }).then((i) => { IMG[n.split('.')[0]] = i; });
  const FONTS = ['400 80px Anton', '400 80px "Abril Fatface"', '400 80px "Alfa Slab One"', '400 80px "Archivo Black"', '400 80px "Bebas Neue"', '900 80px "Big Shoulders Stencil Display"', '900 80px "Playfair Display"', '400 80px Rye', '700 20px "Space Mono"'];

  // film grain plate and dust
  const grain = document.createElement('canvas'); grain.width = grain.height = 512;
  (function () {
    const g = grain.getContext('2d'); const id = g.createImageData(512, 512);
    for (let i = 0; i < 512 * 512; i++) { const v = Math.floor(h(i, 7, 9) * 255); id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255; }
    g.putImageData(id, 0, 0);
  })();

  // ---------- geometry of the gentleman (portrait.png local coords) ----------
  const CUT_Y = 265, PIN_X = 215, CUT_X0 = 170, CUT_X1 = 668;
  const CUT_PTS = [];
  for (let x = CUT_X0, i = 0; x <= CUT_X1; x += 11, i++) CUT_PTS.push([x, CUT_Y + (i % 2 ? 3 : -3)]);
  const JAW = [[262, 436], [542, 436], [522, 556], [286, 556]];
  const NEB_PATH = [];
  (function () {
    const keys = [[206, 268], [150, 70], [96, -150], [60, -390], [960, -390], [880, -120], [760, 60], [636, 268]];
    for (let k = 0; k < keys.length - 1; k++) {
      const [x0, y0] = keys[k], [x1, y1] = keys[k + 1];
      const len = Math.hypot(x1 - x0, y1 - y0), steps = Math.max(2, Math.round(len / 9));
      const nx = -(y1 - y0) / len, ny = (x1 - x0) / len;
      for (let s = 0; s < steps; s++) {
        const u = s / steps; const j = (h(k, s, 41) - 0.5) * 9 + Math.sin(u * 7 + k) * 3;
        NEB_PATH.push([x0 + (x1 - x0) * u + nx * j, y0 + (y1 - y0) * u + ny * j]);
      }
    }
  })();
  const RIM_PATH = NEB_PATH.map(([x, y], i) => [x + (h(i, 1, 42) - 0.5) * 7, y + (h(i, 2, 42) - 0.5) * 7]);

  const SHIFT = 2;   // items were timed for a pop on step 10; the pop now lands on step 8
  // things that burst out of the head. from/to in portrait-local coords; p = progress per 12 fps step (overshoot on purpose)
  const ITEMS = [
    { k: 'book', start: 11, from: [430, 330], to: [436, 168], sc: 0.96, rot: -0.05, ay: 0.5, p: [0.3, 0.78, 1.1, 0.97, 1], back: true },
    { k: 'earth', start: 12, from: [430, 360], to: [292, -52], sc: 0.82, rot: -0.05, p: [0.4, 0.88, 1.08, 1] },
    { k: 'rocket', start: 12, from: [430, 380], to: [700, -34], sc: 0.74, rot: 0.02, p: [0.33, 0.82, 1.08, 1] },
    { k: 'stopwatch', start: 13, from: [520, 330], to: [498, -50], sc: 0.7, rot: 0.1, p: [0.4, 0.9, 1.08, 1] },
    { k: 'hawk', start: 15, from: [1180, 10], to: [920, -50], sc: 0.78, rot: 0.04, p: [0.55, 0.95, 1.02, 1] },
    { k: 'butterfly', start: 15, from: [600, 330], to: [812, 62], sc: 0.9, rot: 0.24, p: [0.5, 1.08, 1] },
    { k: 'quill', start: 14, from: [330, 330], to: [-38, -52], sc: 0.78, rot: -0.38, p: [0.4, 0.9, 1.07, 1] },
  ];
  const ROSES = [
    { k: 'rose1', start: 13, ax: 262, ay: 296, sc: 0.86, rot: -0.14, g: [0.35, 0.8, 1.12, 1] },
    { k: 'rose2', start: 14, ax: 592, ay: 300, sc: 0.86, rot: 0.1, g: [0.4, 0.9, 1.1, 1] },
    { k: 'laurel', start: 15, ax: 676, ay: 288, sc: 0.78, rot: 0.62, g: [0.4, 0.9, 1.1, 1] },
  ];

  // ---------- drawing helpers ----------
  // two-pass paper shadow: a wide soft one and a tight contact one, same light direction everywhere
  function shadowed(c, draw, k) {
    k = k === undefined ? 1 : k;
    if (k <= 0) { draw(); return; }
    c.save(); c.shadowColor = 'rgba(26,14,6,' + (0.36 * k) + ')'; c.shadowBlur = 24 * k; c.shadowOffsetX = 7 * k; c.shadowOffsetY = 13 * k; draw(); c.restore();
    c.save(); c.shadowColor = 'rgba(16,8,2,' + (0.55 * k) + ')'; c.shadowBlur = 2.6 * k; c.shadowOffsetX = 1.2 * k; c.shadowOffsetY = 2.6 * k; draw(); c.restore();
  }
  function img(c, im, cx, cy, rot, sc, sh, ax, ay, sx) {
    ax = ax === undefined ? 0.5 : ax; ay = ay === undefined ? 0.5 : ay; sx = sx === undefined ? 1 : sx;
    c.save(); c.translate(cx, cy); c.rotate(rot); c.scale(sc * sx, sc);
    shadowed(c, () => c.drawImage(im, -im.width * ax, -im.height * ay), sh === false ? 0 : (typeof sh === 'number' ? sh : 1));
    c.restore();
  }
  function tape(c, cx, cy, w, hh, rot, id) {
    c.save(); c.translate(cx, cy); c.rotate(rot);
    const draw = () => {
      c.fillStyle = 'rgba(222,204,158,0.86)';
      c.beginPath(); c.moveTo(-w / 2, -hh / 2);
      for (let i = 0; i <= 6; i++) c.lineTo(-w / 2 + w * i / 6, -hh / 2 + (h(id, i, 5) - 0.5) * 2);
      for (let i = 0; i <= 5; i++) c.lineTo(w / 2 + (h(id, i, 6) - 0.5) * 8, -hh / 2 + hh * i / 5);
      for (let i = 6; i >= 0; i--) c.lineTo(-w / 2 + w * i / 6, hh / 2 + (h(id, i, 7) - 0.5) * 2);
      for (let i = 5; i >= 0; i--) c.lineTo(-w / 2 + (h(id, i, 8) - 0.5) * 8, -hh / 2 + hh * i / 5);
      c.closePath(); c.fill();
    };
    shadowed(c, draw, 0.35);
    c.fillStyle = 'rgba(255,250,235,0.20)'; c.fillRect(-w / 2 + 4, -hh / 2 + 4, w - 8, 5);
    c.fillStyle = 'rgba(120,96,50,0.10)'; for (let i = 0; i < 7; i++) c.fillRect(-w / 2 + 8 + i * (w / 7), -hh / 2, 1.5, hh);
    c.restore();
  }
  function paperRect(c, cx, cy, w, hh, rot, fill, id, sh) {
    c.save(); c.translate(cx, cy); c.rotate(rot);
    const jag = (i, s) => (h(id, i, s) - 0.5) * 3;
    shadowed(c, () => {
      c.fillStyle = fill; c.beginPath();
      c.moveTo(-w / 2 + jag(0, 1), -hh / 2 + jag(0, 2)); c.lineTo(w / 2 + jag(1, 1), -hh / 2 + jag(1, 2));
      c.lineTo(w / 2 + jag(2, 1), hh / 2 + jag(2, 2)); c.lineTo(-w / 2 + jag(3, 1), hh / 2 + jag(3, 2)); c.closePath(); c.fill();
    }, sh === false ? 0 : 0.8);
    c.restore();
  }
  function starburst(c, cx, cy, r1, r2, pts, seed) {
    c.beginPath();
    for (let i = 0; i < pts * 2; i++) {
      const a = i * Math.PI / pts + (h(seed, i, 3) - 0.5) * 0.08;
      const r = (i % 2 ? r1 : r2) * (0.9 + h(seed, i, 4) * 0.2);
      if (i) c.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); else c.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    }
    c.closePath();
  }
  function path(c, pts) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); }

  function scissors(c, x, y, rot, open, sc) {
    c.save(); c.translate(x, y); c.rotate(rot); c.scale(sc, sc);
    shadowed(c, () => {
      for (const s of [-1, 1]) {
        c.save(); c.rotate(s * open);
        c.fillStyle = '#d9dcde'; c.strokeStyle = '#1b1a1a'; c.lineWidth = 3;
        c.beginPath(); c.moveTo(-4, 0); c.quadraticCurveTo(34, -10 * s, 86, -2 * s); c.lineTo(86, 1 * s); c.lineTo(-4, 5 * s); c.closePath(); c.fill(); c.stroke();
        c.strokeStyle = '#1b1a1a'; c.lineWidth = 12; c.beginPath(); c.moveTo(-4, 2 * s); c.lineTo(-24, 16 * s); c.stroke();
        c.strokeStyle = '#c8161e'; c.lineWidth = 8; c.beginPath(); c.moveTo(-4, 2 * s); c.lineTo(-24, 16 * s); c.stroke();
        c.lineWidth = 12; c.strokeStyle = '#1b1a1a'; c.beginPath(); c.arc(-38, 24 * s, 15, 0, TAU); c.stroke();
        c.lineWidth = 8; c.strokeStyle = '#c8161e'; c.beginPath(); c.arc(-38, 24 * s, 15, 0, TAU); c.stroke();
        c.restore();
      }
    }, 0.6);
    c.fillStyle = '#1b1a1a'; c.beginPath(); c.arc(0, 0, 5, 0, TAU); c.fill();
    c.fillStyle = '#9aa0a4'; c.beginPath(); c.arc(0, 0, 2.5, 0, TAU); c.fill();
    c.restore();
  }

  // ransom-note letter tile
  const TILE_STYLES = [
    { bg: '#f3eee2', fg: '#141212', font: '900 FSpx "Playfair Display"' },
    { bg: '#141212', fg: '#f3eee2', font: '400 FSpx Anton' },
    { bg: '#c8161e', fg: '#f7f1e3', font: '400 FSpx "Bebas Neue"' },
    { bg: '#e9dfc4', fg: '#141212', font: '400 FSpx "Abril Fatface"' },
    { bg: '#f7f3ea', fg: '#c8161e', font: '400 FSpx "Alfa Slab One"' },
    { bg: '#141212', fg: '#e7b52c', font: '400 FSpx "Archivo Black"' },
    { bg: '#dcd3bd', fg: '#141212', font: '400 FSpx Rye' },
  ];
  function tileW(c, ch, fs, styleIdx) { c.save(); c.font = TILE_STYLES[styleIdx % TILE_STYLES.length].font.replace('FS', fs); const w = c.measureText(ch).width + fs * 0.26; c.restore(); return w; }
  function tile(c, ch, x, y, fs, styleIdx, rot, sc, id) {
    const st = TILE_STYLES[styleIdx % TILE_STYLES.length];
    c.save(); c.translate(x, y); c.rotate(rot); c.scale(sc, sc);
    c.font = st.font.replace('FS', fs);
    const w = c.measureText(ch).width + fs * 0.26, hh = fs * 1.12;
    paperRect(c, 0, 0, w, hh, 0, st.bg, id, true);
    c.fillStyle = st.fg; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(ch, 0, fs * 0.05);
    c.restore();
    return w;
  }
  function monoText(c, s, x, y, size, color, spacing, align) {
    c.save(); c.font = '700 ' + size + 'px "Space Mono"'; c.fillStyle = color; c.letterSpacing = (spacing || 0) + 'px'; c.textAlign = align || 'left'; c.textBaseline = 'alphabetic';
    c.fillText(s, x, y); c.restore();
  }

  // ---------- the gentleman composite (own layer, then placed with one shadow) ----------
  const OX = 360, OY = 520;
  const man = document.createElement('canvas'); man.width = 1700; man.height = 1500;
  const mc = man.getContext('2d');
  function clipAbove(c) { c.beginPath(); c.moveTo(-400, -700); c.lineTo(1200, -700); c.lineTo(1200, CUT_Y); for (let i = CUT_PTS.length - 1; i >= 0; i--) c.lineTo(CUT_PTS[i][0], CUT_PTS[i][1]); c.lineTo(-400, CUT_Y); c.closePath(); c.clip(); }
  function clipBelow(c, withoutJaw) {
    c.beginPath(); c.moveTo(-400, 1300); c.lineTo(1200, 1300); c.lineTo(1200, CUT_Y); for (let i = CUT_PTS.length - 1; i >= 0; i--) c.lineTo(CUT_PTS[i][0], CUT_PTS[i][1]); c.lineTo(-400, CUT_Y); c.closePath();
    if (withoutJaw) { c.moveTo(JAW[0][0], JAW[0][1]); for (let i = JAW.length - 1; i >= 1; i--) c.lineTo(JAW[i][0], JAW[i][1]); c.closePath(); }
    c.clip(withoutJaw ? 'evenodd' : 'nonzero');   // even-odd, so the jaw really is a hole in the body layer
  }
  function stitch(c, x0, x1, y) {
    c.save(); c.lineJoin = 'round';
    c.strokeStyle = '#efe9da'; c.lineWidth = 9; c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke();
    c.setLineDash([9, 7]); c.strokeStyle = '#2a2320'; c.lineWidth = 2.4; c.beginPath(); c.moveTo(x0 + 4, y); c.lineTo(x1 - 4, y); c.stroke();
    c.restore();
  }
  function itemPos(it, n) {
    const p = kf(n + SHIFT, it.start, it.p); if (p === null) return null;
    return { p, x: it.from[0] + (it.to[0] - it.from[0]) * p, y: it.from[1] + (it.to[1] - it.from[1]) * p };
  }
  function drawItem(c, it, n) {
    const o = itemPos(it, n); if (!o) return;
    const jx = J(it.k.length * 13 + it.start, n, 1);
    const bob = n + SHIFT > it.start + 5 ? Math.sin(n * 0.85 + it.start) * 2.4 : 0;
    // quick fliers get a ghost trail while they are still travelling
    const prev = itemPos(it, n - 1);
    const moving = prev && Math.abs(o.p - prev.p) > 0.18;
    const flap = it.k === 'butterfly' ? (n % 2 ? 1 : 0.62) : 1;
    if (moving) {
      for (let g = 2; g >= 1; g--) {
        const q = o.p - (o.p - prev.p) * (g * 0.34);
        c.save(); c.globalAlpha = 0.20;
        img(c, IMG[it.k], lerp(it.from[0], it.to[0], q), lerp(it.from[1], it.to[1], q), it.rot, it.sc * (0.7 + 0.3 * Math.min(q, 1)), 0, it.ax, it.ay, flap);
        c.restore();
      }
    }
    img(c, IMG[it.k], o.x + jx.x, o.y + jx.y + bob, it.rot + jx.r * 3, it.sc * (0.7 + 0.3 * Math.min(o.p, 1.1)), 0.9, 0.5, it.ay === undefined ? 0.5 : it.ay, flap);
  }
  function drawMan(st) {
    const c = mc; const P = IMG.portrait; const n = st.n;
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, man.width, man.height);
    c.translate(OX, OY);
    if (!st.cut) {
      c.drawImage(P, 0, 0);
      return;
    }
    // nebula window bursting upward from the cut
    if (st.neb > 0) {
      const s = st.neb, sx = 0.45 + 0.55 * Math.min(s, 1.06), cxw = 421;
      const tr = (pts) => pts.map(([x, y]) => [cxw + (x - cxw) * sx, CUT_Y + (y - CUT_Y) * s]);
      shadowed(c, () => { c.strokeStyle = '#efe9da'; c.fillStyle = '#efe9da'; c.lineWidth = 14; c.lineJoin = 'round'; path(c, tr(RIM_PATH)); c.fill(); c.stroke(); }, 0.9);
      c.save(); path(c, tr(NEB_PATH)); c.clip();
      const nb = IMG.nebula;
      const winTop = CUT_Y + (-390 - CUT_Y) * s;
      const need = CUT_Y - winTop + 70;              // the picture always reaches the top of the growing window
      const nh = Math.max(1180 * sx * nb.height / nb.width, need), nw = nh * nb.width / nb.height;
      c.drawImage(nb, cxw - nw / 2 - 20, winTop - 12, nw, nh);
      // sparkles twinkle in the nebula once it is open
      if (n >= T.pop + 4) {
        for (let i = 0; i < 9; i++) {
          if (h(n, i, 71) < 0.42) continue;
          const sx0 = 250 + h(i, 1, 72) * 560, sy0 = -170 + h(i, 2, 72) * 250, r = 7 + h(n, i, 73) * 13;
          c.fillStyle = 'rgba(255,248,226,0.95)'; c.beginPath();
          c.moveTo(sx0, sy0 - r); c.lineTo(sx0 + r * 0.17, sy0 - r * 0.17); c.lineTo(sx0 + r, sy0); c.lineTo(sx0 + r * 0.17, sy0 + r * 0.17);
          c.lineTo(sx0, sy0 + r); c.lineTo(sx0 - r * 0.17, sy0 + r * 0.17); c.lineTo(sx0 - r, sy0); c.lineTo(sx0 - r * 0.17, sy0 - r * 0.17); c.closePath(); c.fill();
        }
      }
      c.shadowColor = 'rgba(0,0,0,0.6)'; c.shadowBlur = 18; c.strokeStyle = 'rgba(0,0,0,0.55)'; c.lineWidth = 6;
      path(c, tr(NEB_PATH)); c.stroke();
      c.restore();
    }
    // things that sit behind the forehead
    for (const it of ITEMS) if (it.back) drawItem(c, it, n);
    // the lid (top of the head) swings up around the brass pin; its stitched cut edge comes up with it
    c.save();
    c.translate(PIN_X, CUT_Y); c.rotate(st.lid); c.translate(-PIN_X, -CUT_Y);
    shadowed(c, () => { c.save(); clipAbove(c); c.drawImage(P, 0, 0); c.restore(); }, 0.8);
    if (st.lid < -0.5) stitch(c, CUT_PTS[2][0] + 30, 628, CUT_Y);
    c.restore();
    for (const it of ITEMS) if (!it.back) drawItem(c, it, n);
    // face and body; the jaw is its own cut piece so it can flap
    const jaw = st.jaw || 0;
    shadowed(c, () => {
      if (jaw > 0) {
        c.save(); c.fillStyle = '#1c0908'; path(c, JAW); c.fill(); c.restore();
        c.save(); clipBelow(c, true); c.drawImage(P, 0, 0); c.restore();
        c.save(); c.fillStyle = '#efe9da'; c.fillRect(300, 437, 206, 7);
        c.fillStyle = '#1c0908'; for (let x = 318; x < 500; x += 22) c.fillRect(x, 437, 2, 7); c.restore();
        c.save(); c.translate(0, jaw); path(c, JAW); c.clip(); c.drawImage(P, 0, 0); c.restore();
      } else {
        c.save(); clipBelow(c, false); c.drawImage(P, 0, 0); c.restore();
      }
    }, 0.5);
    stitch(c, CUT_PTS[2][0] + 30, 628, CUT_Y);
    // roses and laurel sprout from the cut edge, in front of the forehead
    for (const r of ROSES) {
      const g = kf(n + SHIFT, r.start, r.g); if (g === null) continue;
      const jx = J(r.k.length * 31 + r.ax, n, 1);
      img(c, IMG[r.k], r.ax + jx.x, r.ay + jx.y + Math.sin(n * 0.7 + r.ax) * 1.6, r.rot + jx.r * 2, r.sc * g, 0.8, 0.5, 0.94);
    }
    // brass paper fastener
    c.save();
    const pg = c.createRadialGradient(PIN_X - 3, CUT_Y - 3, 1, PIN_X, CUT_Y, 11);
    pg.addColorStop(0, '#fff2b0'); pg.addColorStop(0.45, '#caa13a'); pg.addColorStop(1, '#6e5212');
    c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = 3; c.shadowOffsetY = 2;
    c.fillStyle = pg; c.beginPath(); c.arc(PIN_X, CUT_Y, 10.5, 0, TAU); c.fill(); c.restore();
  }
  function placeMan(x, y, sc, rot, jit, shk) {
    ctx.save(); ctx.translate(x + jit.x, y + jit.y); ctx.rotate(rot + jit.r); ctx.scale(sc, sc);
    shadowed(ctx, () => ctx.drawImage(man, -OX, -OY), shk === undefined ? 1.1 : shk);
    ctx.restore();
  }

  // ---------- timeline ----------
  const MX = 540, MY = 175;             // portrait local (0,0) on screen, kraft scene
  const T = {
    hand: 0, label: 3, snip0: 4, pop: 8, fast: 9, band: 15, sweep: 27, cover: 31, mast: 34, mono: 35, sticker: 36, price: 39, hello: 40,
  };
  const discR = (n) => (n < 27 ? 348 : [330, 430, 660, 980, 1450][Math.min(n - 27, 4)]);

  // ---------- scene: the kraft desk ----------

      const j = J(216, n);
      const bs = kf(n, T.hello, [0.6, 1.12, 1]);
      ctx.save(); ctx.translate(1222 + j.x, 610 + j.y); ctx.rotate(-0.08 + j.r); ctx.scale(bs, bs);
      shadowed(ctx, () => {
        ctx.fillStyle = '#f3eee2'; ctx.beginPath();
        ctx.moveTo(-134, -46); ctx.lineTo(134, -52); ctx.lineTo(138, 44); ctx.lineTo(56, 46); ctx.lineTo(108, 84); ctx.lineTo(18, 46); ctx.lineTo(-130, 48); ctx.closePath(); ctx.fill();
      }, 0.8);
      ctx.fillStyle = '#141212'; ctx.font = '400 74px Anton'; ctx.letterSpacing = '2px'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('HELLO', 2, 0);
      ctx.restore();
    }
  }

  // ---------- frame ----------
  function camera(n) {
    // stepped camera-table drift, a punch-in at the pop, a thump when the cover lands
    let s = 1.012 + n * 0.00052;
    let tx = 0, ty = 0;
    const punch = kf(n, T.pop, [0.05, 0.075, 0.05, 0.03, 0.016, 0.006]);
    if (punch !== null && n < T.pop + 6) { s += punch; const a = [10, 14, 9, 6, 3, 1][n - T.pop]; tx = (h(n, 1, 99) - 0.5) * a; ty = (h(n, 2, 99) - 0.5) * a; }
    const thump = n === T.mast ? 8 : n === T.mast + 1 ? 4 : 0;
    if (thump) { ty += thump; s += 0.012; }
    if (n >= 40) s = 1.034 + (n - 40) * 0.0011;
    return { s, tx, ty };
  }
  function renderAt(t) {
    t = clamp(t, 0, 4.9999);
    const n = Math.floor(t * 12 + 1e-6);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.shadowColor = 'rgba(0,0,0,0)'; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
    ctx.letterSpacing = '0px';
    const cam = camera(n);
    ctx.save(); ctx.translate(960 + cam.tx, 540 + cam.ty); ctx.scale(cam.s, cam.s); ctx.translate(-960, -540);
    if (n < T.cover) {
      drawSceneA(n); drawOverlaysA(n);
    } else {
      // the red circle has flooded the frame: it is the cover now
      drawCoverBase(n);
      drawCoverUnder(n);
      drawPlane(n);
      const g = manGroupPos(n);
      const jit = J(210, n, 0.8);
      if (g.p < 0.99) {
        // smear: the gentleman is travelling, ghost him along the path
        const gp = kf(n - 1, T.cover, MOVE) || 0;
        for (let q = 2; q >= 1; q--) {
          const pp = g.p - (g.p - gp) * (q * 0.34);
          ctx.save(); ctx.globalAlpha = 0.22;
          drawMan(manStateB(n)); placeMan(lerp(MX, COVER_X, pp), lerp(MY, COVER_Y, pp), lerp(1, COVER_S, pp), 0, jit, 0);
          ctx.restore();
        }
      }
      drawMan(manStateB(n));
      placeMan(g.x, g.y, g.s, 0, jit);
      // the red circle's last growth step is still on screen as the kraft goes (n === T.cover only)
      drawMasthead(n);
      drawCoverOverlays(n);
      if (n === T.cover) { /* the flood completes under the man, nothing extra */ }
    }
    // dust and hairs on the lens, different on every step
    for (let i = 0; i < 7; i++) {
      if (h(n, i, 31) < 0.55) continue;
      const x = h(n, i, 32) * W, y = h(n, i, 33) * H, r = 0.8 + h(n, i, 34) * 2.2, light = h(n, i, 35) > 0.5;
      ctx.fillStyle = light ? 'rgba(255,246,228,0.5)' : 'rgba(20,12,8,0.45)';
      ctx.beginPath(); ctx.ellipse(x, y, r, r * (0.6 + h(n, i, 36) * 0.8), h(n, i, 37) * 3, 0, TAU); ctx.fill();
    }
    if (h(n, 9, 38) > 0.9) {
      ctx.strokeStyle = 'rgba(20,12,8,0.35)'; ctx.lineWidth = 1.1; ctx.beginPath();
      const x = h(n, 10, 38) * W, y = h(n, 11, 38) * H; ctx.moveTo(x, y);
      ctx.bezierCurveTo(x + 30, y - 18, x + 70, y + 24, x + 110, y - 6); ctx.stroke();
    }
    ctx.restore();
    // print grain + vignette + a faint exposure flicker, re-rolled every step
    ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = 0.32;
    const gx = Math.floor(h(n, 1, 55) * 512), gy = Math.floor(h(n, 2, 55) * 512);
    for (let y = -gy; y < H; y += 512) for (let x = -gx; x < W; x += 512) ctx.drawImage(grain, x, y);
    ctx.restore();
    const vg = ctx.createRadialGradient(960, 520, 520, 960, 540, 1250);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(24,12,4,0.42)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    const fl = (h(n, 5, 56) - 0.5) * 0.05;
    ctx.fillStyle = fl > 0 ? 'rgba(255,240,215,' + fl + ')' : 'rgba(0,0,0,' + (-fl) + ')'; ctx.fillRect(0, 0, W, H);
  }

  window.DURATION = 5;
  window.ready = Promise.all([...NAMES.map(loadImg), ...FONTS.map((f) => document.fonts.load(f))]).then(() => document.fonts.ready).then(() => { renderAt(0); });
  window.renderAt = renderAt;
  if (!location.search.includes('capture')) {
    window.ready.then(() => { const t0 = performance.now(); (function loop() { renderAt(((performance.now() - t0) / 1000) % 5); requestAnimationFrame(loop); })(); });
  }
})();
</script>
</body>
