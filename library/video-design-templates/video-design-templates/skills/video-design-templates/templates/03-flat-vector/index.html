</head>
<body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
'use strict';
/* =====================================================================
   SONNET 5.5 - FLAT VECTOR
   One continuous take, one coral dot. Every frame is drawn by renderAt(t)
   from t alone (closed-form springs, seeded noise, no clock, no timers).
   dot falls -> bounces up into the sun -> city springs up -> dive into a
   lit window -> a person gets a ping -> coral wipe -> four fact panels ->
   panels collapse into the dot -> the dot lands as the o of "Sonnet".
   ===================================================================== */

/* ---------- palette (sampled from the original) ---------- */
const BLUE = '#2A1EF4', BLUE_L = '#4B42F6', BLUE_LL = '#6259F9',
      CORAL = '#F14B4F', CORAL_D = '#D63A40',
      MINT = '#3AFEAC', MINT_D = '#26DB93',
      YEL = '#F9CB32', YEL_D = '#E4B31F',
      CREAM = '#FDF6E3', CREAM_D = '#ECE4CD',
      NAVY = '#131231', NAVY_W = '#2B2A63', LAV = '#CFCBFF',
      PEACH = '#FFC8A6', PEACH_D = '#EFA882';
const GROUND = 930;

/* ---------- timeline (seconds) ---------- */
const TL = {
  HIT: 0.34, SQ: 0.13, UP1: 0.84,         // dot lands, squashes, reaches the sun
  WIN: 0.78,                              // the tower window lights up
  D0: 0.98, D1: 1.42,                     // dive into the window
  TB: 1.50, TG: 1.58,                     // phone buzz, glance and reach
  W0: 1.76, W1: 1.93, I1: 2.15,           // coral wipe grows, then collapses onto the first panel
  L: [2.15, 2.28, 2.41, 2.54],            // dot lands on panel 1..4 (clockwise)
  ROUND0: 2.72, COL0: 2.80, COL1: 2.97,   // panels round into circles, then collapse
  LEAP0: 2.99, LAND: 3.21                 // dot leaps and lands as the o
};

/* ---------- helpers ---------- */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('s');
const f = v => Math.round(v * 1000) / 1000;
const f5 = v => Math.round(v * 100000) / 100000;
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}
const G = (parent, attrs) => el('g', attrs || {}, parent);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  inQuad: x => x * x,
  outQuad: x => 1 - (1 - x) * (1 - x),
  inCubic: x => x * x * x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuart: x => 1 - Math.pow(1 - x, 4),
  inOutQuart: x => x < .5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2,
  inOutQuint: x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2,
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  outBack: (x, s = 1.7) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
};
// underdamped spring 0 -> 1 with zero start velocity: w = stiffness, z = damping ratio (lower = bouncier)
function spr(tau, w = 26, z = 0.45) {
  if (tau <= 0) return 0;
  if (tau > 1.6) return 1;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
}
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(5505);
function show(e, on) { if (e._on !== on) { e._on = on; e.setAttribute('display', on ? 'inline' : 'none'); } }
function TS(e, cx, cy, sx, sy) {
  e.setAttribute('transform', `translate(${f(cx)} ${f(cy)}) scale(${f5(Math.max(0.0001, sx))} ${f5(Math.max(0.0001, sy))}) translate(${f(-cx)} ${f(-cy)})`);
}
function blobT(e, x, y, ang, v, h) {
  e.setAttribute('transform', `translate(${f(x)} ${f(y)}) rotate(${f(ang)}) scale(${f5(v)} ${f5(h)})`);
}
// keyframes with smoothstep between them
function kf(u, k) {
  if (u <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) {
    if (u <= k[i][0]) { const a = k[i - 1], b = k[i]; const w = (u - a[0]) / (b[0] - a[0]); const s = w * w * (3 - 2 * w); return a[1] + (b[1] - a[1]) * s; }
  }
  return k[k.length - 1][1];
}
const mctx = document.createElement('canvas').getContext('2d');
function mw(str, size, weight) { mctx.font = `${weight || 700} ${size}px Fredoka`; return mctx.measureText(str).width; }

/* =====================================================================

{

const rays = [];
for (let i = 0; i < 12; i++) rays.push(el('line', { stroke: CORAL, 'stroke-width': 13, 'stroke-linecap': 'round' }, sunG));

[[330, 250, 1.0, -1], [880, 150, 0.7, 1], [1760, 500, 0.8, 1], [70, 520, 0.6, -1]].forEach(([x, y, s, dir]) => clouds.push({ g: cloud(cloudG, s), x, y, dir }));

// buildings

const buildings = [];
const BDEF = [

  { x: 492, w: 150, h: 405, c: CORAL, sh: CORAL_D, win: [2, 5, [CORAL_D, CORAL_D, YEL], 12], cap: 'round' },
  { x: 668, w: 178, h: 560, c: YEL, sh: YEL_D, win: [3, 8, [YEL_D, YEL_D, CREAM], 13], cap: 'antenna' },
  { x: 850, w: 236, h: 640, c: NAVY, sh: '#0C0B26', win: [2, 9, [NAVY_W, NAVY_W, NAVY_W, YEL], 13], cap: 'billboard' },
  { x: 1092, w: 165, h: 410, c: MINT, sh: MINT_D, win: [2, 5, [MINT_D, MINT_D, YEL], 12], cap: 'tri' },

  { x: 1690, w: 200, h: 255, c: CORAL, sh: CORAL_D, win: [3, 3, [YEL, CORAL_D, YEL], 12], cap: 'flat' },
];
const WINX = 968, WINY = 520, WW = 200, WH = 112.5;   // the lit window we dive into (16:9)
BDEF.forEach((b, i) => {
  const g = G(bldG);
  const top = GROUND - b.h;
  if (b.cap === 'round') {
    el('path', { d: `M${b.x} ${GROUND + 10} V${top + b.w / 2} A${b.w / 2} ${b.w / 2} 0 0 1 ${b.x + b.w} ${top + b.w / 2} V${GROUND + 10} Z`, fill: b.c }, g);
    el('path', { d: `M${b.x + b.w * 0.8} ${GROUND + 10} V${top + b.w / 2 + 6} A${b.w / 2} ${b.w / 2} 0 0 0 ${b.x + b.w * 0.8} ${top + b.w * 0.1} A${b.w / 2} ${b.w / 2} 0 0 1 ${b.x + b.w} ${top + b.w / 2} V${GROUND + 10} Z`, fill: b.sh }, g);
  } else {
    el('rect', { x: b.x, y: top, width: b.w, height: b.h + 10, fill: b.c }, g);
    el('rect', { x: b.x + b.w * 0.82, y: top, width: b.w * 0.18, height: b.h + 10, fill: b.sh }, g);
  }
  if (b.cap === 'block') {
    el('rect', { x: b.x + 26, y: top - 44, width: b.w - 52, height: 46, fill: b.c }, g);
    el('rect', { x: b.x + b.w - 26 - 20, y: top - 44, width: 20, height: 46, fill: b.sh }, g);
    el('rect', { x: b.x + b.w / 2 - 22, y: GROUND - 64, width: 44, height: 64, rx: 6, fill: CREAM_D }, g);
  }
  if (b.cap === 'antenna') {
    el('rect', { x: b.x + 44, y: top - 30, width: b.w - 88, height: 32, fill: YEL_D }, g);
    el('line', { x1: b.x + b.w / 2, y1: top - 30, x2: b.x + b.w / 2, y2: top - 120, stroke: NAVY, 'stroke-width': 6, 'stroke-linecap': 'round' }, g);
    b.tip = el('circle', { cx: b.x + b.w / 2, cy: top - 124, r: 10, fill: CORAL }, g);
    el('rect', { x: b.x + b.w / 2 - 22, y: GROUND - 60, width: 44, height: 60, rx: 6, fill: YEL_D }, g);
  }
  if (b.cap === 'billboard') {
    el('line', { x1: b.x + 40, y1: top, x2: b.x + 40, y2: top - 34, stroke: NAVY_W, 'stroke-width': 8 }, g);
    el('line', { x1: b.x + b.w - 40, y1: top, x2: b.x + b.w - 40, y2: top - 34, stroke: NAVY_W, 'stroke-width': 8 }, g);
    b.board = G(g);
    el('rect', { x: b.x - 18, y: top - 110, width: b.w + 36, height: 76, rx: 16, fill: CREAM }, b.board);
    b.boardLogo = G(b.board);
    el('rect', { x: b.x + b.w / 2 - 26, y: GROUND - 62, width: 52, height: 62, fill: NAVY_W }, g);

  if (b.cap === 'tri') {
    el('path', { d: `M${b.x - 10} ${top + 2} L${b.x + b.w / 2} ${top - 92} L${b.x + b.w + 10} ${top + 2} Z`, fill: MINT_D, 'stroke-linejoin': 'round', stroke: MINT_D, 'stroke-width': 8 }, g);
    el('path', { d: `M${b.x - 10} ${top + 2} L${b.x + b.w / 2} ${top - 92} L${b.x + b.w * 0.5} ${top + 2} Z`, fill: MINT, 'stroke-linejoin': 'round', stroke: MINT, 'stroke-width': 8 }, g);
  }
  if (b.cap === 'dome') {
    el('path', { d: `M${b.x + 6} ${top + 2} A${b.w / 2 - 6} ${b.w / 2 - 6} 0 0 1 ${b.x + b.w - 6} ${top + 2} Z`, fill: CREAM_D }, g);

  }

  }
  if (b.cap === 'ac') {
    el('rect', { x: b.x - 8, y: top - 14, width: b.w + 16, height: 16, rx: 4, fill: b.sh }, g);

  // windows

  const dx = (b.w * 0.82 - 50) / Math.max(1, cols - 1);
  const wy0 = top + (b.cap === 'round' ? b.w * 0.55 : 58);
  const dy = 58;
  const nRows = Math.min(rows, Math.floor((GROUND - 90 - wy0) / dy) + 1);
  const rr = mulberry32(100 + i);
  b.winEls = [];
  for (let j = 0; j < nRows; j++) for (let k = 0; k < cols; k++) {
    const wx = b.x + 25 + k * dx, wy = wy0 + j * dy;

    const e = el('circle', { cx: wx, cy: wy, r: r, fill: c }, g);

  }
  b.g = g; b.cx = b.x + b.w / 2; b.top = top;
  buildings.push(b);
});

// trees
const treeG = G(city);
const trees = [];
[[40, 1.0], [250, 0.9], [482, 1.05], [657, 0.85], [1080, 0.95], [1272, 1.0], [1497, 0.9], [1680, 1.05], [1905, 0.9]].forEach(([x, s]) => {

});

// road: sidewalk, seams, lane, dashes

el('rect', { x: -1200, y: GROUND, width: 4300, height: 400, fill: CREAM }, roadG);

const seams = G(roadG);

{

const speedLines = G(city);
const sl = [0, 1, 2].map(() => el('line', { stroke: CREAM, 'stroke-width': 7, 'stroke-linecap': 'round' }, speedLines));

/* ---------- the lit window we dive into (holds the whole room, scaled down) ---------- */

/* =====================================================================

const RM = {};
const RS = 1.22;   // the desk set (person, laptop, phone, plant) is drawn 22% larger so the person fills the frame
(function buildRoom() {

  const wg = G(WGRP, { 'clip-path': 'url(#rWinClip)' });
  [[96, 330, 70], [180, 380, 60], [250, 300, 70], [330, 360, 56], [394, 316, 80]].forEach(([x, y, w]) =>
    el('rect', { x, y: 576 - (576 - y) , width: w, height: 576 - y + 4, fill: BLUE_L }, wg));
  RM.sun = el('circle', { cx: 410, cy: 280, r: 36, fill: CORAL }, wg);
  RM.wcloud = G(wg); el('rect', { x: -40, y: -8, width: 80, height: 24, rx: 12, fill: CREAM }, RM.wcloud);
  el('circle', { cx: -10, cy: -6, r: 16, fill: CREAM }, RM.wcloud); el('circle', { cx: 14, cy: -12, r: 20, fill: CREAM }, RM.wcloud);
  el('rect', { x: 279, y: 194, width: 14, height: 382, fill: CREAM }, WGRP);
  el('rect', { x: 84, y: 379, width: 402, height: 14, fill: CREAM }, WGRP);

  // poem in a frame: 14 lines (a sonnet), octave then sestet
  el('rect', { x: 1572, y: 150, width: 252, height: 372, rx: 16, fill: MINT }, R);
  el('rect', { x: 1597, y: 175, width: 202, height: 322, rx: 6, fill: CREAM }, R);
  el('circle', { cx: 1698, cy: 214, r: 13, fill: CORAL }, R);

/* ---------- camera ---------- */
function camAt(t) {
  const S0 = 1.045;
  const pre = 1 + (S0 - 1) * E.inOutSine(prog(t, 0.3, TL.D0));
  let S, px, py, wx, wy;
  if (t < TL.D0) { S = pre; wx = 960; wy = 540; px = 960; py = 540; }
  else {
    const u = prog(t, TL.D0, TL.D1), e = E.inOutCubic(u);
    S = Math.exp(lerp(Math.log(S0), Math.log(S_END), e));
    wx = WINX; wy = WINY;
    const p0x = 960 + (WINX - 960) * S0, p0y = 540 + (WINY - 540) * S0;
    px = lerp(p0x, 960, e); py = lerp(p0y, 540, e);
  }
  if (t > TL.HIT && t < TL.HIT + 0.5) {
    const a = t - TL.HIT;
    py += -13 * Math.exp(-a * 17) * Math.cos(a * 62);
  }
  return { S, px, py, wx, wy };
}

const LOGF = Math.log;

function finalDot(t) {
  const T = TL, tau = t - T.LAND;

      v = 1 + 0.16 * Math.abs(1 - 2 * u);
      air = true;
    } else if (t >= hp.t0 + hp.d && t < hp.t0 + hp.d + 0.14) v = kf((t - hp.t0 - hp.d) / 0.14, [[0, 0.66], [0.4, 1.12], [1, 1]]);
  }
  if (!air) y += r * (1 - v);   // squashes keep the bottom of the dot on the baseline
  return { x: W.ox, y, r, v, ang: 90 };
}

function renderDot(t) {
  let vis = false, x = 0, y = 0, r = 34, ang = 0, v = 1, bellK = 0;
  const bs = bellScreen(), T = TL, r0 = BELL_R * rzNow;
  if (t >= T.W0 && t < T.W1) {                       // the coral wipe grows out of the bell bubble
    const u = prog(t, T.W0, T.W1);
    r = Math.exp(lerp(LOGF(r0), LOGF(2600), E.inQuad(u)));
    x = bs[0]; y = bs[1]; vis = true;
    bellK = 1 - prog(r, r0 * 1.15, r0 * 3.0);
  } else if (t >= T.W1 && t < T.I1) {                // ...then closes down onto the first panel
    const u = prog(t, T.W1 + 0.01, T.I1), e = lerp(u, u * u * (3 - 2 * u), 0.35);
    r = Math.exp(lerp(LOGF(2600), LOGF(34), e));
    x = lerp(bs[0], LPS[0][0], e); y = lerp(bs[1], LPS[0][1], e); vis = true;
  } else if (t >= T.I1 && t < T.L[3] + 0.05) {       // hops from panel to panel
    vis = true; r = 34;
    let seg = 0;
    for (let j = 1; j <= 3; j++) if (t >= T.L[j] - HOPT) seg = j;
    let air = false;
    if (seg === 0) { x = LPS[0][0]; y = LPS[0][1]; }
    else {
      const hp = HOPS[seg], u = prog(t, T.L[seg] - HOPT, T.L[seg]);
      [x, y] = qpoint(hp.a, hp.b, hp.H, u);
      if (u < 1) {
        air = true;
        const [x2, y2] = qpoint(hp.a, hp.b, hp.H, clamp(u + 0.02, 0, 1)), [x1, y1] = qpoint(hp.a, hp.b, hp.H, clamp(u - 0.02, 0, 1));
        const vx = x2 - x1, vy = y2 - y1, sp = Math.hypot(vx, vy) / (0.04 * HOPT);
        ang = Math.atan2(vy, vx) * 180 / Math.PI; v = 1 + 0.9 * clamp(sp / 5500, 0, 1);
      }
    }
    if (!air) {                                       // squash after the landing that just happened
      let j = 0; for (let k = 1; k <= 3; k++) if (t >= T.L[k]) j = k;
      const tau = t - T.L[j];
      ang = 90;
      if (tau < 0.1) { v = kf(tau / 0.1, [[0, 0.55], [0.4, 1.2], [1, 1]]); y += r * (1 - v); }
    }
    if (t >= T.L[3]) vis = t < T.L[3] + 0.04;        // the last landing is absorbed by the coral circle
  } else if (t >= T.COL1 && t < T.LAND) {            // the coral circle is the dot again: it leaps onto the o
    vis = true; r = 40; ang = 90;
    if (t < T.LEAP0) { x = 960; y = 540; }
    else {
      const u = prog(t, T.LEAP0, T.LAND);
      const A = [960, 540], B = [W.ox, W.oy];
      [x, y] = qpoint(A, B, 360, u);
      const [x2, y2] = qpoint(A, B, 360, clamp(u + 0.02, 0, 1)), [x1, y1] = qpoint(A, B, 360, clamp(u - 0.02, 0, 1));
      const vx = x2 - x1, vy = y2 - y1, sp = Math.hypot(vx, vy) / (0.04 * (T.LAND - T.LEAP0));
      ang = Math.atan2(vy, vx) * 180 / Math.PI; v = 1 + 0.8 * clamp(sp / 2600, 0, 1);
    }
  } else if (t >= T.LAND) {
    const s = finalDot(t);
    vis = true; x = s.x; y = s.y; r = s.r; v = s.v; ang = s.ang;
  }
  show(aDot, vis);
  if (vis) { aDot.setAttribute('r', f(r)); blobT(aDot, x, y, ang, v, Math.pow(v, -0.8)); }
  // the cream bell that rides on the wipe
  show(wipeBell, vis && bellK > 0.01 && t < T.W1);
  if (bellK > 0.01) {
    wipeBell.setAttribute('transform', `translate(${f(bs[0])} ${f(bs[1] + 2 * RS * r / (BELL_R))}) scale(${f(r / 52)})`);
    wipeBell.setAttribute('opacity', f(bellK));
  }
}

function ringAt(e, t, t0, maxR, r0, sw, dur = 0.6) {
  const u = prog(t, t0, t0 + dur);
  show(e, t >= t0 && u < 1);
  e.setAttribute('cx', f(W.ox)); e.setAttribute('cy', f(W.oy));
  e.setAttribute('r', f(lerp(r0, maxR, E.outCubic(u))));
  e.setAttribute('stroke-width', f(lerp(sw, 2, u))); e.setAttribute('opacity', f(1 - E.inQuad(u)));
}

function renderWord(t) {
  const on = t >= TL.COL1 - 0.1;
  show(gS3, on);
  if (!on || !W.letters.length) return;
  const T = TL;
  // faint shapes come back as bookends
  s3deco.forEach((d, i) => {
    const k = clamp(spr(t - (T.LAND - 0.1 + i * 0.04), 24, 0.5), 0, 1.3);
    show(d.e, k > 0.001);
    const dy = Math.sin(t * 2.2 + i) * 8;
    d.e.setAttribute('transform', `translate(${d.x} ${f(d.y + dy)}) rotate(${f(d.r0 + d.dr * t)}) scale(${f5(Math.max(0.001, k))})`);
  });
  const land1 = HOPS_F[0].t0 + HOPS_F[0].d, land2 = HOPS_F[1].t0 + HOPS_F[1].d;
  W.letters.forEach(L => {
    const dist = Math.abs(L.i - 1);
    const tau = t - (T.COL1 - 0.02 + dist * 0.028);
    const sy = spr(tau, 24, 0.42);
    const sx = 1 - 0.3 * (sy - 1);
    const wv = (t0, a) => -a * Math.sin(Math.PI * prog(t, t0 + dist * 0.03, t0 + 0.2 + dist * 0.03));
    const idle = 2.5 * Math.sin(t * 3.4 + L.i * 0.85) * prog(t, 3.7, 4.0);
    const wave = wv(T.LAND, 12) + wv(land1, 7) + wv(land2, 4) + idle;
    show(L.g, tau > 0);
    L.g.setAttribute('transform', `translate(${f(L.cx)} ${W.base}) scale(${f5(Math.max(0.001, sx))} ${f5(Math.max(0.001, sy))}) translate(${f(-L.cx)} ${f(-W.base + wave)})`);
  });
  ringAt(ringA, t, T.LAND, W.Ro + 150, W.Ro, 14);
  ringAt(ringB, t, land1, W.Ro + 110, W.Ro, 10, 0.5);
  // version pill
  const pp = clamp(spr(t - (T.LAND + 0.06), 24, 0.4), 0, 1.5);
  show(pillG, pp > 0.001);
  const pt = Math.max(0, t - T.LAND - 0.06);
  const wob = 9 + 7 * Math.exp(-pt * 5) * Math.sin(pt * 26) + 3 * Math.sin(t * 3.2) * prog(t, 3.7, 4.0);
  const bounce = -6 * Math.sin(Math.PI * prog(t, land1, land1 + 0.25)) - 3 * Math.sin(Math.PI * prog(t, land2, land2 + 0.2));
  pillG.setAttribute('transform', `translate(${f(W.pillX)} ${f(W.pillY + bounce)}) rotate(${f(wob)}) scale(${f5(Math.max(0.0001, pp))})`);
  // tagline rises letter by letter
  W.tag.forEach((e, i) => {
    const u = E.outCubic(prog(t, T.LAND + 0.12 + i * 0.014, T.LAND + 0.4 + i * 0.014));
    e.setAttribute('opacity', f(u));
    e.setAttribute('transform', `translate(0 ${f((1 - u) * 28)})`);
  });
  const mk = clamp(spr(t - (T.LAND + 0.5), 26, 0.45), 0, 1.4);
  TS(W.mark, 1824, 994, mk, mk);
  // twinkles around the wordmark
  W.sparks.forEach((s, i) => {
    const q = clamp(spr(t - (T.LAND + 0.3 + i * 0.07), 26, 0.5), 0, 1.3);
    const tw = Math.pow(0.5 + 0.5 * Math.sin(t * 5.2 + s.ph), 1.6);
    const sc = Math.max(0.0001, q * (0.35 + 0.65 * tw));
    show(s.g, q > 0.001);
    s.g.setAttribute('transform', `translate(${f(s.x)} ${f(s.y)}) rotate(${f(t * 24 * s.dir)}) scale(${f5(sc)})`);
  });
}

/* =====================================================================
   MASTER
   ===================================================================== */
function renderAt(t) {
  t = clamp(t, 0, 4.9999);
  const T = TL;
  const cityOn = t < T.W1 + 0.04;
  show(gCam, cityOn);
  if (cityOn) {
    renderCity(t);
    renderRoom(t);
  }
  renderGrid(t);
  renderWord(t);
  renderDot(t);
  // the finished logo drifts in very slowly so the hold never feels frozen
  const push = t >= T.LAND ? 1 + 0.03 * E.inOutSine(prog(t, T.LAND, 4.95)) : 1;
  const pt = push === 1 ? '' : `translate(960 540) scale(${f5(push)}) translate(-960 -540)`;
  gS3.setAttribute('transform', pt); gDot.setAttribute('transform', pt);
}

// how many sub-frames the recorder averages for motion blur (1 = sharp)
window.samplesAt = function (t) {
  const T = TL;
  if (t < 0.95) return 7;
  if (t >= T.D0 - 0.02 && t < T.D1 + 0.04) return 14;
  if (t >= T.TB && t < T.TB + 0.3) return 4;
  if (t >= T.W0 - 0.02 && t < T.I1 + 0.02) return 20;
  for (let k = 0; k < 4; k++) if (t >= T.L[k] - 0.05 && t < T.L[k] + 0.17) return 12;
  if (t >= T.I1 && t < T.L[3] + 0.2) return 8;
  if (t >= T.ROUND0 - 0.02 && t < T.COL1 + 0.05) return 16;
  if (t >= T.COL1 + 0.05 && t < T.LAND + 0.06) return 9;
  if (t >= T.LAND && t < T.LAND + 0.7) return 4;
  for (const hp of HOPS_F) if (t >= hp.t0 - 0.1 && t < hp.t0 + hp.d + 0.2) return 4;
  return 1;
};
// shutter, as a fraction of one frame: wide for the dive and the dot, narrow where a flat shape's edge sweeps across the frame
window.shutterAt = function (t) {
  const T = TL;
  if (t >= T.HIT + 0.04 && t < 0.95) return 0.3;
  if (t >= T.W0 - 0.02 && t < T.I1 + 0.02) return 0.3;
  for (let k = 0; k < 4; k++) if (t >= T.L[k] - 0.05 && t < T.L[k] + 0.17) return 0.2;
  if (t >= T.ROUND0 - 0.02 && t < T.COL1 + 0.05) return 0.15;
  if (t >= T.COL1 + 0.05 && t < T.LAND + 0.06) return 0.35;
  return 0.5;
};

window.DURATION = 5;
window.ready = Promise.all([document.fonts.load("700 300px 'Fredoka'"), document.fonts.load("600 46px 'Fredoka'")])
  .then(() => document.fonts.ready).then(() => { buildAfterFonts(); renderAt(0); });
window.renderAt = renderAt;
if (!location.search.includes('capture')) {
  window.ready.then(() => { const t0 = performance.now(); (function loop() { renderAt(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); })(); });
}
</script>
