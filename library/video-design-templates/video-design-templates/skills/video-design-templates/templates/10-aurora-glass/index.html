<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sonnet 5.5 - Aurora Glass</title>
<style>
  @font-face { font-family: 'Inter'; src: url('assets/inter.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
  @font-face { font-family: 'Outfit'; src: url('assets/outfit.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #04051a; }
  #c { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
(() => {
'use strict';
const W = 1920, H = 1080;
const CAPTURE = location.search.includes('capture');
window.DURATION = 5;

// ================================================================ helpers
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const sat = x => clamp(x, 0, 1);
const smooth = (a, b, x) => { const t = sat((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const eOutCubic = t => 1 - Math.pow(1 - sat(t), 3);
const eOutQuint = t => 1 - Math.pow(1 - sat(t), 5);
const eOutExpo = t => { t = sat(t); return t >= 1 ? 1 : 1 - Math.pow(2, -10 * t); };
const eInCubic = t => Math.pow(sat(t), 3);
const eInOutCubic = t => { t = sat(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eInOutQuint = t => { t = sat(t); return t < .5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2; };
const spring = (u, w = 9, z = 5.5) => u <= 0 ? 0 : 1 - Math.exp(-z * u) * (Math.cos(w * u) + (z / w) * Math.sin(w * u));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ================================================================ content canvases (drawn at 2x for crisp glass text)
const S = 2;
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.round(w * S); c.height = Math.round(h * S); const x = c.getContext('2d'); return { c, x, w, h }; }
const MAIN = makeCanvas(1040, 540), SPEED = makeCanvas(560, 330), COST = makeCanvas(640, 370), TAG = makeCanvas(150, 76);
const MAIN_SC = 0.96;   // the main card is drawn at 1040x580 and placed at 96% so the whole composition keeps breathing room
const WORD = { c: document.createElement('canvas') }; WORD.c.width = W; WORD.c.height = H; WORD.x = WORD.c.getContext('2d');

function reset(cv) {
  const x = cv.x;
  x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, cv.c.width, cv.c.height); x.setTransform(S, 0, 0, S, 0, 0);
  x.textAlign = 'left'; x.textBaseline = 'alphabetic'; x.globalAlpha = 1; x.filter = 'none';
  x.shadowColor = 'transparent'; x.shadowBlur = 0; x.shadowOffsetY = 0; x.letterSpacing = '0px';
  x.globalCompositeOperation = 'source-over';
}
function pill(ctx, x, y, w, h, fill, stroke) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.4; ctx.stroke(); }
}
function softShadow(ctx, a = 0.32, blur = 10, dy = 2) { ctx.shadowColor = `rgba(25,12,95,${a})`; ctx.shadowBlur = blur; ctx.shadowOffsetY = dy; }
function noShadow(ctx) { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }

// tiny glass ring: the brand mark, foreshadows the o of the wordmark
function brandRing(ctx, x, y, r) {
  const g = ctx.createRadialGradient(x, y, r * 0.3, x, y, r * 2.1);
  g.addColorStop(0, 'rgba(175,155,255,0.38)'); g.addColorStop(1, 'rgba(175,155,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.1, 0, Math.PI * 2); ctx.fill();
  const lg = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
  lg.addColorStop(0, '#ffffff'); lg.addColorStop(0.5, '#c4b6ff'); lg.addColorStop(1, '#78dcff');
  ctx.strokeStyle = lg; ctx.lineWidth = r * 0.36; ctx.beginPath(); ctx.arc(x, y, r * 0.76, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, r * 0.98, 0, Math.PI * 2); ctx.stroke();
}
function bolt(ctx, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(3, -17); ctx.lineTo(-9, 2); ctx.lineTo(-1, 2); ctx.lineTo(-4, 17); ctx.lineTo(9, -3); ctx.lineTo(1, -3); ctx.closePath();
  const g = ctx.createLinearGradient(0, -17, 0, 17); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#8fdcff');
  ctx.fillStyle = g; ctx.fill(); ctx.restore();
}
function tagIcon(ctx, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(-14, -2); ctx.lineTo(-14, -14); ctx.lineTo(-2, -14); ctx.lineTo(14, 2); ctx.lineTo(2, 14); ctx.closePath();
  ctx.strokeStyle = 'rgba(255,255,255,0.96)'; ctx.lineWidth = 2.6; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.96)'; ctx.beginPath(); ctx.arc(-7.5, -7.5, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

const REPLY = [["Faster", "than", "Opus", "5.5."], ["At", "half", "the", "price."]];

function drawMain(c) {
  reset(MAIN);
  const ctx = MAIN.x, w = MAIN.w;
  // header
  brandRing(ctx, 58, 56, 18);
  softShadow(ctx, 0.3, 8, 2);
  ctx.font = '600 28px Inter'; ctx.fillStyle = 'rgba(255,255,255,0.97)'; ctx.fillText('Sonnet', 92, 66);
  const sw = ctx.measureText('Sonnet').width;
  noShadow(ctx);
  pill(ctx, 92 + sw + 14, 40, 52, 32, 'rgba(255,255,255,0.16)', 'rgba(255,255,255,0.34)');
  ctx.font = '600 17px Inter'; ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.fillText('5.5', 92 + sw + 14 + 14, 62);
  ctx.font = '400 19px Inter'; ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.textAlign = 'right';
  ctx.fillText(c.thinking ? 'thinking' : 'now', w - 44, 63); ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.09)'; ctx.fillRect(40, 92, w - 80, 1);
  // user bubble
  if (c.bubble > 0.001) {
    const txt = "What's new in 5.5?";
    ctx.font = '500 28px Inter'; const tw = ctx.measureText(txt).width;
    const bw = tw + 56, bh = 60, bx = w - 44 - bw, by = 112;
    const s = 0.84 + 0.16 * c.bubble, a = sat(c.bubble * 1.6);
    ctx.save(); ctx.globalAlpha = a; ctx.translate(bx + bw, by + bh / 2 + (1 - sat(c.bubble)) * 14); ctx.scale(s, s); ctx.translate(-(bx + bw), -(by + bh / 2));
    pill(ctx, bx, by, bw, bh, 'rgba(255,255,255,0.18)', 'rgba(255,255,255,0.36)');
    softShadow(ctx, 0.25, 6, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.98)'; ctx.fillText(txt, bx + 28, by + 40);
    ctx.restore();
  }
  // typing dots
  if (c.dots > 0.001) {
    ctx.save(); ctx.globalAlpha = c.dots;
    pill(ctx, 56, 196, 104, 52, 'rgba(255,255,255,0.15)', 'rgba(255,255,255,0.26)');
    for (let i = 0; i < 3; i++) {
      const b = Math.max(0, Math.sin(c.time * 12 - i * 0.9)) * 6;
      ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.beginPath(); ctx.arc(86 + i * 22, 222 - b, 5.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  // reply, word by word, with a soft blur-in
  ctx.font = '500 56px Inter'; ctx.letterSpacing = '-0.6px';
  let wi = 0;
  REPLY.forEach((line, li) => {
    let x = 56; const y = 298 + li * 76;
    line.forEach(wd => {
      const a = sat(c.words - wi); wi++;
      const ww = ctx.measureText(wd + ' ').width;
      if (a > 0) {
        ctx.save(); const e = eOutCubic(a);
        ctx.globalAlpha = sat(a * 1.5);
        if (a < 1) ctx.filter = `blur(${((1 - e) * 9).toFixed(2)}px)`;
        softShadow(ctx, 0.42, 14, 3);
        ctx.fillStyle = '#ffffff'; ctx.fillText(wd, x, y + (1 - e) * 16);
        ctx.restore();
      }
      x += ww;
    });
  });
  ctx.letterSpacing = '0px';
  // chips
  if (c.chips > 0.001) {
    ctx.font = '500 24px Inter';
    const chips = ['139 tokens/s', '$2 in · $10 out'];
    let cx = w - 44 - chips.reduce((s, txt) => s + ctx.measureText(txt).width + 48 + 16, -16);   // right-aligned, clear of the price card
    chips.forEach((txt, i) => {
      const a = eOutCubic((c.chips - i * 0.22) * 1.5); const tw = ctx.measureText(txt).width; const cw = tw + 48;
      if (a > 0) {
        ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - a) * 14);
        pill(ctx, cx, 420, cw, 54, 'rgba(255,255,255,0.14)', 'rgba(255,255,255,0.28)');
        ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.fillText(txt, cx + 24, 455);
        ctx.restore();
      }
      cx += cw + 16;
    });
  }
}

const TICKS = (() => { const r = mulberry32(21); return Array.from({ length: 16 }, (_, i) => 0.45 + 0.55 * r() * Math.sin(Math.PI * (i + 1) / 17)); })();
function drawSpeed(c) {
  reset(SPEED);
  const ctx = SPEED.x, w = SPEED.w, t = c.time;
  bolt(ctx, 48, 42, 0.95);
  softShadow(ctx, 0.3, 8, 2);
  ctx.font = '600 27px Inter'; ctx.fillStyle = 'rgba(255,255,255,0.97)'; ctx.fillText('Speed', 78, 52);
  noShadow(ctx);
  ctx.font = '400 18px Inter'; ctx.fillStyle = 'rgba(255,255,255,0.52)'; ctx.textAlign = 'right'; ctx.fillText('tokens / second', w - 36, 51); ctx.textAlign = 'left';
  // big number
  softShadow(ctx, 0.3, 14, 3);
  ctx.font = '500 112px Inter'; ctx.letterSpacing = '-2px';
  const g = ctx.createLinearGradient(0, 80, 0, 170); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#cfe7ff');
  ctx.fillStyle = g; ctx.fillText(String(Math.round(c.speedNum)), 34, 170);
  ctx.letterSpacing = '0px'; noShadow(ctx);
  // token pulse
  const env = sat((t - 0.35) * 3);
  for (let i = 0; i < TICKS.length; i++) {
    const h = 8 + env * TICKS[i] * (0.3 + 0.7 * Math.abs(Math.sin(t * 8.5 + i * 0.7))) * 62;
    const a = 0.35 + 0.6 * (i / TICKS.length);
    ctx.fillStyle = `rgba(${Math.round(lerp(255, 120, i / 15))},${Math.round(lerp(255, 225, i / 15))},255,${a})`;
    ctx.beginPath(); ctx.roundRect(318 + i * 14.5, 122 - h / 2, 6.5, h, 3.25); ctx.fill();
  }
  // bars
  const x0 = 36, x1 = w - 36, bw = x1 - x0;
  const rows = [
    { y: 224, name: 'Sonnet 5.5', val: 139, f: c.barSon * 1.0, hero: true },
    { y: 282, name: 'Opus 5.5', val: 92, f: c.barOpus * (92 / 139), hero: false }
  ];
  rows.forEach(r => {
    ctx.font = (r.hero ? '600' : '500') + ' 19px Inter';
    ctx.fillStyle = r.hero ? 'rgba(255,255,255,0.97)' : 'rgba(255,255,255,0.58)';
    ctx.fillText(r.name, x0, r.y);
    ctx.textAlign = 'right'; ctx.fillStyle = r.hero ? 'rgba(255,255,255,0.97)' : 'rgba(255,255,255,0.58)';
    const shown = r.hero ? Math.round(c.barSon * 139) : Math.round(c.barOpus * 92);
    ctx.fillText(String(shown), x1, r.y); ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,0.13)'; ctx.beginPath(); ctx.roundRect(x0, r.y + 12, bw, 12, 6); ctx.fill();
    const fw = Math.max(0, bw * r.f);
    if (fw > 1) {
      const gr = ctx.createLinearGradient(x0, 0, x0 + bw, 0);
      if (r.hero) { gr.addColorStop(0, '#f2faff'); gr.addColorStop(1, '#5fd6ff'); } else { gr.addColorStop(0, 'rgba(255,255,255,0.5)'); gr.addColorStop(1, 'rgba(255,255,255,0.5)'); }
      ctx.fillStyle = gr; ctx.beginPath(); ctx.roundRect(x0, r.y + 12, fw, 12, 6); ctx.fill();
      if (r.hero) {
        const ox = x0 + fw, oy = r.y + 18;
        const og = ctx.createRadialGradient(ox, oy, 0, ox, oy, 30);
        og.addColorStop(0, 'rgba(225,255,255,1)'); og.addColorStop(0.3, 'rgba(100,225,255,0.85)'); og.addColorStop(1, 'rgba(60,160,255,0)');
        ctx.fillStyle = og; ctx.beginPath(); ctx.arc(ox, oy, 30, 0, Math.PI * 2); ctx.fill();
      }
    }
  });
}

function drawCost(c) {
  reset(COST);
  const ctx = COST.x, w = COST.w;
  tagIcon(ctx, 50, 42, 1);
  softShadow(ctx, 0.3, 8, 2);
  ctx.font = '600 27px Inter'; ctx.fillStyle = 'rgba(255,255,255,0.97)'; ctx.fillText('Price', 80, 52);
  noShadow(ctx);
  ctx.font = '400 18px Inter'; ctx.fillStyle = 'rgba(255,255,255,0.52)'; ctx.textAlign = 'right'; ctx.fillText('per 1M tokens', w - 40, 51); ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.09)'; ctx.fillRect(34, 80, w - 68, 1);
  const s = c.slider;
  const cols = [{ x: 44, label: 'INPUT', val: Math.round(4 * s), ghost: "$4", full: 4 }, { x: 336, label: 'OUTPUT', val: Math.round(20 * s), ghost: "$20", full: 20 }];
  cols.forEach(col => {
    ctx.font = '500 15px Inter'; ctx.letterSpacing = '2.4px'; ctx.fillStyle = 'rgba(255,255,255,0.58)'; ctx.fillText(col.label, col.x + 4, 114); ctx.letterSpacing = '0px';
    softShadow(ctx, 0.36, 14, 3);
    ctx.font = '500 92px Inter'; ctx.letterSpacing = '-2px';
    const g = ctx.createLinearGradient(0, 130, 0, 215); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#d6e4ff');
    ctx.fillStyle = g; const txt = '$' + col.val; ctx.fillText(txt, col.x, 206);
    const vw = ctx.measureText(txt).width; ctx.letterSpacing = '0px'; noShadow(ctx);
    const ga = col.val < col.full ? sat((0.9 - s) * 6) : 0;
    if (ga > 0) {
      ctx.font = '400 32px Inter'; ctx.fillStyle = `rgba(255,255,255,${0.5 * ga})`; ctx.fillText(col.ghost, col.x + vw + 14, 206);
      const gw = ctx.measureText(col.ghost).width;
      ctx.fillStyle = `rgba(255,255,255,${0.55 * ga})`; ctx.fillRect(col.x + vw + 12, 195, gw + 4, 2.2);
    }
  });
  // slider
  ctx.font = '600 23px Inter'; ctx.fillStyle = 'rgba(255,255,255,0.97)'; ctx.fillText('vs Opus 5.5', 44, 296);
  const sx0 = 232, sx1 = w - 44, sy = 288;
  ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.beginPath(); ctx.roundRect(sx0, sy - 3, sx1 - sx0, 6, 3); ctx.fill();
  const kx = sx0 + (sx1 - sx0) * s;
  const gr = ctx.createLinearGradient(sx0, 0, sx1, 0); gr.addColorStop(0, '#7f93ff'); gr.addColorStop(1, '#eaf3ff');
  ctx.fillStyle = gr; ctx.beginPath(); ctx.roundRect(sx0, sy - 3, kx - sx0, 6, 3); ctx.fill();
  const lensOn = c.knobGlass || 0;
  ctx.save(); ctx.shadowColor = 'rgba(165,205,255,0.95)'; ctx.shadowBlur = 18; ctx.globalAlpha = 1 - 0.9 * lensOn;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(kx, sy, 13, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.font = '500 18px Inter'; ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.textAlign = 'right';
  ctx.fillText(Math.round(s * 100) + '%', sx1, 338); ctx.textAlign = 'left';
}

function drawTag() {
  reset(TAG);
  const ctx = TAG.x;
  softShadow(ctx, 0.3, 8, 2);
  ctx.font = '600 38px Inter'; ctx.letterSpacing = '0.5px'; ctx.fillStyle = 'rgba(255,255,255,0.98)'; ctx.textAlign = 'center';
  ctx.fillText('5.5', TAG.w / 2, 51);
}

// ================================================================ wordmark: the o is the glass ring
const WM_WEIGHT = 230;
const WM = { size: 262, base: 600, x0: 0, letters: [], oc: [0, 0], or: 0, ringT: 20, end: 0, tagC: [0, 0], tagW: 150, tagH: 76 };
function layoutWord() {
  const ctx = WORD.x;
  ctx.font = `${WM_WEIGHT} ${WM.size}px Outfit`;
  const full = [...'Sonnet'];
  const track = WM.size * 0.018;
  const widths = full.map(ch => ctx.measureText(ch).width);
  const tot = widths.reduce((a, b) => a + b, 0) + track * (full.length - 1);
  WM.x0 = W / 2 - tot / 2;
  let x = WM.x0;
  WM.letters = full.map((ch, i) => { const r = { ch, x, w: widths[i] }; x += widths[i] + track; return r; });
  const o = WM.letters[1];
  const mo = ctx.measureText('o');
  const xh = mo.actualBoundingBoxAscent + mo.actualBoundingBoxDescent;
  WM.oc = [o.x + o.w / 2, WM.base - mo.actualBoundingBoxAscent + xh / 2];
  WM.or = xh / 2 + 3;
  WM.end = WM.x0 + tot;
  WM.tagC = [WM.end + 84, WM.base - WM.size * 0.74];
}
const WS = t => 1 + 0.028 * smooth(3.0, 5.0, t);       // slow push-in on the lockup
const wx = (x, t) => 960 + (x - 960) * WS(t);
const wy = (y, t) => 560 + (y - 560) * WS(t);
const LETTER_ORDER = [2, 3, 0, 4, 5];                    // spread from the ring: n, n, S, e, t

function drawWord(t) {
  const ctx = WORD.x;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  const ws = WS(t); ctx.setTransform(ws, 0, 0, ws, 960 * (1 - ws), 560 * (1 - ws));
  ctx.font = `${WM_WEIGHT} ${WM.size}px Outfit`; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  let any = false;
  const ringX = WM.oc[0];
  const sw0 = (t - 3.85) / 0.8;
  const glintX = sw0 > 0 && sw0 < 1 ? lerp(WM.x0 - 120, WM.end + 120, eInOutCubic(sw0)) : -1e6;
  const grad = ctx.createLinearGradient(0, WM.base - WM.size * 0.75, 0, WM.base);
  grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, '#e3e6ff');
  LETTER_ORDER.forEach((i, k) => {
    const L = WM.letters[i];
    const u = (t - (2.82 + k * 0.05)) / 0.56;
    const a = eOutQuint(u);
    if (a <= 0.001) return;
    any = true;
    const cx = L.x + L.w / 2;
    const dx = (ringX - cx) * (1 - a) * 0.95;
    ctx.save();
    ctx.globalAlpha = sat(a * 2.2);
    ctx.filter = `blur(${((1 - a) * 16).toFixed(2)}px)`;
    ctx.fillStyle = grad;
    ctx.shadowColor = 'rgba(22,12,120,0.62)'; ctx.shadowBlur = 46; ctx.shadowOffsetY = 6;     // deep indigo under-glow keeps thin letters legible on bright aurora
    ctx.fillText(L.ch, L.x + dx, WM.base + (1 - a) * 10);
    ctx.shadowColor = 'rgba(205,190,255,0.55)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 0;
    ctx.fillText(L.ch, L.x + dx, WM.base + (1 - a) * 10);
    // a travelling bloom: the letters flare as the light sweeps through the lockup
    const gl = glintX > -1e5 ? Math.exp(-Math.pow((cx - glintX) / 170, 2)) : 0;
    if (gl > 0.02) {
      ctx.shadowColor = `rgba(240,246,255,${(0.95 * gl).toFixed(3)})`; ctx.shadowBlur = 54;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(L.ch, L.x + dx, WM.base + (1 - a) * 10);
      ctx.shadowBlur = 22; ctx.fillText(L.ch, L.x + dx, WM.base + (1 - a) * 10);
    }
    ctx.restore();
  });
  // tagline
  const ta = eOutCubic((t - 3.25) / 0.55);
  if (ta > 0.001) {
    any = true;
    ctx.save(); ctx.globalAlpha = ta * 0.97; ctx.font = '400 35px Outfit'; ctx.fillStyle = '#f4f6ff'; ctx.textAlign = 'center';
    ctx.letterSpacing = `${(8 + (1 - ta) * 8).toFixed(2)}px`;
    ctx.filter = `blur(${((1 - ta) * 6).toFixed(2)}px)`;
    ctx.shadowColor = 'rgba(22,12,120,0.6)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 3;
    ctx.fillText('Faster. Half the price.', 960 + 4, WM.base + 104 + (1 - ta) * 10);
    ctx.shadowColor = 'rgba(190,200,255,0.45)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 0;
    ctx.fillText('Faster. Half the price.', 960 + 4, WM.base + 104 + (1 - ta) * 10);
    ctx.restore();
  }
  return any;
}

// ================================================================ WebGL
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false, premultipliedAlpha: false });
gl.getExtension('EXT_color_buffer_float');
gl.getExtension('EXT_color_buffer_half_float');
const VS = `#version 300 es
void main(){ vec2 p = vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2)); gl_Position = vec4(p*2.0-1.0, 0.0, 1.0); }`;

const COMMON = `#version 300 es
precision highp float;
uniform vec2 uRes;
out vec4 frag;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);

  }
}

// ================================================================ 3D card placement (with a gentle moving camera)
const FOCAL = 1900;
function cardQuad(c, cam) {
  const rx = (c.rx || 0) * Math.PI / 180, ry = (c.ry || 0) * Math.PI / 180, rz = (c.rz || 0) * Math.PI / 180, sc = c.scale || 1;
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  return [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([sx, sy_]) => {
    let x = sx * c.w / 2 * sc, y = sy_ * c.h / 2 * sc, z = 0;
    let x0 = x * Math.cos(rz) - y * Math.sin(rz), y0 = x * Math.sin(rz) + y * Math.cos(rz); x = x0; y = y0;
    let x1 = x * Math.cos(ry) + z * Math.sin(ry), z1 = -x * Math.sin(ry) + z * Math.cos(ry);
    let y2 = y * Math.cos(rx) - z1 * Math.sin(rx), z2 = y * Math.sin(rx) + z1 * Math.cos(rx);
    let X = c.x - 960 + x1, Y = c.y - 540 + y2, Z = c.z + z2;
    let Xc = X * cy + Z * sy, Zc = -X * sy + Z * cy;
    let Yc = Y * cp - Zc * sp, Zc2 = Y * sp + Zc * cp;
    Zc2 += cam.dolly;
    const s = FOCAL / (FOCAL + Zc2);
    return [960 + Xc * s, 540 + Yc * s];
  });
}
function squareToQuad(p) {
  const [p0, p1, p2, p3] = p;
  const sx = p0[0] - p1[0] + p2[0] - p3[0], sy = p0[1] - p1[1] + p2[1] - p3[1];
  const dx1 = p1[0] - p2[0], dx2 = p3[0] - p2[0], dy1 = p1[1] - p2[1], dy2 = p3[1] - p2[1];
  const den = dx1 * dy2 - dx2 * dy1;
  const g = (sx * dy2 - dx2 * sy) / den, h = (dx1 * sy - sx * dy1) / den;
  const a = p1[0] - p0[0] + g * p1[0], b = p3[0] - p0[0] + h * p3[0], c = p0[0];
  const d = p1[1] - p0[1] + g * p1[1], e = p3[1] - p0[1] + h * p3[1], f = p0[1];
  return [a, b, c, d, e, f, g, h, 1];
}
function inv3(m) {
  const [a, b, c, d, e, f, g, h, i] = m;
  const A = e * i - f * h, B = -(d * i - f * g), C = d * h - e * g;
  const det = a * A + b * B + c * C;
  return [A / det, -(b * i - c * h) / det, (b * f - c * e) / det, B / det, (a * i - c * g) / det, -(a * f - c * d) / det, C / det, -(a * h - b * g) / det, (a * e - b * d) / det];
}
function colMajor(m) { return new Float32Array([m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]]); }
function mapper(q) {
  const Hm = squareToQuad(q);
  return (u, v) => { const w = Hm[6] * u + Hm[7] * v + 1; return [(Hm[0] * u + Hm[1] * v + Hm[2]) / w, (Hm[3] * u + Hm[4] * v + Hm[5]) / w]; };
}
const quadWidth = q => Math.hypot(q[1][0] - q[0][0], q[1][1] - q[0][1]);

// ================================================================ timeline
// 0.0-0.6 cards settle, the question is asked   0.5-1.0 reply streams, speed counts up
// 0.8-1.5 price slides to half (glass knob)    1.5-2.0 a glass lens sweeps the answer
// 2.0-2.5 everything folds into the lens       2.4-3.1 orb, then ring lands as the o of Sonnet
// 2.9-3.5 the word spreads out of the ring     3.2-3.5 5.5 tag and tagline    3.5-5.0 hold with a glint
function stateAt(t) {
  const st = {};
  const fl = (ph, amp, sp = 0.9) => Math.sin(t * sp + ph) * amp;
  const intro = eOutQuint(t / 1.2);
  const m = eInCubic((t - 1.95) / 0.52);            // fold into the orb
  const mBlur = smooth(1.9, 2.4, t);
  const cam = {
    yaw: lerp(0.075, -0.012, eOutCubic(t / 2.2)) + 0.010 * Math.sin(t * 0.8),
    pitch: lerp(-0.02, 0.012, eOutCubic(t / 2.2)) + 0.008 * Math.sin(t * 0.6 + 1),
    dolly: lerp(300, -40, eOutCubic(t / 1.5))
  };
  st.cam = cam;
  st.main = { x: lerp(1185, 960, m), y: lerp(430, 540, m) + fl(0, 7), z: lerp(40, -40, intro) + m * 1700, w: MAIN.w, h: MAIN.h, scale: MAIN_SC,
    rx: 3.5 + fl(1, 1.1), ry: lerp(-15, -9, intro) + fl(2, 1.4), rz: m * -16, opacity: sat(0.95 + t * 0.6) * (1 - smooth(2.25, 2.57, t)), blur: mBlur, tint: [0.62, 0.55, 1.0], shadow: 1, radius: 36 };
  const spIn = spring(t + 0.28, 8, 6);
  st.speed = { x: lerp(100, 345, spIn) + (960 - 345) * m + fl(3, 5), y: lerp(240, 252, spIn) + (540 - 252) * m + fl(4, 7), z: 200 + m * 1700, w: SPEED.w, h: SPEED.h,
    rx: 4, ry: lerp(-24, -13, spIn) + fl(5, 1.5), rz: m * 14, opacity: sat(0.8 + t * 1.1) * (1 - smooth(2.15, 2.47, t)), blur: Math.max(0.08, mBlur), tint: [0.55, 0.5, 1.0], shadow: 0.7, radius: 32 };
  const fin = spring(t - 0.26, 8.5, 6);
  st.cost = { x: lerp(610, 960, m) + fl(6, 4), y: lerp(lerp(1350, 780, fin), 540, m) + fl(7, 5), z: -140 + m * 1700, w: COST.w, h: COST.h,
    rx: lerp(26, -4.5, fin) + fl(8, 1.2), ry: 9 + fl(9, 1.4), rz: m * -9, opacity: smooth(0.24, 0.5, t) * (1 - smooth(2.3, 2.61, t)), blur: mBlur, tint: [0.35, 0.4, 0.95], shadow: 1, radius: 34 };

  // content state
  const slider = 1 - 0.5 * eInOutCubic((t - 0.82) / 0.68);
  st.c = {
    time: t,
    bubble: spring(t + 0.2, 10, 6.5),
    dots: smooth(0.2, 0.28, t) * (1 - smooth(0.5, 0.56, t)),
    thinking: t > 0.2 && t < 0.56,
    words: Math.max(0, (t - 0.54) / 0.05),
    chips: sat((t - 1.15) / 0.42),
    speedNum: eOutCubic((t - 0.5) / 1.0) * 139,
    barOpus: eOutCubic((t - 0.42) / 0.6),
    barSon: eOutCubic((t - 0.5) / 1.0),
    slider,
    knobGlass: 0
  };
  st.glowAurora = 1.0 + 0.2 * eInOutCubic((t - 0.8) / 0.7) + 0.12 * Math.exp(-Math.pow((t - 2.5) / 0.18, 2)) + 0.08 * Math.exp(-Math.pow((t - 3.1) / 0.2, 2)) + 0.10 * smooth(3.3, 4.6, t);

  // liquid-glass knob on the price slider
  const cq = cardQuad(st.cost, cam), onCost = mapper(cq);
  const cs = quadWidth(cq) / COST.w;
  const kp = onCost((232 + (COST.w - 44 - 232) * slider) / COST.w, 288 / COST.h);
  const kOn = smooth(0.74, 0.88, t) * (1 - smooth(1.5, 1.7, t));
  st.c.knobGlass = kOn;
  st.knob = { on: kOn > 0.002, c: kp, half: [30 * cs * (1 + 0.25 * Math.sin(Math.PI * sat((t - 0.82) / 0.68))), 30 * cs], r: 30 * cs, hole: 0, mag: 1.25, opacity: kOn * st.cost.opacity, halo: 0.07, orb: 0 };

  // main lens: pill over the answer, then orb, then the ring
  const lensIn = spring(t - 1.5, 9, 6);
  const L = { on: t > 1.5 };
  const mq = cardQuad(st.main, cam), onMain = mapper(mq);
  const ms = quadWidth(mq) / MAIN.w;
  const glide = eInOutCubic((t - 1.6) / 0.42);
  const pc = onMain((150 + 290 * glide) / MAIN.w, 354 / MAIN.h);
  const toOrb = eInOutCubic((t - 2.0) / 0.42);
  const toRing = eInOutQuint((t - 2.6) / 0.46);
  let cx = lerp(pc[0], 960, toOrb), cy = lerp(pc[1], 540, toOrb);
  const ringR = WM.or;
  const ocx = wx(WM.oc[0], t), ocy = wy(WM.oc[1], t);
  cx = lerp(cx, ocx, toRing); cy = lerp(cy, ocy, toRing);
  let hx = lerp(150 * ms, 178, toOrb), hy = lerp(50 * ms, 178, toOrb), r = lerp(50 * ms, 178, toOrb);
  const rr = ringR * WS(t);
  hx = lerp(hx, rr, toRing); hy = lerp(hy, rr, toRing); r = lerp(r, rr, toRing);
  const s = 0.4 + 0.6 * lensIn;
  const landSq = 1 + 0.06 * Math.exp(-Math.pow((t - 3.04) / 0.07, 2));   // a tiny squash as it lands
  L.c = [cx, cy]; L.half = [hx * s * landSq, hy * s / landSq]; L.r = r * s;
  L.hole = (rr - WM.ringT * WS(t)) * eOutCubic(smooth(0.5, 1.0, toRing));
  L.mag = lerp(lerp(1.32, 1.25, toOrb), 1.04, toRing);
  L.orb = toOrb * (1 - smooth(0.4, 0.85, toRing));
  L.core = smooth(2.25, 2.45, t) * (1 - smooth(2.5, 2.85, t)) * 0.4 + 0.25 * Math.exp(-Math.pow((t - 2.45) / 0.1, 2));
  L.opacity = sat(lensIn * 1.5);
  L.halo = lerp(0.05, 0.10, toOrb) + 0.06 * toRing;
  if (t > 3.2) { const b = 1 + 0.012 * Math.sin((t - 3.2) * 3.0); L.half = [L.half[0] * b, L.half[1] * b]; L.r *= b; L.hole *= b; L.halo *= 1 + 0.25 * Math.sin((t - 3.2) * 3.0); }
  if (t > 2.45) { const br = 1 + 0.05 * Math.exp(-(t - 2.45) * 5) * Math.sin((t - 2.45) * 16); L.half = [L.half[0] * br, L.half[1] * br]; L.r *= br; }   // the orb settles with a little wobble
  L.spin = 1.3 * smooth(3.1, 5.0, t) * smooth(0.6, 1.0, toRing);
  st.lens = L;

  // glass 5.5 tag
  const tg = spring(t - 3.12, 9, 5.5);
  st.tag = { x: wx(WM.tagC[0], t), y: wy(WM.tagC[1], t) + (1 - sat(tg)) * 18 + 4 * Math.sin(t * 2.2) * smooth(3.3, 3.8, t), z: 0, w: WM.tagW, h: WM.tagH, rx: 0, ry: 0, rz: 0, scale: WS(t) * (0.6 + 0.4 * tg),
    opacity: smooth(3.12, 3.3, t), blur: 0.15, tint: [0.62, 0.55, 1.0], shadow: 0.5, radius: WM.tagH / 2 };
  // light wave when the orb forms
  st.wave = { r: Math.max(0, (t - 2.42)) * 2300, a: t > 2.42 ? 1 - smooth(2.42, 3.3, t) : 0, c: [960, 540] };
  st.wave2 = { r: Math.max(0, (t - 3.1)) * 1500, a: t > 3.1 ? 0.8 * (1 - smooth(3.1, 4.1, t)) : 0, c: [ocx, ocy] };
  return st;
}

const IDENT = { yaw: 0, pitch: 0, dolly: 0 };
function drawCard(c, tex, cv, cam) {
  if (c.opacity <= 0.002) return;
  blurFrost();
  upload(tex, cv.c, true);
  const q = cardQuad(c, cam);
  const Hinv = inv3(squareToQuad(q));
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  pass(P.card, RT.comp, u => {
    gl.uniformMatrix3fv(u.uHinv, false, colMajor(Hinv));
    gl.uniform2f(u.uSize, c.w, c.h); gl.uniform1f(u.uRadius, c.radius * (c.scale || 1) * 0 + c.radius); gl.uniform1f(u.uOpacity, c.opacity);
    gl.uniform1f(u.uBlur, c.blur); gl.uniform1f(u.uTime, T); gl.uniform1f(u.uShadow, c.shadow);
    gl.uniform3fv(u.uTint, c.tint);
    bindTex(0, RT.q1a.tex); gl.uniform1i(u.uFrost, 0);
    bindTex(1, RT.q2a.tex); gl.uniform1i(u.uFrost2, 1);
    bindTex(2, tex); gl.uniform1i(u.uContent, 2);
  });
  gl.disable(gl.BLEND);
}
function copyComp() { pass(P.copy, RT.comp2, u => { bindTex(0, RT.comp.tex); gl.uniform1i(u.uSrc, 0); }); }
function drawLens(L) {
  if (!L.on || L.opacity <= 0.002) return;
  copyComp();
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  pass(P.lens, RT.comp, u => {
    gl.uniform2fv(u.uC, L.c); gl.uniform2fv(u.uHalf, L.half); gl.uniform1f(u.uR, Math.min(L.r, L.half[0], L.half[1]));
    gl.uniform1f(u.uHole, L.hole); gl.uniform1f(u.uMag, L.mag); gl.uniform1f(u.uOpacity, L.opacity);
    gl.uniform1f(u.uTime, T); gl.uniform1f(u.uHalo, L.halo); gl.uniform1f(u.uOrb, L.orb || 0); gl.uniform1f(u.uCore, L.core || 0); gl.uniform1f(u.uSpin, L.spin || 0);
    bindTex(0, RT.comp2.tex); gl.uniform1i(u.uSrc, 0);
  });
  gl.disable(gl.BLEND);
}

let T = 0, WAVE = null, WAVE2 = null;
function renderScene(t) {
  T = t;
  const st = stateAt(t);
  WAVE = st.wave; WAVE2 = st.wave2;
  gl.disable(gl.BLEND);
  pass(P.aurora, RT.comp, u => { gl.uniform1f(u.uTime, t + 0.5 * Math.max(0, t - 3.0)); gl.uniform1f(u.uGlow, st.glowAurora); });
  drawSpeed(st.c); drawMain(st.c); drawCost(st.c);
  drawCard(st.speed, TX.speed, SPEED, st.cam);
  drawCard(st.main, TX.main, MAIN, st.cam);
  drawCard(st.cost, TX.cost, COST, st.cam);
  drawLens(st.knob);
  if (st.tag.opacity > 0.002) { drawTag(); drawCard(st.tag, TX.tag, TAG, IDENT); }
  if (drawWord(t)) {
    upload(TX.word, WORD.c, false);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    pass(P.over, RT.comp, u => { bindTex(0, TX.word); gl.uniform1i(u.uSrc, 0); });
    gl.disable(gl.BLEND);
  }
  drawLens(st.lens);
  blurFrost();   // bloom source
}
function accumulate(w) {
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  pass(P.acc, RT.acc, u => {
    bindTex(0, RT.comp.tex); gl.uniform1i(u.uSrc, 0);
    bindTex(1, RT.q1a.tex); gl.uniform1i(u.uB1, 1);
    bindTex(2, RT.q2a.tex); gl.uniform1i(u.uB2, 2);
    gl.uniform1f(u.uW, w); gl.uniform1f(u.uBloom, 0.4);
  });
  gl.disable(gl.BLEND);
}
// motion blur: more sub-frames where things move fast (card entrance, the fold into the orb, the glint)
function samplesFor(t) {
  if (!CAPTURE) return 1;
  if (window.__N) return window.__N;
  if (t < 0.8) return 14;
  if (t > 1.95 && t < 3.5) return 14;
  if (t > 3.85 && t < 4.8) return 8;
  if (t < 1.95) return 6;
  return 4;
}
function renderAt(t) {
  const N = samplesFor(t);
  const shutter = 0.6 / 30;
  gl.bindFramebuffer(gl.FRAMEBUFFER, RT.acc.fb); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  for (let k = 0; k < N; k++) {
    const ts = clamp(t + (N === 1 ? 0 : ((k + 0.5) / N - 0.5) * shutter), 0, 4.9999);
    renderScene(ts);
    accumulate(1 / N);
  }
  pass(P.final, null, u => {
    bindTex(0, RT.acc.tex); gl.uniform1i(u.uSrc, 0);
    gl.uniform1f(u.uFrame, Math.round(t * 30)); gl.uniform1f(u.uFade, 1.0);
    gl.uniform1f(u.uWaveR, WAVE ? WAVE.r : 0); gl.uniform1f(u.uWaveA, WAVE ? WAVE.a : 0); gl.uniform2f(u.uWaveC, 960, 540);
    gl.uniform1f(u.uWave2R, WAVE2 ? WAVE2.r : 0); gl.uniform1f(u.uWave2A, WAVE2 ? WAVE2.a : 0); gl.uniform2f(u.uWave2C, WAVE2 ? WAVE2.c[0] : 0, WAVE2 ? WAVE2.c[1] : 0);
  });
}

window.ready = (async () => {
  await Promise.all([document.fonts.load('600 20px Inter'), document.fonts.load('500 20px Inter'), document.fonts.load('400 20px Inter'), document.fonts.load('200 60px Outfit'), document.fonts.load('300 30px Outfit')]);
  layoutWord();
  initGL();
  window.renderAt = renderAt;
  if (!CAPTURE) { const t0 = performance.now(); (function loop() { renderAt(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); })(); }
})();
window.renderAt = (t) => window.ready.then(() => renderAt(t));
})();
</script>
