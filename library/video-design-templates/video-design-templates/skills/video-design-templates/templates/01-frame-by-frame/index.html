<!doctype html>

</head>
<body>
<svg class="defs" id="defs" xmlns="http://www.w3.org/2000/svg"></svg>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
(() => {
  const W = 1920, H = 1080;
  const INK = '#1e140f', RED = '#d12c2b', YEL = '#f1c02b', PAPER = '#e6decb', SUN = '#f3e1a4',
        CREAM = '#f8efdc', WHITE = '#fbf5e6', DRED = '#7d1c1a', CHEEK = '#d9362a', DYEL = '#c99a14';
  const NIGHT = { bg: '#251b1a', disc: '#322923', line: '#c4483c', fill: '#8e332e', dim: '#5b2622', spec: '#2c1a17' };
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;

  // ---------- seeded randomness keyed by the drawing number ----------
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  let D = 0; // current drawing index
  const rng = (key) => mulberry32(hashStr(key + '|' + D));
  const rs = (key) => mulberry32(hashStr(key)); // static, never boils
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, k) => a + (b - a) * k;
  const ease = k => { k = clamp(k); return k * k * (3 - 2 * k); };
  const easeOut = k => { k = clamp(k); return 1 - Math.pow(1 - k, 3); };
  const easeIn = k => { k = clamp(k); return k * k * k; };
  const pick = (arr, i) => arr[clamp(i, 0, arr.length - 1) | 0];

  // ---------- timeline: 150 frames, drawings held for 1, 2 or 3 frames ----------
  const SEG = [[0, 10, 2], [10, 16, 2], [16, 26, 2], [26, 40, 2], [40, 54, 2], [54, 58, 2], [58, 63, 1], [63, 71, 2], [71, 108, 2], [108, 150, 3]];
  const DF = [], DIDX = [], HOLD = [];

  const BEAT = { strike: 0, flash: 10, ignite: 16, hop: 26, dance: 40, wind: 54, spin: 58, boom: 63, stamp: 71, hold: 108 };
  const FPS = 30;

  // ---------- curves ----------
  function spline(ctrl, closed = true, per = 9) {

  }
  function densify(pts, closed, step = 14) {
    const out = []; const n = pts.length; const segs = closed ? n : n - 1;
    for (let i = 0; i < segs; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      const m = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
      for (let k = 0; k < m; k++) out.push([lerp(a[0], b[0], k / m), lerp(a[1], b[1], k / m)]);

  }
  const ellipse = (cx, cy, rx, ry, n = 14, rot = 0) => { const o = []; for (let i = 0; i < n; i++) { const a = i / n * TAU; const x = Math.cos(a) * rx, y = Math.sin(a) * ry; o.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]); } return o; };

  // line boil: a smooth wobble that is re-rolled every drawing
  function boil(pts, key, amp, closed) {
    if (amp <= 0) return pts.map(p => [p[0], p[1]]);
    const r = rng(key);
    const s = arcLen(pts); const L = s[s.length - 1] + (closed ? Math.hypot(pts[0][0] - pts[pts.length - 1][0], pts[0][1] - pts[pts.length - 1][1]) : 0);

      p[1] + amp * (0.65 * Math.sin(s[i] * k1 + a3) + 0.35 * Math.sin(s[i] * k2 + a4))

  }
  // brush ink: a filled outline with pressure variation, tapered ends on open lines
  function inkLine(g, pts, closed, w, key, color = INK, taper = true) {
    const n = pts.length; if (n < 2) return;
    const r = rng(key + 'w');
    const s = arcLen(pts); const L = s[n - 1];
    const f1 = 0.02 + r() * 0.02, p1 = r() * TAU, f2 = 0.07 + r() * 0.05, p2 = r() * TAU;
    const left = [], right = [];
    for (let i = 0; i < n; i++) {
      const a = closed ? pts[(i - 1 + n) % n] : pts[Math.max(0, i - 1)], b = closed ? pts[(i + 1) % n] : pts[Math.min(n - 1, i + 1)];

    g.fillStyle = color;
    g.beginPath();
    if (closed) {
      g.moveTo(left[0][0], left[0][1]); for (const p of left) g.lineTo(p[0], p[1]); g.closePath();
      g.moveTo(right[0][0], right[0][1]); for (const p of right) g.lineTo(p[0], p[1]); g.closePath();
      g.fill('evenodd');
    } else {
      g.moveTo(left[0][0], left[0][1]); for (const p of left) g.lineTo(p[0], p[1]);
      for (let i = n - 1; i >= 0; i--) g.lineTo(right[i][0], right[i][1]);
      g.closePath(); g.fill();
      g.beginPath(); g.arc(pts[0][0], pts[0][1], w * 0.09, 0, TAU); g.arc(pts[n - 1][0], pts[n - 1][1], w * 0.09, 0, TAU); g.fill();
    }
  }
  function polyFill(g, pts, color) { g.fillStyle = color; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (const p of pts) g.lineTo(p[0], p[1]); g.closePath(); g.fill(); }
  const poly2d = pts => { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (const q of pts) p.lineTo(q[0], q[1]); p.closePath(); return p; };

  // one hand-made shape: an off-register flat fill plus a boiling ink outline
  function shape(g, ctrl, o) {
    const { closed = true, fill = null, line = INK, w = 6, key, amp = 2.4, off = 4, smooth = true, xf = null, fillAmp } = o;
    let base = smooth ? spline(ctrl, closed) : densify(ctrl, closed);
    if (xf) base = base.map(xf);
    if (fill) {
      const r = rng(key + 'off');

      const fp = boil(base, key + 'f', fillAmp ?? amp * 0.7, closed).map(p => [p[0] + ox, p[1] + oy]);

  const stroke = (g, ctrl, key, w = 5, amp = 2, smooth = true, color = INK) => shape(g, ctrl, { closed: false, line: color, w, key, amp, smooth });
  function makeXf(tx, ty, s = 1, sx = 1, sy = 1, rot = 0) {
    const c = Math.cos(rot), si = Math.sin(rot);
    return p => { const x = p[0] * sx * s, y = p[1] * sy * s; return [tx + x * c - y * si, ty + x * si + y * c]; };
  }
  // a polygon drawn as separate edge strokes that overshoot at the corners, like a quick hand-inked box
  function edges(g, pts, o) {
    const { w = 6, key, over = 10, amp = 1.4, color = INK, skip = [], closed = true } = o;
    const n = pts.length; const m = closed ? n : n - 1;
    for (let i = 0; i < m; i++) {
      if (skip.includes(i)) continue;
      const a = pts[i], b = pts[(i + 1) % n]; const r = rng(key + 'e' + i);
      const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
      const s1 = over * (0.15 + r() * 0.85), s2 = over * (0.15 + r() * 0.85), bow = (r() - 0.5) * L * 0.012;
      const A = [a[0] - ux * s1, a[1] - uy * s1], B = [b[0] + ux * s2, b[1] + uy * s2];

      stroke(g, [A, M, B], key + 's' + i, w, amp, true, color);
    }
  }

  // ---------- paper, sun, grain (built once) ----------
  const paperCv = document.createElement('canvas'); paperCv.width = W; paperCv.height = H;
  const toothCv = document.createElement('canvas'); toothCv.width = W; toothCv.height = H;
  const sunCv = document.createElement('canvas');
  function noiseField(w, h, cell, seed) {
    const r = mulberry32(seed); const gw = Math.ceil(w / cell) + 3, gh = Math.ceil(h / cell) + 3;
    const g = new Float32Array(gw * gh); for (let i = 0; i < g.length; i++) g[i] = r();

      const fy = y / cell, iy = Math.floor(fy), ty = fy - iy, sy = ty * ty * (3 - 2 * ty);
      for (let x = 0; x < w; x++) {
        const fx = x / cell, ix = Math.floor(fx), tx = fx - ix, sx = tx * tx * (3 - 2 * tx);
        const a = g[iy * gw + ix], b = g[iy * gw + ix + 1], c = g[(iy + 1) * gw + ix], d = g[(iy + 1) * gw + ix + 1];

      }

  }
  function buildPaper() {
    const p = paperCv.getContext('2d'); const r = rs('paper');
    const w = W / 2, h = H / 2;
    const n1 = noiseField(w, h, 190, 11), n2 = noiseField(w, h, 62, 12), n3 = noiseField(w, h, 19, 13), n4 = noiseField(w, h, 5, 14);
    const half = document.createElement('canvas'); half.width = w; half.height = h;
    const hx = half.getContext('2d'); const id = hx.createImageData(w, h); const d = id.data;
    for (let i = 0; i < w * h; i++) {
      const m = n1[i] * 0.34 + n2[i] * 0.3 + n3[i] * 0.22 + n4[i] * 0.14; // 0..1 mottle
      const v = (m - 0.5);

      const y = n2[i] * n1[i]; // warm stain

      const k = i * 4; d[k] = R; d[k + 1] = G; d[k + 2] = B; d[k + 3] = 255;
    }

      p.strokeStyle = r() < 0.5 ? 'rgba(150,128,92,0.11)' : 'rgba(255,253,240,0.30)'; p.lineWidth = 0.5 + r() * 1.1;
      p.beginPath(); p.moveTo(x, y); p.quadraticCurveTo(x + Math.cos(a + 0.6) * l * 0.5, y + Math.sin(a + 0.6) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l); p.stroke();
    }
    // tiny dark flecks like specks in recycled paper
    for (let i = 0; i < 160; i++) {
      p.fillStyle = `rgba(90,70,45,${0.10 + r() * 0.2})`; const x = r() * W, y = r() * H, s = 0.6 + r() * 1.6;
      p.beginPath(); p.ellipse(x, y, s, s * (0.5 + r() * 0.6), r() * TAU, 0, TAU); p.fill();
    }

    const th = document.createElement('canvas'); th.width = w; th.height = h;
    const tx = th.getContext('2d'); const tid = tx.createImageData(w, h); const td = tid.data;
    for (let i = 0; i < w * h; i++) { const v = 255 - Math.pow(r(), 2.4) * 19 - n4[i] * 5; const k = i * 4; td[k] = v; td[k + 1] = v; td[k + 2] = v - 3; td[k + 3] = 255; }
    tx.putImageData(tid, 0, 0);
    const t = toothCv.getContext('2d'); t.imageSmoothingEnabled = true; t.drawImage(th, 0, 0, W, H);
  }
  // the soft yellow watercolour disc behind everything (drawn once, 2x for sharpness when the camera pushes in)
  const SUNR = 440, SUNPAD = 90, SUNSZ = (SUNR + SUNPAD) * 2;
  function buildSun() {

    const g = sunCv.getContext('2d'); g.scale(S, S);
    const r = rs('sunshape'); const c = SUNSZ / 2;

      g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }

    g.strokeStyle = 'rgba(214,180,84,0.38)'; g.lineWidth = 24; g.filter = 'blur(7px)'; g.stroke(path);
    g.strokeStyle = 'rgba(196,158,58,0.28)'; g.lineWidth = 5; g.filter = 'blur(1.5px)'; g.stroke(path);
    g.filter = 'none';
    g.restore();
  }
  const drawSun = (g, cx, cy, sc = 1) => g.drawImage(sunCv, cx - SUNSZ / 2 * sc, cy - SUNSZ / 2 * sc, SUNSZ * sc, SUNSZ * sc);

  // ---------- scene geometry (scene space = screen space at zoom 1, centred 960,540) ----------
  const BOX = { fl: [470, 772], fr: [1425, 772], br: [1497, 646], bl: [542, 646], bot: 944 };
  const SUNC = [1120, 520];
  const MATCH = { x: 1328, y: 742, len: 215 };
  const FS = 1.5; // the flame hero's size

  // plane transform: lay things flat on the lid (u across, v from back edge toward you)
  function onLid(g, fn) {
    g.save(); g.transform(1, 0, -0.29, 0.5, BOX.bl[0], BOX.bl[1]); fn(); g.restore();
  }
  function logoFlame(g, x, y, s, fill, line, inner = null) {

    shape(g, [[sx0, sy0], [sx1, sy0], [sx1, sy1], [sx0, sy1]], { fill: night ? NIGHT.fill : '#1c1411', line: night ? null : INK, w: 4.5, key: 'striker', smooth: false, off: 3 });

      g.beginPath(); g.arc(x, y, 1 + r() * 2.1, 0, TAU); g.fill();
    }
    if (!night) stroke(g, [[sx0 + 22, 862], [(sx0 + sx1) / 2, 860], [sx1 - 40, 863]], 'sheen', 3, 1, true, WHITE);

    edges(g, top, { w: 6, key: 'topE', color: L, over: 14, skip: [] });

      const lab = [[170, 70], [790, 70], [790, 205], [170, 205]];

      g.fillStyle = night ? NIGHT.line : INK; g.font = '104px "Luckiest Guy"'; g.textBaseline = 'alphabetic'; g.textAlign = 'left';
      g.fillText('SONNET', 292, 178);
      // round "5.5" badge on the label
      shape(g, ellipse(730, 140, 46, 46, 14), { fill: night ? null : YEL, line: night ? L : INK, w: 6, key: 'badge', off: 3, amp: 1.3 });
      g.font = '40px "Luckiest Guy"'; g.textAlign = 'center'; g.fillStyle = night ? NIGHT.line : INK; g.fillText('5.5', 731, 156);
      stroke(g, [[296, 192], [480, 195], [660, 191]], 'labul', 5, 1.2, true, night ? L : INK);
      g.restore();
    });
    // ground hatching shadow
    for (let i = 0; i < 17; i++) {
      const x = 1000 + i * 34;

        const r = rng('sub'); const a = dd - subAt; const sc = [0.7, 1.08, 1][Math.min(a | 0, 2)];
        g.save(); g.fillStyle = INK; g.font = '700 74px Caveat'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.translate(940 + (r() - 0.5) * 3, 912 + (r() - 0.5) * 3); g.rotate((r() - 0.5) * 0.01); g.scale(sc, sc);
        g.fillText('meet the new one', 0, 0);
        g.restore();
        star4(g, 940 + 290, 904, 26, 'subst', YEL);
        stroke(g, [[640, 962], [940, 968], [1240, 960]], 'subline', 4.6, 2);
      }
      // sparkles around the stamp, twinkling
      const sps = [[330, 230], [1620, 210], [1660, 770], [300, 790], [1010, 110], [190, 520], [1760, 470]];
      sps.forEach((p, k) => { if (dd >= doneAt - 5 + k * 0.7) star4(g, p[0], p[1], ((D + k) % 3 === 0) ? 14 : ((D + k) % 3 === 1 ? 26 : 34), 'ss' + k); });
      g.restore();
      // red pen circles the drawing counter
      const circAt = subAt + 2.5;
      let circ = null;
      if (dd >= circAt) circ = clamp((dd - circAt) / 5);
      return { dark, no: 1 + DIDX[f], circle: circ, on: HOLD[f] };
    }
  }

  // ---------- present: paper + wobbled drawing layer + grain ----------
  const lay = document.createElement('canvas'); lay.width = W; lay.height = H;
  const lg = lay.getContext('2d');
  const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
  const bx = buf.getContext('2d');
  const NF = 12;
  function buildFilters() {
    const defs = document.getElementById('defs'); let html = '';
    for (let i = 0; i < NF; i++) {
      html += `<filter id="rough${i}" x="-2%" y="-2%" width="104%" height="104%" color-interpolation-filters="sRGB">` +
        `<feTurbulence type="fractalNoise" baseFrequency="0.0085 0.011" numOctaves="2" seed="${3 + i * 5}" result="n1"/>` +
        `<feDisplacementMap in="SourceGraphic" in2="n1" scale="6" xChannelSelector="R" yChannelSelector="G" result="d1"/>` +
        `<feTurbulence type="fractalNoise" baseFrequency="0.075" numOctaves="2" seed="${40 + i * 7}" result="n2"/>` +
        `<feDisplacementMap in="d1" in2="n2" scale="2.4" xChannelSelector="G" yChannelSelector="R"/>` +
        `</filter>`;
    }
    defs.innerHTML = html;
  }
  let lastF = -1, lastDF = -1;
  function render(t) {
    const f = Math.min(149, Math.max(0, Math.floor(t * FPS + 1e-6)));
    const df = DF[f];
    if (df !== lastDF) {
      D = DIDX[f];
      lg.setTransform(1, 0, 0, 1, 0, 0); lg.clearRect(0, 0, W, H);
      lg.lineJoin = 'round'; lg.lineCap = 'round';
      const info = compose(lg, f);
      // tags sit on top of everything, screen space
      lg.setTransform(1, 0, 0, 1, 0, 0);
      tags(lg, info.dark, { on: info.on || HOLD[f], no: info.no });
      if (info.circle) {
        penCircle(lg, 1744, 996, 150, 58, Math.min(1, info.circle * 1.6), 'circ');
        if (info.circle > 0.55) {
          const pr = clamp((info.circle - 0.55) / 0.45);
          // curved arrow from the circle back toward the "meet the new one" line, with a hand-drawn head
          const arrow = spline([[1612, 954], [1500, 936], [1330, 912]], false, 10);
          const cut = arrow.slice(0, Math.max(2, Math.floor(arrow.length * pr)));
          inkLine(lg, boil(cut, 'arr', 1.4, false), false, 5.4, 'arr', '#cc3a2e');
          if (pr >= 1) {
            stroke(lg, [[1322, 910], [1362, 902]], 'ah1', 5.2, 0.8, false, '#cc3a2e');
            stroke(lg, [[1322, 910], [1352, 940]], 'ah2', 5.2, 0.8, false, '#cc3a2e');
          }
        }
      }
      // composite
      bx.setTransform(1, 0, 0, 1, 0, 0);
      if (info.dark) { bx.fillStyle = NIGHT.bg; bx.fillRect(0, 0, W, H); } else bx.drawImage(paperCv, 0, 0);
      const jr = rng('gate'); const jx = (jr() - 0.5) * 3, jy = (jr() - 0.5) * 3;
      bx.filter = `url(#rough${D % NF})`;
      bx.drawImage(lay, jx, jy);
      bx.filter = 'none';
      bx.save(); bx.globalCompositeOperation = 'multiply'; bx.drawImage(toothCv, 0, 0); bx.restore();
      const vg = bx.createRadialGradient(W / 2, H / 2, 520, W / 2, H / 2, 1250);
      vg.addColorStop(0, 'rgba(100,70,30,0)'); vg.addColorStop(1, info.dark ? 'rgba(0,0,0,0.26)' : 'rgba(110,76,34,0.11)');
      bx.fillStyle = vg; bx.fillRect(0, 0, W, H);
      lastDF = df;
    }
    ctx.drawImage(buf, 0, 0);
  }

  window.DURATION = 5;
  window.ready = (async () => {
    await Promise.all([document.fonts.load('104px "Luckiest Guy"'), document.fonts.load('700 40px Caveat'), document.fonts.load('600 28px Caveat')]);
    await document.fonts.ready;
    buildFilters(); buildPaper(); buildSun();
  })();
  window.renderAt = async (t) => { await window.ready; render(t); };
  if (!location.search.includes('capture')) {
    window.ready.then(() => { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); })(); });
  }
})();
</script>
</body>
</html>
