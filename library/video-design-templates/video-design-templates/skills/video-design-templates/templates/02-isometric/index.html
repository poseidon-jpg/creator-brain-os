<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { TTFLoader } from 'three/addons/loaders/TTFLoader.js';
import { Font } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

// ======================================================================
// helpers
// ======================================================================
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(55055);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
const easeOut3 = k => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
const easeInOut = k => { k = clamp(k, 0, 1); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const backOut = (k, s = 1.9) => { k = clamp(k, 0, 1); return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const beat = x => Math.round(x * 12) / 12;           // marimba grid: 12 beats a second

const W = 1920, H = 1080, PR = 2;
const CAPTURE = location.search.includes('capture');

// ======================================================================
// renderer / scene / camera
// ======================================================================
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(PR); renderer.setSize(W, H);
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const cam = new THREE.OrthographicCamera(-10, 10, 6, -6, 0.1, 400);
const ISO = new THREE.Vector3(1, 1, 1).normalize();
const camTarget = new THREE.Vector3();
function setCamera(target, halfH) {
  cam.left = -halfH * W / H; cam.right = halfH * W / H; cam.top = halfH; cam.bottom = -halfH;
  cam.position.copy(target).addScaledVector(ISO, 80);
  cam.lookAt(target);
  cam.updateProjectionMatrix(); cam.updateMatrixWorld();
}
scene.add(cam);

// background: soft lavender that deepens to violet when the colour wave passes
const bgC = document.createElement('canvas'); bgC.width = 256; bgC.height = 144;
const bgG = bgC.getContext('2d');
const bgTex = new THREE.CanvasTexture(bgC); bgTex.colorSpace = THREE.SRGBColorSpace;
scene.background = bgTex;
let bgLast = -9;
function drawBg(k) {
  if (Math.abs(k - bgLast) < 0.0015) return; bgLast = k;
  const mix = (a, b) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
  const top = mix([240, 236, 250], [224, 210, 251]), bot = mix([218, 211, 241], [150, 122, 229]);
  const g = bgG.createLinearGradient(0, 0, 0, 144);
  g.addColorStop(0, `rgb(${top})`); g.addColorStop(1, `rgb(${bot})`);
  bgG.fillStyle = g; bgG.fillRect(0, 0, 256, 144);
  const r = bgG.createRadialGradient(140, 62, 4, 140, 62, 120);
  r.addColorStop(0, `rgba(255,255,255,${0.30 - 0.10 * k})`); r.addColorStop(1, 'rgba(255,255,255,0)');
  bgG.fillStyle = r; bgG.fillRect(0, 0, 256, 144);
  bgTex.needsUpdate = true;
}

// lights
scene.add(new THREE.HemisphereLight(0xffffff, 0xa994ea, 0.62));
const sunL = new THREE.DirectionalLight(0xfffaf4, 1.85);
sunL.position.set(-9, 16, 10); sunL.target.position.set(0, 0, 0);
sunL.castShadow = true; sunL.shadow.mapSize.set(4096, 4096);
Object.assign(sunL.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 80 });
sunL.shadow.bias = -0.0005; sunL.shadow.normalBias = 0.02; sunL.shadow.radius = 5;
scene.add(sunL, sunL.target);

// ======================================================================
// palette + map
// ======================================================================
const WHITE = new THREE.Color('#f3f0fa');
const NAVY = new THREE.Color('#211d68');
const C = (h) => new THREE.Color(h);
const PASTEL = ['#f5a283', '#f7cba6', '#f6dd7e', '#9fe3bf', '#b9a8f5', '#a8cdf6', '#f8f3ea'];
const N = 12, TOP = 0.28;
const CLIP = [new THREE.Plane(new THREE.Vector3(0, 1, 0), -(TOP - 0.004))];
const tileX = i => i - 5.5, tileZ = j => j - 5.5;
const ringOf = (i, j) => Math.round(Math.max(Math.abs(i - 5.5), Math.abs(j - 5.5)) - 0.5);
const WATER = new Set(['10,1', '11,1', '9,2', '10,2', '11,2', '9,3', '10,3', '11,3', '10,4', '11,4']);
const SOLAR = new Set(['0,6', '1,6', '2,6', '0,7', '1,7', '2,7', '0,8', '1,8']);
const TURB = new Set(['1,2', '5,0', '9,0', '0,4']);
function kindOf(i, j) {
  const r = ringOf(i, j);
  if (r === 0) return 'C';
  if (r === 1) return 'P';
  if (r === 2) return 'R';
  const key = i + ',' + j;
  if (WATER.has(key)) return 'W';
  if (SOLAR.has(key)) return 'S';
  return 'G';
}
const PRE = ['#d6cdf1', '#d9d0f3', '#e1daf5', '#e8e3f6', '#eeeaf8', '#f2effa'];     // tile tint by ring before the wave
const FIN = { P: '#efe5d1', R: '#6556dc', G: '#84e1a8', W: '#8fc7f7', S: '#84e1a8' };

// ======================================================================
// timeline constants
// ======================================================================
const T_SWEEP = 1.38, SWEEP_V = 15;
const sweepK = (x, z, t) => smooth(0, 0.2, t - (T_SWEEP + Math.hypot(x, z) / SWEEP_V));
const FLIGHT = 0.33;
const tileT = (ring, ang01) => 0.28 + (ring - 1) * 0.08 + ang01 * 0.055;
const landT = (ring, ang01) => tileT(ring, ang01) + FLIGHT;

// ======================================================================
// materials
// ======================================================================
const waveMats = [];             // {mat, x, z}: lerps from mat.userData.pre (or white) to mat.userData.target with the wave
function regWave(mat, x, z) { waveMats.push({ mat, x, z }); return mat; }
const fxObjs = [];               // see-through effect meshes, kept out of the AO normal pass
function markFx(o) { fxObjs.push(o); return o; }

function winMaterial(target, opts = {}) {
  const m = new THREE.MeshStandardMaterial({ color: WHITE.clone(), roughness: 0.84, metalness: 0.0, clippingPlanes: opts.clip === false ? null : CLIP });
  m.userData = { target: C(target), u: {
    uWinA: { value: opts.win === false ? 0 : 1 }, uMode: { value: opts.cyl ? 1 : 0 },
    uHalf: { value: new THREE.Vector3(0.4, 1, 0.4) }, uGrid: { value: new THREE.Vector3(4, 4, 4) },
    uLit: { value: 0.35 }, uSeed: { value: rand() * 100 } } };
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, m.userData.u);
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vLoc; varying vec3 vLN;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvLoc = position; vLN = normal;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
      varying vec3 vLoc; varying vec3 vLN; uniform float uWinA, uMode, uLit, uSeed; uniform vec3 uHalf, uGrid;
      float h21(vec2 p){ return fract(sin(dot(p, vec2(41.3, 289.1)) + uSeed) * 43758.5); }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
      vec3 an = abs(vLN);
      if (an.y < 0.5 && uWinA > 0.0) {
        if (uMode < 0.5) {
          bool xf = an.x > an.z;
          float u = xf ? vLoc.z : vLoc.x;
          float Wd = (xf ? uHalf.z : uHalf.x) * 2.0;
          float cu = (u + Wd * 0.5) / Wd * (xf ? uGrid.z : uGrid.x);
          float cv = (vLoc.y + uHalf.y) / (uHalf.y * 2.0) * uGrid.y;
          float fu = fract(cu), fv = fract(cv);
          float win = step(0.2, fu) * step(fu, 0.8) * step(0.24, fv) * step(fv, 0.78);
          win *= step(abs(u), Wd * 0.5 - 0.035);
          float lit = step(0.52, h21(vec2(floor(cu) + (xf ? 9.0 : 0.0), floor(cv))));
          vec3 off = mix(vec3(0.80, 0.78, 0.91), diffuseColor.rgb * 0.60 + vec3(0.10, 0.11, 0.17), uLit);
          vec3 glass = mix(off, vec3(1.0, 0.91, 0.62), lit * (0.5 + 0.5 * uLit));
          diffuseColor.rgb = mix(diffuseColor.rgb, glass, win * uWinA);
        } else {
          float ang = atan(vLoc.z, vLoc.x) / 6.2831853 + 0.5;
          float cu = ang * uGrid.x, cv = (vLoc.y + uHalf.y) / (uHalf.y * 2.0) * uGrid.y;
          float fu = fract(cu), fv = fract(cv);
          float dash = step(0.12, fu) * step(fu, 0.88) * step(0.28, fv) * step(fv, 0.72);
          float lit = step(0.5, h21(vec2(floor(cu), floor(cv))));
          vec3 col = mix(vec3(0.72, 0.67, 0.96), vec3(1.0, 0.89, 0.55), lit);
          diffuseColor.rgb = mix(diffuseColor.rgb, mix(diffuseColor.rgb * 0.8, col, 0.4 + 0.6 * uLit), dash * uWinA);
        }
      }`);
  };
  m.customProgramCacheKey = () => 'win2';
  return m;
}
const plainMat = (color, rough = 0.85, clip = true) => {
  const m = new THREE.MeshStandardMaterial({ color: C(color), roughness: rough, clippingPlanes: clip ? CLIP : null });
  return m;
};
const waveMat = (target, rough = 0.85, clip = true, pre) => {
  const m = new THREE.MeshStandardMaterial({ color: WHITE.clone(), roughness: rough, clippingPlanes: clip ? CLIP : null });
  m.userData = { target: C(target), pre: pre ? C(pre) : null };
  return m;
};
const shadowed = (o) => { o.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } }); return o; };
const rbox = (w, h, d, r = 0.04, s = 3) => new RoundedBoxGeometry(w, h, d, s, r);

// registries
const tiles = [], builds = [], pops = [], turbines = [], fenceBits = [], cars = [], boats = [], flicker = [];
const keepWhite = (c) => c.clone();

// ======================================================================
// slab, floor, blueprint
// ======================================================================
const floorY = -1.7;
const WORD_C = new THREE.Vector3(-7.29, floorY, 12.99);
const rawColor = (hex) => new THREE.Color().setStyle(hex, THREE.LinearSRGBColorSpace);   // for overlay materials that write straight into the already-encoded frame
const overlay = new THREE.Scene();          // cards and their leader lines: drawn after AO, so ambient occlusion never darkens them
const slab = new THREE.Group();
{
  const layers = [['#f7f4fc', 0.10, 12.32, 0.7], ['#d3c6f6', 0.22, 12.14, 0.75], ['#ad98f1', 0.28, 12.14, 0.75], ['#8f76e8', 0.26, 12.14, 0.75]];
  let y = 0;
  for (const [col, h, w, rough] of layers) {
    const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, w, 3, 0.05), new THREE.MeshStandardMaterial({ color: col, roughness: rough }));
    m.position.y = y - h / 2; slab.add(m); y -= h;
  }
  // dark grout under the tiles so the gaps between tiles read as thin shadow lines
  const grout = new THREE.Mesh(new THREE.PlaneGeometry(12.0, 12.0), new THREE.MeshStandardMaterial({ color: '#8d83bd', roughness: 0.9 }));
  grout.rotation.x = -Math.PI / 2; grout.position.y = 0.004; slab.add(grout);
  shadowed(slab); scene.add(slab);
}
const SLAB_H = 0.8;
// the floor only catches the wordmark's shadow; the desk catches the falling tiles' shadows early on
const floor = new THREE.Mesh(new THREE.PlaneGeometry(22, 22), new THREE.ShadowMaterial({ color: '#4b2fa8', opacity: 0.2 }));
floor.rotation.x = -Math.PI / 2; floor.position.copy(WORD_C); floor.receiveShadow = true; scene.add(markFx(floor));
const desk = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ color: '#4b2fa8', opacity: 0.2 }));
desk.rotation.x = -Math.PI / 2; desk.position.y = -0.012; desk.receiveShadow = true; scene.add(markFx(desk));
// soft blob shadow under the floating slab
const blobC = document.createElement('canvas'); blobC.width = blobC.height = 256;
{
  const g = blobC.getContext('2d'); g.filter = 'blur(20px)'; g.fillStyle = '#fff';
  g.beginPath(); g.roundRect(46, 46, 164, 164, 18); g.fill();
}
const blobTex = new THREE.CanvasTexture(blobC);
const blob = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: blobTex, color: '#5a35c8', transparent: true, opacity: 0, depthWrite: false }));
blob.rotation.x = -Math.PI / 2; blob.position.y = floorY + 0.01; blob.renderOrder = 1; scene.add(markFx(blob));

const blueprint = new THREE.Mesh(new THREE.PlaneGeometry(18, 18), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, uniforms: { a: { value: 1 }, uR: { value: 0 }, uT: { value: 0 }, uPad: { value: 1 } },
  vertexShader: 'varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: `uniform float a, uR, uT, uPad; varying vec2 vP;
    float h12(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 p = vP;
      vec2 g = abs(fract(p + 0.5) - 0.5);
      float w = fwidth(p.x) * 1.5;
      float line = 1.0 - smoothstep(0.0, w, min(g.x, g.y));
      float along = g.x < g.y ? p.y : p.x;
      float dash = mix(0.35, 1.0, step(0.5, fract(along * 2.0)));
      vec2 cell = floor(p + 0.5);
      float tw = 0.55 + 0.45 * sin(uT * 7.0 + h12(cell) * 6.28);
      float spark = (1.0 - smoothstep(0.0, 0.03 + w * 2.0, length(g))) * tw;
      float cross = (1.0 - smoothstep(0.0, w * 1.3, min(g.x, g.y))) * (1.0 - smoothstep(0.1, 0.22, max(g.x, g.y))) * tw;
      float box = max(abs(p.x), abs(p.y));
      float border = exp(-abs(box - 6.0) * 7.0) * 0.9;
      float fade = 1.0 - smoothstep(5.5, 9.0, box);
      float rev = 1.0 - smoothstep(uR - 1.2, uR, length(p));
      vec3 cy = vec3(0.22, 0.88, 0.92);
      float pbox = max(abs(p.x), abs(p.y));
      float pad = (1.0 - smoothstep(1.0, 1.05, pbox)) * uPad * (0.55 + 0.45 * sin(uT * 14.0));
      float padEdge = exp(-abs(pbox - 1.0) * 16.0) * uPad;
      float al = (line * dash * 0.9 + spark * 1.2 + cross * 0.8 + border * 0.5) * fade * rev * a + pad * 0.22 + padEdge * 0.7;
      vec3 col = mix(cy, vec3(1.0), clamp(spark + cross + border * 0.8 + padEdge * 0.6, 0.0, 1.0));
      gl_FragColor = vec4(col, min(1.0, al));
    }`
}));
blueprint.rotation.x = -Math.PI / 2; blueprint.position.y = 0.006; blueprint.renderOrder = 2; scene.add(markFx(blueprint));

// ======================================================================
// tiles (144, a navy 2x2 seed in the middle)
// ======================================================================
const tileGeo = new RoundedBoxGeometry(0.94, TOP, 0.94, 3, 0.075);
const haloGeo = new THREE.PlaneGeometry(0.99, 0.99); haloGeo.rotateX(-Math.PI / 2);
const haloProto = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { a: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: `uniform float a; varying vec2 vUv; void main(){ vec2 q = abs(vUv - 0.5) * 2.0; float d = max(q.x, q.y);
    float rim = smoothstep(0.80, 0.97, d) * (1.0 - smoothstep(0.97, 1.0, d));
    float fill = (1.0 - smoothstep(0.0, 1.0, d)) * 0.25;
    gl_FragColor = vec4(vec3(0.25, 0.95, 1.0) * (rim + fill) * a, 1.0); }`
});
const tileMap = new Map();
for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
  const kind = kindOf(i, j), x = tileX(i), z = tileZ(j), ring = ringOf(i, j);
  const isCore = kind === 'C';
  const mat = isCore ? new THREE.MeshStandardMaterial({ color: NAVY.clone(), roughness: 0.62 })
    : new THREE.MeshStandardMaterial({ color: C(PRE[ring]), roughness: kind === 'W' ? 0.2 : 0.74 });
  const tint = 1 + (rand() - 0.5) * 0.03;
  if (!isCore) mat.color.multiplyScalar(tint);
  const m = new THREE.Mesh(tileGeo, mat);
  shadowed(m);
  const ang01 = (Math.atan2(z, x) + Math.PI) / (Math.PI * 2);
  let ox = 0, oz = 0;
  if (Math.abs(Math.abs(x) - Math.abs(z)) < 0.01) { ox = Math.sign(x) * Math.SQRT1_2; oz = Math.sign(z) * Math.SQRT1_2; }
  else if (Math.abs(x) > Math.abs(z)) ox = Math.sign(x); else oz = Math.sign(z);
  const halo = new THREE.Mesh(haloGeo, haloProto.clone());
  halo.position.set(x, TOP + 0.004, z); halo.visible = false; halo.renderOrder = 3;
  scene.add(markFx(halo));
  const T = isCore ? (i === 5 ? (j === 5 ? 0 : 0.035) : (j === 5 ? 0.02 : 0.055)) : tileT(ring, ang01) + (rand() - 0.5) * 0.02;
  m.userData = {
    x, z, ring, kind, T, F: isCore ? 0.30 : FLIGHT, ox, oz, halo, core: isCore,
    off: isCore ? 0.5 : 2.1 + ring * 0.12, hgt: isCore ? 2.7 : 2.7 + ring * 0.2,
    tilt: (isCore ? 0.95 : 1.3) * (rand() < 0.5 ? 1 : 1), spin: isCore ? (rand() - 0.5) * 5 : (rand() - 0.5) * 0.6,
    pre: mat.color.clone(), fin: C(FIN[kind] || '#ffffff'),
  };
  if (isCore) { m.userData.ox = Math.sign(x) * Math.SQRT1_2; m.userData.oz = Math.sign(z) * Math.SQRT1_2; }
  scene.add(m); tiles.push(m); tileMap.set(i + ',' + j, m);
  m.visible = false;
}

// ======================================================================
// city pieces
// ======================================================================
function addBuild(g, x, z, h, T, dur = 0.42, over = 1.7) {
  g.userData = { x, z, h, T, dur, over };
  shadowed(g); scene.add(g); builds.push(g);
  return g;
}
function addPop(g, x, z, T, dur = 0.34, over = 2.2) {
  g.userData = { x, z, T, dur, over }; g.scale.setScalar(0.001);
  shadowed(g); scene.add(g); pops.push(g);
  return g;
}
function trimCap(w, d, y, color = '#fbf9ff') {
  const t = new THREE.Mesh(rbox(w, 0.05, d, 0.02, 2), plainMat(color, 0.7)); t.position.y = y + 0.025; return t;
}
function roofProps(g, w, d, y, kind) {
  if (kind === 'garden') {
    const gd = new THREE.Mesh(rbox(w * 0.7, 0.07, d * 0.7, 0.03, 2), plainMat('#6fd99a', 0.8));
    gd.position.y = y + 0.085; g.add(gd);
    for (let k = 0; k < 3; k++) {
      const s = new THREE.Mesh(new THREE.IcosahedronGeometry(0.06, 2), plainMat('#fbfaff', 0.8));
      s.position.set((k - 1) * w * 0.2, y + 0.16, (k % 2 ? 0.06 : -0.06) * d); g.add(s);
    }
  } else if (kind === 'solar') {
    for (let k = 0; k < 2; k++) {
      const sp = new THREE.Mesh(new THREE.BoxGeometry(w * 0.5, 0.025, 0.2), new THREE.MeshStandardMaterial({ color: '#3f55d8', roughness: 0.35, metalness: 0.2, clippingPlanes: CLIP }));
      sp.position.set(0, y + 0.1, -d * 0.2 + k * d * 0.4); sp.rotation.x = -0.35; g.add(sp);
    }
  } else if (kind === 'antenna') {
    const a = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.02, 0.5, 8), plainMat('#fbfaff', 0.5)); a.position.y = y + 0.28; g.add(a);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(1, 0.3, 0.35).multiplyScalar(2.5), clippingPlanes: CLIP })); tip.position.y = y + 0.54; g.add(tip);
  } else {
    for (let k = 0; k < 2; k++) {
      const ac = new THREE.Mesh(rbox(0.15, 0.09, 0.15, 0.02, 2), plainMat('#ebe8f4', 0.8));
      ac.position.set((k - 0.5) * w * 0.4, y + 0.095, (rand() - 0.5) * d * 0.4); g.add(ac);
    }

    let sy = 1, sx = 1;
    if (u < 1) {
      const p = clamp(u, 0, 1);
      const e = Math.pow(p, 2.0);
      const base = _a.set(d.x, TOP / 2, d.z);
      m.position.set(d.x + d.ox * d.off * (1 - e), TOP / 2 + d.hgt * (1 - e), d.z + d.oz * d.off * (1 - e));
      _ax.set(-d.oz, 0, d.ox);
      const ang = d.tilt * Math.pow(1 - p, 1.4);
      _q.setFromAxisAngle(_ax, ang); _q2.setFromAxisAngle(_up, d.spin * (1 - e));
      m.quaternion.copy(_q2).multiply(_q);
      sy = 1.06; sx = 0.97;
      m.scale.set(sx, sy, sx);
      m.position.y = m.position.y - TOP / 2 + TOP / 2 * sy;
    } else {
      const s = 0.27 * Math.exp(-v * 12) * Math.sin(v * 31);
      sy = 1 - s; sx = 1 + 0.35 * s;
      m.position.set(d.x, TOP / 2 * sy, d.z);
      m.scale.set(sx, sy, sx); m.quaternion.identity();
    }
    // halo on landing
    const hv = v + 0.02;
    d.halo.visible = hv > 0 && hv < 0.5;
    d.halo.material.uniforms.a.value = d.halo.visible ? (1 - smooth(0, 0.42, hv)) * 0.85 : 0;
    if (!d.core) {
      const kk = sweepK(d.x, d.z, t);
      m.material.color.copy(d.pre).lerp(d.fin, kk);
    }
  }

  // ---- generic wave-coloured materials (buildings, trims, roofs) ----
  for (const w of waveMats) {
    const kk = sweepK(w.x, w.z, t), md = w.mat.userData;
    w.mat.color.copy(md.pre || WHITE).lerp(md.target, kk);
    if (md.u) md.u.uLit.value = 0.35 + 0.65 * kk;
  }

  // ---- buildings rise out of their tiles (clipped at the tile top) with overshoot ----
  for (const b of builds) {
    const d = b.userData, u = (t - d.T) / d.dur;
    if (u <= 0) { b.visible = false; continue; }
    b.visible = true;
    const k = backOut(u, d.over);
    b.position.y = TOP - d.h * 1.03 * (1 - k);
    const sq = u > 1 ? 0 : 0.05 * Math.sin(u * Math.PI);
    b.scale.set(1 - sq, 1 + sq * 0.4, 1 - sq);
  }
  // ---- trees, houses, solar, flowers pop ----
  for (const p of pops) {
    const d = p.userData, u = (t - d.T) / d.dur;
    if (u <= 0) { p.visible = false; continue; }
    p.visible = true;
    const k = Math.max(0.001, backOut(u, d.over));
    p.scale.set(k, k * (u < 1 ? 1 + 0.15 * Math.sin(u * Math.PI) : 1), k);
  }
  // ---- fence ----
  for (const f of fenceBits) {
    const d = f.userData, u = (t - d.T) / 0.3;
    f.visible = u > 0;
    const k = Math.max(0.001, backOut(u, 1.5));
    if (d.rail) f.scale.set(k, 1, 1); else f.scale.set(1, k, 1);
  }
  // ---- things that arrive with the colour wave ----
  for (const w of wavePops) {
    const kk = sweepK(w.x, w.z, t);
    w.obj.scale.setScalar(Math.max(0.001, backOut(kk, 1.5)));
    if (w.flick !== undefined && w.obj.material.opacity !== undefined) w.obj.material.opacity = 0.5 + 0.4 * Math.sin(t * 3 + w.flick);
  }
  // ---- turbines ----
  for (const tb of turbines) {
    const d = tb.userData, u = (t - d.T) / 0.5;
    tb.visible = u > 0;
    tb.scale.set(1, Math.max(0.001, backOut(u, 1.2)), 1);
    const sp = Math.max(0, t - d.T - 0.25);
    d.hub.rotation.z = -(sp * sp * 2.6 / (1 + sp * 0.5)) - d.x * 0.3;
  }

  // ---- plaza + tower ----
  {
    const u = (t - plaza.userData.T) / 0.36;
    plaza.visible = u > 0; plaza.scale.setScalar(Math.max(0.001, backOut(u, 1.6)));
    const tu = (t - 1.05) / 0.5, k = tu <= 0 ? 0 : backOut(tu, 1.2);
    tower.visible = tu > 0;
    tower.position.y = TOP - TOWER_H * 1.06 * (1 - k);
    towerU.uT.value = t; towerU.uH.value = TOWER_H;
    towerU.uReveal.value = lerp(-0.5, TOWER_H + 1, smooth(1.4, 1.9, t));
    towerCollars.forEach((c, i) => { c.material.emissiveIntensity = 0.3 + 0.9 * smooth(1.5 + i * 0.1, 1.8 + i * 0.1, t) * (0.7 + 0.3 * Math.sin(t * 9 - i)); });
    const bk = smooth(1.85, 2.05, t);
    tower.userData.beacon.material.color.setRGB(0.4, 1, 1).multiplyScalar(bk * (2.2 + 2 * Math.abs(Math.sin(t * 6))));
    const topWorld = TOP + tower.userData.topY;
    beam.position.set(0, topWorld + 2.1, 0); beam.visible = bk > 0;
    beam.material.uniforms.a.value = bk * (0.45 + 0.2 * Math.sin(t * 5)) * (1 - 0.0);
    holo.material.uniforms.a.value = smooth(1.35, 1.75, t); holo.material.uniforms.t.value = t; holo.rotation.y = t * 0.4;
    baseGlow.material.opacity = smooth(1.35, 1.65, t) * (0.65 + 0.35 * Math.sin(t * 7));
    baseGlow.visible = t > 1.0;
    eRings.forEach((r, i) => {
      const ph = ((t * 0.55 + i / 3) % 1), y = TOP + 0.5 + ph * (TOWER_H - 0.9);
      const on = smooth(1.7, 1.95, t);
      r.visible = on > 0.01;
      r.position.set(0, y, 0); const rad = radiusAt(y - TOP) + 0.14 + 0.06 * Math.sin(ph * 6.28);
      r.scale.setScalar(rad); r.material.opacity = on * Math.sin(ph * Math.PI) * 0.75;
    });
    // tokens spiral up the tower
    const on = smooth(1.75, 2.05, t);
    tokens.visible = on > 0.01;
    for (let i = 0; i < TOK; i++) {
      const s = tokSeed[i], ph = (t * s.sp * 0.38 + s.ph) % 1;
      const y = TOP + 0.3 + ph * (TOWER_H + 0.6);
      const rad = radiusAt(Math.min(y - TOP, TOWER_H - 0.1)) + s.rr + ph * 0.3;
      const a = s.a + t * 2.4 * s.dir + ph * 5;
      const sc = on * Math.sin(Math.PI * ph) * (0.7 + 0.5 * s.rr);
      _b.set(Math.cos(a) * rad, y, Math.sin(a) * rad);
      _q.identity(); _a.set(sc, sc, sc);
      tokens.setMatrixAt(i, new THREE.Matrix4().compose(_b, _q, _a));
    }
    tokens.instanceMatrix.needsUpdate = true;
    // wave front ring
    const wr = (t - T_SWEEP) * SWEEP_V;
    waveRing.visible = wr > 0.2 && wr < 10;
    waveRing.scale.setScalar(Math.max(0.01, wr));
    waveRing.material.opacity = 0.6 * (1 - smooth(6.0, 9.6, wr)) * smooth(0.2, 1.2, wr);
  }

  // ---- cars and boats ----
  for (const c of cars) {
    const d = c.userData;
    const [x, z, ry] = ringPos(d.s0 + Math.max(0, t - 1.6) * d.v, d.lane);
    c.position.set(x, TOP + 0.07, z); c.rotation.y = -ry;
    const kk = smooth(T_SWEEP + 0.4, T_SWEEP + 0.7, t);
    c.scale.setScalar(Math.max(0.001, backOut(kk, 1.4)));
  }
  for (const b of boats) {
    const d = b.userData, kk = smooth(T_SWEEP + 0.5, T_SWEEP + 0.8, t);
    b.scale.setScalar(Math.max(0.001, backOut(kk, 1.4)));
    b.position.set(d.p[0] + 0.08 * Math.sin(t * d.sp + d.ph), TOP + 0.02 + 0.012 * Math.sin(t * 2.2 + d.ph), d.p[2] + 0.1 * Math.cos(t * d.sp * 0.8));
    b.rotation.z = 0.05 * Math.sin(t * 2.2 + d.ph); b.rotation.y = 0.5 + 0.1 * Math.sin(t * 0.8 + d.ph);
  }
  // ---- clouds ----
  clouds.forEach((cl, k) => {
    const d = cl.userData;
    cl.position.set(d.p[0] + t * d.v, d.p[1] + 0.12 * Math.sin(t * 0.9 + k), d.p[2]);
    const a = smooth(1.2 + k * 0.25, 2.0 + k * 0.25, t);
    cl.scale.setScalar(d.s * Math.max(0.001, backOut(a, 1.2)));
  });

  // ---- cards (appear, count up, fold back into their markers as the camera pulls back) ----
  for (const c of cards) {
    const u = (t - c.T) / 0.4, ub = clamp((t - (2.76 + (c.T - 1.5) * 0.5)) / 0.24, 0, 1);
    const eb = ub * ub * (3 - 2 * ub);
    const k = u <= 0 ? 0.001 : Math.max(0.001, backOut(u, 1.8) * (1 - 0.18 * eb));
    const alive = u > 0 && ub < 1;
    c.mesh.visible = alive; c.mark.visible = alive; c.mark2.visible = alive; c.line.visible = alive && u > 0.15;
    if (!alive) continue;
    c.mesh.scale.setScalar(k);
    c.mesh.material.opacity = 1 - smooth(0.0, 0.85, ub);                          // dissolve instead of shrinking: no smear, no leftovers
    c.line.material.opacity = 0.7 * (1 - smooth(0.0, 0.7, ub));
    c.mesh.position.copy(c.pos); c.mesh.position.y += 0.09 * Math.sin(t * 1.7 + c.T * 3) + (1 - clamp(u, 0, 1)) * -0.7 + 0.5 * eb;
    drawCard(c, (FRAME_T - c.T - 0.08) / 0.45);          // digits use the frame time, not the sub-frame, so the counters never ghost
    // leader line: card bottom centre down to its marker
    const top = c.mesh.position.clone(); top.y -= CARD_H * 0.5 * k * 0.93;
    const bot = c.anchor.clone(); bot.y += 0.02;
    const grow = smooth(0.1, 0.5, u);
    const end = bot.clone().lerp(top, grow);                 // the line grows from the marker toward the card
    const mid = _a.copy(bot).add(end).multiplyScalar(0.5), len = Math.max(0.001, bot.distanceTo(end));
    c.line.position.copy(mid); c.line.scale.set(1, len, 1);
    c.line.quaternion.setFromUnitVectors(_up, _b.copy(top).sub(bot).normalize());
    const mk = Math.max(0.001, backOut((t - c.T - 0.1) / 0.3, 2) * (1 - eb * 0.999));
    c.mark.scale.setScalar(mk); c.mark2.scale.setScalar(mk);
  }

  for (const s of sparks) {
    const d = s.userData, u = (t - d.T) / d.dur;
    s.visible = u > 0 && u < 1;
    if (s.visible) s.scale.setScalar(Math.max(0.001, d.size * Math.pow(Math.sin(Math.PI * u), 0.8)));
  }

  // ---- wordmark letters grow up out of the floor ----
  const lw = (L, amp) => {
    const u = (t - L.userData.T) / 0.42;
    const k = u <= 0 ? 0.001 : Math.max(0.001, backOut(u, 2.0));
    const s = lerp(0.82, 1, clamp(u, 0, 1) * 0.0 + easeOut3(u));
    L.scale.set(s, s, k); L.visible = u > 0;
    L.position.y = WORD_C.y + (u < 1 ? 0.0 : 0);
  };
  word.letters.forEach(L => lw(L)); word.tag.forEach(L => lw(L));
  word.sub.forEach((s, i) => { s.material.opacity = smooth(3.22 + i * 0.1, 3.62 + i * 0.1, t); });
  shineU.value.set(lerp(-10, 10, smooth(3.6, 4.7, t)), WORD_C.z);

  // ---- the slab floats; blob shadow follows ----
  const rise = smooth(2.5, 3.5, t) * 0.55 + 0.035 * Math.sin(t * 1.6) * smooth(3.3, 3.8, t);
  rig.position.y = rise;
  blob.position.set(0.5, floorY + 0.01, -0.4);
  blob.scale.setScalar(19.0 + 1.5 * smooth(2.5, 3.5, t));
  blob.material.opacity = (0.0 + 0.5 * smooth(1.2, 3.4, t)) * (1 - 0.12 * Math.sin(t * 1.6) * smooth(3.3, 3.8, t));
  floor.material.opacity = 0.2;

  drawBg(smooth(T_SWEEP, T_SWEEP + 0.95, t));
}

// everything that belongs to the city floats together: one rig group holds them
const rig = new THREE.Group();
scene.add(rig);
[slab, ...tiles, ...builds, ...pops, ...fenceBits, ...turbines, ...cars, ...boats, plaza, tower, holo, baseGlow, ...eRings, beam, tokens, waveRing, pulseRing, blueprint, ...tiles.map(m => m.userData.halo), ...wavePops.map(w => w.obj)]
  .forEach(o => rig.attach(o));
slab.position.y = 0;

function subsFor(t) { return !CAPTURE ? 1 : (t > 2.45 && t < 3.9 ? 8 : (t < 1.8 ? 6 : 3)); }
let FRAME_T = 0;
function renderAt(t) {
  t = clamp(t, 0, 4.9999); FRAME_T = t;
  renderer.setRenderTarget(accRT); renderer.setClearColor(0x000000, 1); renderer.clear();
  const S = subsFor(t);
  for (let k = 0; k < S; k++) {
    const ts = S === 1 ? t : Math.max(0, t + ((k + 0.5) / S - 0.5) / 80);
    update(ts);
    composer.render();
    {   // cards go on top of the finished frame (no AO, no bloom, no tone mapping)
      const ac0 = renderer.autoClear; renderer.autoClear = false;
      renderer.setRenderTarget(composer.readBuffer); renderer.clearDepth();
      renderer.render(overlay, cam);
      renderer.autoClear = ac0;
    }
    accQuad.material.uniforms.tDiffuse.value = composer.readBuffer.texture;
    accQuad.material.uniforms.w.value = 1 / S;
    renderer.setRenderTarget(accRT);
    const ac = renderer.autoClear; renderer.autoClear = false; accQuad.render(renderer); renderer.autoClear = ac;
  }
  finishQuad.material.uniforms.uFrame.value = Math.round(t * 30);
  renderer.setRenderTarget(null);
  finishQuad.render(renderer);
}

window.DURATION = 5;
window.renderAt = renderAt;
window.ready = Promise.all([
  document.fonts.load('800 150px Outfit'), document.fonts.load('700 38px Outfit'), document.fonts.load('700 22px "JetBrains Mono"')
]).then(() => { buildWordmark(fontFrom(window.FONT_B64.nunito)); renderAt(0); });
if (!CAPTURE) {
  window.ready.then(() => {
    const t0 = performance.now();
    (function loop() { renderAt(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); })();
  });
}
</script>
</body>
</html>
