<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt card - /robo components</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Cpath d='M38 18 L58 24 L62 42 L48 60 L24 56 L18 34 Z' fill='%23ff6b1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
:root, html[data-theme="dark"] {
  --bg:#131311; --card:#1c1a16; --text:#e8e2d2; --muted:#8d8775; --accent:#ff6b1a;
  --line:rgba(232,226,210,.22); --shadow:rgba(232,226,210,.35);
}
html[data-theme="light"] {
  --bg:#f2efe8; --card:#faf8f2; --text:#1c1a16; --muted:#6f6a5c; --accent:#ff6b1a;
  --line:rgba(28,26,22,.18); --shadow:rgba(28,26,22,.9);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Outfit',sans-serif; font-weight:400;
  transition:background .25s, color .25s;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:72px 28px;
}
.doto { font-family:'Doto',sans-serif; font-weight:900; margin:0 .18em; }
.kicker {
  font-size:11px; font-weight:400; letter-spacing:6px; text-transform:uppercase;
  color:var(--muted);
}
.stage { width:100%; max-width:860px; }
#themeToggle {
  position:fixed; top:16px; right:16px; z-index:100;
  width:40px; height:40px; border:2px solid var(--text); background:var(--card);
  color:var(--text); border-radius:0; cursor:pointer; font-size:18px; line-height:1;
  font-family:'Outfit',sans-serif; box-shadow:3px 3px 0 var(--shadow);
}
#themeToggle:active { box-shadow:1px 1px 0 var(--shadow); transform:translate(2px,2px); }

.rcpt {
  width:320px; background:var(--card); border:2px solid var(--text);
  box-shadow:8px 8px 0 var(--shadow); padding:26px 24px 20px;
  font-family:ui-monospace,monospace; font-size:12.5px; position:relative;
}
.rcpt::after { content:''; position:absolute; left:-2px; right:-2px; bottom:-12px; height:12px;
  background:linear-gradient(-45deg, transparent 8px, var(--card) 0) 0 0/16px 12px repeat-x,
             linear-gradient(45deg, transparent 8px, var(--card) 0) 8px 0/16px 12px repeat-x; }
.rcpt-h { text-align:center; font-family:'Outfit',sans-serif; letter-spacing:4px; font-weight:500; font-size:13px; margin-bottom:4px; }
.rcpt-sub { text-align:center; color:var(--muted); font-size:10.5px; margin-bottom:16px; }
.rcpt-line { border-top:1px dashed var(--muted); margin:12px 0; opacity:.6; }
.rcpt-row { display:flex; justify-content:space-between; padding:3px 0; }
.rcpt-row .m { color:var(--muted); }
.rcpt-tot { display:flex; justify-content:space-between; align-items:baseline; font-family:'Outfit',sans-serif; font-weight:500; font-size:14px; margin-top:4px; }
.rcpt-tot .doto { font-family:'Doto',sans-serif; font-weight:900; font-size:24px; color:var(--accent); }
.rcpt-bar { height:34px; margin:16px 0 6px; background:repeating-linear-gradient(90deg, var(--text) 0 2px, transparent 2px 5px, var(--text) 5px 6px, transparent 6px 11px); }
.rcpt-foot { text-align:center; color:var(--muted); font-size:10px; letter-spacing:2px; }
</style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle dark / light mode">◐</button>
<div class="stage">
<div class="rcpt">
  <div class="rcpt-h">THE STUDIO</div>
  <div class="rcpt-sub">One build, itemized · Tue 09:00</div>
  <div class="rcpt-line"></div>
  <div class="rcpt-row"><span>Research + script</span><span class="m">3.5 hrs</span></div>
  <div class="rcpt-row"><span>Build + clean-machine test</span><span class="m">4.0 hrs</span></div>
  <div class="rcpt-row"><span>Record + edit pipeline</span><span class="m">2.5 hrs</span></div>
  <div class="rcpt-row"><span>Free prompt (given away)</span><span class="m">$0</span></div>
  <div class="rcpt-line"></div>
  <div class="rcpt-tot"><span>Sold as a system</span><span class="doto">$4,800</span></div>
  <div class="rcpt-bar"></div>
  <div class="rcpt-foot">SELL WHAT APPRECIATES</div>
</div>
</div>
<script>

(function () {
  const root = document.documentElement;
  const apply = t => {
    root.setAttribute('data-theme', t);
    root.style.colorScheme = t;
    if (window.roboRedraw) window.roboRedraw();
  };
  const forced = new URLSearchParams(location.search).get('theme');
  apply(forced || localStorage.getItem('robo-theme') || 'dark');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('robo-theme', next);
    apply(next);
  });
  window.addEventListener('message', e => {
    if (e.data && e.data.roboTheme) { localStorage.setItem('robo-theme', e.data.roboTheme); apply(e.data.roboTheme); }
  });
})();

</script>
</body>
</html>
