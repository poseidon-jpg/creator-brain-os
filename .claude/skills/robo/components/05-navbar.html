<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nav bar - /robo components</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Cpath d='M38 18 L58 24 L62 42 L48 60 L24 56 L18 34 Z' fill='%23ff6b1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
:root, html[data-theme="dark"] {
  --bg:#131311; --card:#1c1a16; --text:#e8e2d2; --muted:#8d8775; --accent:#ff6b1a;
  --line:rgba(232,226,210,.22); --shadow:rgba(232,226,210,.35);
}
html[data-theme="light"] {
  --bg:#f2efe8; --card:#faf8f2; --text:#1c1a16; --muted:#6f6a5c; --accent:#ff6b1a;
  --line:rgba(28,26,22,.18); --shadow:rgba(28,26,22,.9);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Outfit',sans-serif; font-weight:400;
  transition:background .25s, color .25s;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:72px 28px;
}
.doto { font-family:'Doto',sans-serif; font-weight:900; margin:0 .18em; }
.kicker {
  font-size:11px; font-weight:400; letter-spacing:6px; text-transform:uppercase;
  color:var(--muted);
}
.stage { width:100%; max-width:860px; }
#themeToggle {
  position:fixed; top:16px; right:16px; z-index:100;
  width:40px; height:40px; border:2px solid var(--text); background:var(--card);
  color:var(--text); border-radius:0; cursor:pointer; font-size:18px; line-height:1;
  font-family:'Outfit',sans-serif; box-shadow:3px 3px 0 var(--shadow);
}
#themeToggle:active { box-shadow:1px 1px 0 var(--shadow); transform:translate(2px,2px); }

body { align-items:flex-start; }
.nav {
  display:flex; align-items:center; gap:34px; width:100%;
  border:2px solid var(--text); background:var(--card); padding:14px 22px;
  box-shadow:6px 6px 0 var(--shadow);
}
.nav-brand { display:flex; align-items:center; gap:12px; font-weight:500; font-size:16px; letter-spacing:2px; text-transform:uppercase; }
.nav-brand svg { width:30px; height:30px; color:var(--accent); }
.nav-links { display:flex; gap:26px; margin-left:auto; }
.nav-links a { color:var(--muted); text-decoration:none; font-size:14px; letter-spacing:.5px; transition:color .15s; }
.nav-links a:hover, .nav-links a.on { color:var(--text); }
.nav-links a.on { box-shadow:0 2px 0 var(--accent); padding-bottom:3px; }
.nav-cta {
  font-size:13.5px; font-weight:500; color:#fff; background:var(--accent); border:2px solid var(--accent);
  padding:9px 18px; text-decoration:none; box-shadow:3px 3px 0 var(--shadow);
}
.nav-cta:active { transform:translate(2px,2px); box-shadow:0 0 0 var(--shadow); }
</style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle dark / light mode">◐</button>
<div class="stage">
<nav class="nav">
  <div class="nav-brand">
    <svg viewBox="0 0 80 80" aria-label="brand mark"><path d="M58 24 L62 28 L66 46 L62 42 Z" fill="currentColor" opacity="0.55" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M62 42 L66 46 L52 64 L48 60 Z" fill="currentColor" opacity="0.55" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M48 60 L52 64 L28 60 L24 56 Z" fill="currentColor" opacity="0.55" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M38 18 L58 24 L62 42 L48 60 L24 56 L18 34 Z" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg>
    the studio
  </div>
  <div class="nav-links">
    <a class="on" href="#">Lessons</a>
    <a href="#">Templates</a>
    <a href="#">Community</a>
    <a href="#">About</a>
  </div>
  <a class="nav-cta" href="#">Join the brand</a>
</nav>
</div>
<script>

(function () {
  const root = document.documentElement;
  const apply = t => {
    root.setAttribute('data-theme', t);
    root.style.colorScheme = t;
    if (window.roboRedraw) window.roboRedraw();
  };
  const forced = new URLSearchParams(location.search).get('theme');
  apply(forced || localStorage.getItem('robo-theme') || 'dark');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('robo-theme', next);
    apply(next);
  });
  window.addEventListener('message', e => {
    if (e.data && e.data.roboTheme) { localStorage.setItem('robo-theme', e.data.roboTheme); apply(e.data.roboTheme); }
  });
})();

</script>
</body>
</html>
