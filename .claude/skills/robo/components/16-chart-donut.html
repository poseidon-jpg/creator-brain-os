<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donut chart - /robo components</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Cpath d='M38 18 L58 24 L62 42 L48 60 L24 56 L18 34 Z' fill='%23ff6b1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
:root, html[data-theme="dark"] {
  --bg:#131311; --card:#1c1a16; --text:#e8e2d2; --muted:#8d8775; --accent:#ff6b1a;
  --line:rgba(232,226,210,.22); --shadow:rgba(232,226,210,.35);
}
html[data-theme="light"] {
  --bg:#f2efe8; --card:#faf8f2; --text:#1c1a16; --muted:#6f6a5c; --accent:#ff6b1a;
  --line:rgba(28,26,22,.18); --shadow:rgba(28,26,22,.9);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Outfit',sans-serif; font-weight:400;
  transition:background .25s, color .25s;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:72px 28px;
}
.doto { font-family:'Doto',sans-serif; font-weight:900; margin:0 .18em; }
.kicker {
  font-size:11px; font-weight:400; letter-spacing:6px; text-transform:uppercase;
  color:var(--muted);
}
.stage { width:100%; max-width:860px; }
#themeToggle {
  position:fixed; top:16px; right:16px; z-index:100;
  width:40px; height:40px; border:2px solid var(--text); background:var(--card);
  color:var(--text); border-radius:0; cursor:pointer; font-size:18px; line-height:1;
  font-family:'Outfit',sans-serif; box-shadow:3px 3px 0 var(--shadow);
}
#themeToggle:active { box-shadow:1px 1px 0 var(--shadow); transform:translate(2px,2px); }

.chart { border:2px solid var(--text); background:var(--card); padding:26px 28px 24px; box-shadow:6px 6px 0 var(--shadow); display:grid; grid-template-columns:auto 1fr; gap:30px; align-items:center; max-width:520px; }
.donut { position:relative; width:170px; height:170px; }
.donut svg { transform:rotate(-90deg); }
.donut .ring { stroke:var(--line); fill:none; }
.donut .seg { fill:none; }
.donut-mid { position:absolute; inset:0; display:grid; place-items:center; text-align:center; }
.donut-n { font-family:'Doto',sans-serif; font-weight:900; font-size:34px; color:var(--accent); line-height:1; }
.donut-l { font-size:9.5px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-top:6px; }
.dleg { display:grid; gap:12px; }
.dleg-row { display:flex; align-items:center; gap:12px; font-size:14px; }
.dleg-row i { width:12px; height:12px; border:2px solid var(--text); }
.dleg-row.a i { background:var(--accent); border-color:var(--accent); }
.dleg-row.b i { background:var(--text); }
.dleg-row.c i { background:transparent; }
.dleg-v { margin-left:auto; font-family:'Doto',sans-serif; font-weight:700; font-size:14px; color:var(--muted); }
</style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle dark / light mode">◐</button>
<div class="stage">
<figure class="chart">
  <div class="donut">
    <svg viewBox="0 0 170 170" width="170" height="170">
      <circle class="ring" cx="85" cy="85" r="66" stroke-width="18"/>
      <circle class="seg" cx="85" cy="85" r="66" stroke-width="18" stroke="var(--accent)" stroke-dasharray="236 415" />
      <circle class="seg" cx="85" cy="85" r="66" stroke-width="18" stroke="var(--text)" stroke-dasharray="104 415" stroke-dashoffset="-236"/>
    </svg>
    <div class="donut-mid"><div><div class="donut-n">57%</div><div class="donut-l">from lessons</div></div></div>
  </div>
  <div class="dleg">
    <div class="dleg-row a"><i></i>YouTube lessons<span class="dleg-v">57%</span></div>
    <div class="dleg-row b"><i></i>Member referrals<span class="dleg-v">25%</span></div>
    <div class="dleg-row c"><i></i>Everything else<span class="dleg-v">18%</span></div>
  </div>
</figure>
</div>
<script>

(function () {
  const root = document.documentElement;
  const apply = t => {
    root.setAttribute('data-theme', t);
    root.style.colorScheme = t;
    if (window.roboRedraw) window.roboRedraw();
  };
  const forced = new URLSearchParams(location.search).get('theme');
  apply(forced || localStorage.getItem('robo-theme') || 'dark');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('robo-theme', next);
    apply(next);
  });
  window.addEventListener('message', e => {
    if (e.data && e.data.roboTheme) { localStorage.setItem('robo-theme', e.data.roboTheme); apply(e.data.roboTheme); }
  });
})();

</script>
</body>
</html>
