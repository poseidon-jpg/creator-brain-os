<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session ticket - /robo components</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Cpath d='M38 18 L58 24 L62 42 L48 60 L24 56 L18 34 Z' fill='%23ff6b1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
:root, html[data-theme="dark"] {
  --bg:#131311; --card:#1c1a16; --text:#e8e2d2; --muted:#8d8775; --accent:#ff6b1a;
  --line:rgba(232,226,210,.22); --shadow:rgba(232,226,210,.35);
}
html[data-theme="light"] {
  --bg:#f2efe8; --card:#faf8f2; --text:#1c1a16; --muted:#6f6a5c; --accent:#ff6b1a;
  --line:rgba(28,26,22,.18); --shadow:rgba(28,26,22,.9);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Outfit',sans-serif; font-weight:400;
  transition:background .25s, color .25s;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:72px 28px;
}
.doto { font-family:'Doto',sans-serif; font-weight:900; margin:0 .18em; }
.kicker {
  font-size:11px; font-weight:400; letter-spacing:6px; text-transform:uppercase;
  color:var(--muted);
}
.stage { width:100%; max-width:860px; }
#themeToggle {
  position:fixed; top:16px; right:16px; z-index:100;
  width:40px; height:40px; border:2px solid var(--text); background:var(--card);
  color:var(--text); border-radius:0; cursor:pointer; font-size:18px; line-height:1;
  font-family:'Outfit',sans-serif; box-shadow:3px 3px 0 var(--shadow);
}
#themeToggle:active { box-shadow:1px 1px 0 var(--shadow); transform:translate(2px,2px); }

.tix { display:flex; width:560px; filter:drop-shadow(8px 8px 0 var(--shadow)); }
.tix-main, .tix-stub { background:var(--card); border:2px solid var(--text); padding:24px 26px; position:relative; }
.tix-main { flex:1; border-right:none;
  -webkit-mask:radial-gradient(circle 9px at right 0px top 50%, transparent 98%, #000) ; mask:radial-gradient(circle 9px at 100% 50%, transparent 98%, #000); }
.tix-stub { width:150px; border-left:2px dashed var(--muted); display:grid; align-content:center; justify-items:center; gap:8px; text-align:center;
  -webkit-mask:radial-gradient(circle 9px at 0% 50%, transparent 98%, #000); mask:radial-gradient(circle 9px at 0% 50%, transparent 98%, #000); }
.tix-k { font-size:9.5px; letter-spacing:4px; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
.tix-t { font-size:23px; font-weight:500; letter-spacing:-0.6px; margin-bottom:14px; }
.tix-meta { display:flex; gap:26px; font-size:12px; color:var(--muted); }
.tix-meta b { display:block; font-size:13.5px; font-weight:500; color:var(--text); margin-top:2px; }
.tix-no { font-family:'Doto',sans-serif; font-weight:900; font-size:26px; color:var(--accent); }
.tix-stub .kicker { font-size:9px; letter-spacing:3px; }
</style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle dark / light mode">◐</button>
<div class="stage">
<div class="tix">
  <div class="tix-main">
    <div class="tix-k">Create Session · Live</div>
    <div class="tix-t">Build night: agents that invoice clients</div>
    <div class="tix-meta">
      <span>Date<b>Thu Jul 17</b></span>
      <span>Time<b>7:00 PM AEST</b></span>
      <span>Where<b>the brand · Zoom</b></span>
    </div>
  </div>
  <div class="tix-stub">
    <span class="kicker">Admit one</span>
    <span class="tix-no">N°214</span>
    <span class="kicker">Member</span>
  </div>
</div>
</div>
<script>

(function () {
  const root = document.documentElement;
  const apply = t => {
    root.setAttribute('data-theme', t);
    root.style.colorScheme = t;
    if (window.roboRedraw) window.roboRedraw();
  };
  const forced = new URLSearchParams(location.search).get('theme');
  apply(forced || localStorage.getItem('robo-theme') || 'dark');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('robo-theme', next);
    apply(next);
  });
  window.addEventListener('message', e => {
    if (e.data && e.data.roboTheme) { localStorage.setItem('robo-theme', e.data.roboTheme); apply(e.data.roboTheme); }
  });
})();

</script>
</body>
</html>
