<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing rows - /robo components</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Cpath d='M38 18 L58 24 L62 42 L48 60 L24 56 L18 34 Z' fill='%23ff6b1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
:root, html[data-theme="dark"] {
  --bg:#131311; --card:#1c1a16; --text:#e8e2d2; --muted:#8d8775; --accent:#ff6b1a;
  --line:rgba(232,226,210,.22); --shadow:rgba(232,226,210,.35);
}
html[data-theme="light"] {
  --bg:#f2efe8; --card:#faf8f2; --text:#1c1a16; --muted:#6f6a5c; --accent:#ff6b1a;
  --line:rgba(28,26,22,.18); --shadow:rgba(28,26,22,.9);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Outfit',sans-serif; font-weight:400;
  transition:background .25s, color .25s;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:72px 28px;
}
.doto { font-family:'Doto',sans-serif; font-weight:900; margin:0 .18em; }
.kicker {
  font-size:11px; font-weight:400; letter-spacing:6px; text-transform:uppercase;
  color:var(--muted);
}
.stage { width:100%; max-width:860px; }
#themeToggle {
  position:fixed; top:16px; right:16px; z-index:100;
  width:40px; height:40px; border:2px solid var(--text); background:var(--card);
  color:var(--text); border-radius:0; cursor:pointer; font-size:18px; line-height:1;
  font-family:'Outfit',sans-serif; box-shadow:3px 3px 0 var(--shadow);
}
#themeToggle:active { box-shadow:1px 1px 0 var(--shadow); transform:translate(2px,2px); }

.price { display:grid; gap:18px; max-width:640px; }
.price-row {
  display:grid; grid-template-columns:1fr auto auto; gap:24px; align-items:center;
  border:2px solid var(--text); background:var(--card); padding:20px 24px;
  box-shadow:5px 5px 0 var(--shadow);
}
.price-row.hot { border-color:var(--accent); box-shadow:5px 5px 0 var(--accent); }
.price-t { font-size:18px; font-weight:500; letter-spacing:-0.3px; margin-bottom:4px; }
.price-s { font-size:13px; color:var(--muted); }
.price-n { font-family:'Doto',sans-serif; font-weight:900; font-size:30px; }
.price-n small { font-family:'Outfit',sans-serif; font-weight:400; font-size:12px; color:var(--muted); letter-spacing:1px; }
.price-row.hot .price-n { color:var(--accent); }
.price-cta { font-size:13.5px; font-weight:500; padding:10px 18px; text-decoration:none; border:2px solid var(--text); color:var(--text); }
.price-row.hot .price-cta { background:var(--accent); border-color:var(--accent); color:#fff; }
.price-tag { display:inline-block; font-size:9.5px; letter-spacing:3px; text-transform:uppercase; color:var(--accent); margin-left:10px; }
</style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle dark / light mode">◐</button>
<div class="stage">
<div class="price">
  <div class="price-row">
    <div><div class="price-t">Free lessons</div><div class="price-s">Weekly YouTube build + the prompt, always free</div></div>
    <div class="price-n">$0</div>
    <a class="price-cta" href="#">Subscribe</a>
  </div>
  <div class="price-row hot">
    <div><div class="price-t">the brand<span class="price-tag">Most picked</span></div><div class="price-s">Every build's full system, live sessions, $100 challenges</div></div>
    <div class="price-n">$97<small>/mo</small></div>
    <a class="price-cta" href="#">Join now</a>
  </div>
  <div class="price-row">
    <div><div class="price-t">Annual</div><div class="price-s">Two months free, same everything</div></div>
    <div class="price-n">$697<small>/yr</small></div>
    <a class="price-cta" href="#">Go annual</a>
  </div>
</div>
</div>
<script>

(function () {
  const root = document.documentElement;
  const apply = t => {
    root.setAttribute('data-theme', t);
    root.style.colorScheme = t;
    if (window.roboRedraw) window.roboRedraw();
  };
  const forced = new URLSearchParams(location.search).get('theme');
  apply(forced || localStorage.getItem('robo-theme') || 'dark');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('robo-theme', next);
    apply(next);
  });
  window.addEventListener('message', e => {
    if (e.data && e.data.roboTheme) { localStorage.setItem('robo-theme', e.data.roboTheme); apply(e.data.roboTheme); }
  });
})();

</script>
</body>
</html>
