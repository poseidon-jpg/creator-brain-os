<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buttons - /robo components</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Cpath d='M38 18 L58 24 L62 42 L48 60 L24 56 L18 34 Z' fill='%23ff6b1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
:root, html[data-theme="dark"] {
  --bg:#131311; --card:#24221c; --text:#e8e2d2; --muted:#8d8775; --accent:#ff6b1a;
  --line:rgba(232,226,210,.22); --shadow:#000; --btnline:#24221c;   /* Ink Well Soft: borderless in dark */
}
html[data-theme="light"] {
  --bg:#f2efe8; --card:#faf8f2; --text:#1c1a16; --muted:#6f6a5c; --accent:#ff6b1a;
  --line:rgba(28,26,22,.18); --shadow:rgba(28,26,22,.9); --btnline:#1c1a16;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Outfit',sans-serif; font-weight:400;
  transition:background .25s, color .25s;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:72px 28px;
}
.doto { font-family:'Doto',sans-serif; font-weight:900; margin:0 .18em; }
.kicker {
  font-size:11px; font-weight:400; letter-spacing:6px; text-transform:uppercase;
  color:var(--muted);
}
.stage { width:100%; max-width:860px; }
#themeToggle {
  position:fixed; top:16px; right:16px; z-index:100;
  width:40px; height:40px; border:2px solid var(--text); background:var(--card);
  color:var(--text); border-radius:0; cursor:pointer; font-size:18px; line-height:1;
  font-family:'Outfit',sans-serif; box-shadow:3px 3px 0 var(--shadow);
}
#themeToggle:active { box-shadow:1px 1px 0 var(--shadow); transform:translate(2px,2px); }

/* Ink Well Soft buttons (locked 2026-07-08): r8, flat at rest, shadow fades in on hover, press collapses it */
.btn {
  display:inline-block; font-family:'Outfit',sans-serif; font-weight:500; font-size:15px;
  letter-spacing:.4px; padding:13px 26px; border-radius:8px; cursor:pointer;
  border:2px solid var(--btnline); background:var(--card); color:var(--text);
  box-shadow:0 0 0 rgba(0,0,0,0); transition:transform .15s ease, box-shadow .15s ease;
  text-decoration:none;
}
.btn:hover { transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--shadow); }
.btn:active { transform:translate(1px,1px); box-shadow:0 0 0 rgba(0,0,0,0); transition-duration:.06s; }
.btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-ghost { border-color:transparent; background:transparent; box-shadow:none; padding:13px 6px; }
.btn-ghost:hover { transform:none; box-shadow:none; color:var(--accent); }
.btn-ghost .arr { display:inline-block; transition:transform .15s; margin-left:6px; }
.btn-ghost:hover .arr { transform:translateX(4px); }
.btn-row { display:flex; gap:22px; align-items:center; flex-wrap:wrap; }
</style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle dark / light mode">◐</button>
<div class="stage">
<div class="btn-row">
  <a class="btn btn-primary" href="#">Start the build</a>
  <a class="btn" href="#">Watch the lesson</a>
  <a class="btn btn-ghost" href="#">Browse all templates<span class="arr">→</span></a>
</div>
</div>
<script>

(function () {
  const root = document.documentElement;
  const apply = t => {
    root.setAttribute('data-theme', t);
    root.style.colorScheme = t;
    if (window.roboRedraw) window.roboRedraw();
  };
  const forced = new URLSearchParams(location.search).get('theme');
  apply(forced || localStorage.getItem('robo-theme') || 'dark');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('robo-theme', next);
    apply(next);
  });
  window.addEventListener('message', e => {
    if (e.data && e.data.roboTheme) { localStorage.setItem('robo-theme', e.data.roboTheme); apply(e.data.roboTheme); }
  });
})();

</script>
</body>
</html>
