<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Footer - /robo components</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Cpath d='M38 18 L58 24 L62 42 L48 60 L24 56 L18 34 Z' fill='%23ff6b1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
:root, html[data-theme="dark"] {
  --bg:#131311; --card:#1c1a16; --text:#e8e2d2; --muted:#8d8775; --accent:#ff6b1a;
  --line:rgba(232,226,210,.22); --shadow:rgba(232,226,210,.35);
}
html[data-theme="light"] {
  --bg:#f2efe8; --card:#faf8f2; --text:#1c1a16; --muted:#6f6a5c; --accent:#ff6b1a;
  --line:rgba(28,26,22,.18); --shadow:rgba(28,26,22,.9);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Outfit',sans-serif; font-weight:400;
  transition:background .25s, color .25s;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:72px 28px;
}
.doto { font-family:'Doto',sans-serif; font-weight:900; margin:0 .18em; }
.kicker {
  font-size:11px; font-weight:400; letter-spacing:6px; text-transform:uppercase;
  color:var(--muted);
}
.stage { width:100%; max-width:860px; }
#themeToggle {
  position:fixed; top:16px; right:16px; z-index:100;
  width:40px; height:40px; border:2px solid var(--text); background:var(--card);
  color:var(--text); border-radius:0; cursor:pointer; font-size:18px; line-height:1;
  font-family:'Outfit',sans-serif; box-shadow:3px 3px 0 var(--shadow);
}
#themeToggle:active { box-shadow:1px 1px 0 var(--shadow); transform:translate(2px,2px); }

body { align-items:flex-end; }
.foot { width:100%; border:2px solid var(--text); background:var(--card); box-shadow:6px 6px 0 var(--shadow); padding:36px 36px 26px; }
.foot-grid { display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:36px; padding-bottom:28px; border-bottom:1px solid var(--line); }
.foot-brand { display:flex; align-items:center; gap:12px; font-weight:500; letter-spacing:2px; text-transform:uppercase; margin-bottom:14px; }
.foot-brand svg { width:28px; height:28px; color:var(--accent); }
.foot-tag { font-size:13.5px; color:var(--muted); line-height:1.6; max-width:32ch; }
.foot-h { font-size:10px; letter-spacing:4px; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }
.foot ul { list-style:none; display:grid; gap:10px; }
.foot ul a { color:var(--text); text-decoration:none; font-size:14px; }
.foot ul a:hover { color:var(--accent); }
.foot-base { display:flex; justify-content:space-between; padding-top:18px; font-size:11.5px; color:var(--muted); letter-spacing:1px; }
@media (max-width:640px){ .foot-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle dark / light mode">◐</button>
<div class="stage">
<footer class="foot">
  <div class="foot-grid">
    <div>
      <div class="foot-brand"><svg viewBox="0 0 80 80" aria-label="brand mark"><path d="M58 24 L62 28 L66 46 L62 42 Z" fill="currentColor" opacity="0.55" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M62 42 L66 46 L52 64 L48 60 Z" fill="currentColor" opacity="0.55" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M48 60 L52 64 L28 60 L24 56 Z" fill="currentColor" opacity="0.55" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M38 18 L58 24 L62 42 L48 60 L24 56 L18 34 Z" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg>the studio</div>
      <p class="foot-tag">The command center for AI agents. Built in public, one lesson a week.</p>
    </div>
    <div><div class="foot-h">Learn</div><ul><li><a href="#">Weekly lessons</a></li><li><a href="#">Masterclasses</a></li><li><a href="#">Templates</a></li></ul></div>
    <div><div class="foot-h">Community</div><ul><li><a href="#">the brand</a></li><li><a href="#">$100 challenges</a></li><li><a href="#">Newsletter</a></li></ul></div>
  </div>
  <div class="foot-base"><span>© the studio. Learn more at the brand.</span><span>Made with agents.</span></div>
</footer>
</div>
<script>

(function () {
  const root = document.documentElement;
  const apply = t => {
    root.setAttribute('data-theme', t);
    root.style.colorScheme = t;
    if (window.roboRedraw) window.roboRedraw();
  };
  const forced = new URLSearchParams(location.search).get('theme');
  apply(forced || localStorage.getItem('robo-theme') || 'dark');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('robo-theme', next);
    apply(next);
  });
  window.addEventListener('message', e => {
    if (e.data && e.data.roboTheme) { localStorage.setItem('robo-theme', e.data.roboTheme); apply(e.data.roboTheme); }
  });
})();

</script>
</body>
</html>
