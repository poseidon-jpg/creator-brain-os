<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar chart - /robo components</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Cpath d='M38 18 L58 24 L62 42 L48 60 L24 56 L18 34 Z' fill='%23ff6b1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
:root, html[data-theme="dark"] {
  --bg:#131311; --card:#1c1a16; --text:#e8e2d2; --muted:#8d8775; --accent:#ff6b1a;
  --line:rgba(232,226,210,.22); --shadow:rgba(232,226,210,.35);
}
html[data-theme="light"] {
  --bg:#f2efe8; --card:#faf8f2; --text:#1c1a16; --muted:#6f6a5c; --accent:#ff6b1a;
  --line:rgba(28,26,22,.18); --shadow:rgba(28,26,22,.9);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Outfit',sans-serif; font-weight:400;
  transition:background .25s, color .25s;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:72px 28px;
}
.doto { font-family:'Doto',sans-serif; font-weight:900; margin:0 .18em; }
.kicker {
  font-size:11px; font-weight:400; letter-spacing:6px; text-transform:uppercase;
  color:var(--muted);
}
.stage { width:100%; max-width:860px; }
#themeToggle {
  position:fixed; top:16px; right:16px; z-index:100;
  width:40px; height:40px; border:2px solid var(--text); background:var(--card);
  color:var(--text); border-radius:0; cursor:pointer; font-size:18px; line-height:1;
  font-family:'Outfit',sans-serif; box-shadow:3px 3px 0 var(--shadow);
}
#themeToggle:active { box-shadow:1px 1px 0 var(--shadow); transform:translate(2px,2px); }

.chart { border:2px solid var(--text); background:var(--card); padding:26px 28px 18px; box-shadow:6px 6px 0 var(--shadow); max-width:560px; }
.chart-k { margin-bottom:6px; }
.chart-t { font-size:19px; font-weight:500; letter-spacing:-0.4px; margin-bottom:18px; }
.chart-x { display:grid; grid-template-columns:repeat(6,1fr); text-align:center; font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-top:8px; }
</style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle dark / light mode">◐</button>
<div class="stage">
<figure class="chart">
  <div class="kicker chart-k">Uploads · views per lesson</div>
  <div class="chart-t">June ran <span style="color:var(--accent)">2.1×</span> the spring average</div>
  <canvas id="barDots"></canvas>
  <div class="chart-x"><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span><span>Jul</span></div>
</figure>
</div>
<script>

(function () {
  const root = document.documentElement;
  const apply = t => {
    root.setAttribute('data-theme', t);
    root.style.colorScheme = t;
    if (window.roboRedraw) window.roboRedraw();
  };
  const forced = new URLSearchParams(location.search).get('theme');
  apply(forced || localStorage.getItem('robo-theme') || 'dark');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('robo-theme', next);
    apply(next);
  });
  window.addEventListener('message', e => {
    if (e.data && e.data.roboTheme) { localStorage.setItem('robo-theme', e.data.roboTheme); apply(e.data.roboTheme); }
  });
})();

function halftone(id, w, h, step, maxR, color, fn, color2, fn2) {
  const c = document.getElementById(id); if (!c) return;
  const ctx = c.getContext('2d'); const dpr = window.devicePixelRatio || 1;
  c.width = w * dpr; c.height = h * dpr; c.style.width = w + 'px'; c.style.height = h + 'px'; ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  for (let y = step / 2; y < h; y += step) for (let x = step / 2; x < w; x += step) {
    const u = x / w, v = y / h;
    let b = fn(u, v), col = color;
    if (fn2) { const b2 = fn2(u, v); if (b2 > b) { b = b2; col = color2; } }
    if (b <= 0.02) continue;
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, Math.min(maxR, b * maxR), 0, Math.PI * 2); ctx.fill();
  }
}
function inkDot() {
  return document.documentElement.getAttribute('data-theme') === 'light'
    ? 'rgba(28,26,22,0.88)' : 'rgba(232,226,210,0.85)';
}

const BARS = [.34, .42, .38, .55, .95, .72];
const HOT = 4;
function drawBars() {
  halftone('barDots', 500, 190, 6, 1.9, inkDot(), (u, v) => {
    const i = Math.min(BARS.length - 1, Math.floor(u * BARS.length));
    const inBarX = (u * BARS.length) % 1; if (inBarX < .12 || inBarX > .88) return 0;
    if (i === HOT) return 0;
    return (1 - v) < BARS[i] ? .55 + (1 - v) * .4 : 0;
  }, '#ff6b1a', (u, v) => {
    const i = Math.min(BARS.length - 1, Math.floor(u * BARS.length));
    const inBarX = (u * BARS.length) % 1; if (inBarX < .12 || inBarX > .88) return 0;
    if (i !== HOT) return 0;
    return (1 - v) < BARS[i] ? .6 + (1 - v) * .4 : 0;
  });
}
window.roboRedraw = drawBars; drawBars();

</script>
</body>
</html>
