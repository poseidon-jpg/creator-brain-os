<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent terminal - /robo components</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Cpath d='M38 18 L58 24 L62 42 L48 60 L24 56 L18 34 Z' fill='%23ff6b1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
:root, html[data-theme="dark"] {
  --bg:#131311; --card:#1c1a16; --text:#e8e2d2; --muted:#8d8775; --accent:#ff6b1a;
  --line:rgba(232,226,210,.22); --shadow:rgba(232,226,210,.35);
}
html[data-theme="light"] {
  --bg:#f2efe8; --card:#faf8f2; --text:#1c1a16; --muted:#6f6a5c; --accent:#ff6b1a;
  --line:rgba(28,26,22,.18); --shadow:rgba(28,26,22,.9);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Outfit',sans-serif; font-weight:400;
  transition:background .25s, color .25s;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:72px 28px;
}
.doto { font-family:'Doto',sans-serif; font-weight:900; margin:0 .18em; }
.kicker {
  font-size:11px; font-weight:400; letter-spacing:6px; text-transform:uppercase;
  color:var(--muted);
}
.stage { width:100%; max-width:860px; }
#themeToggle {
  position:fixed; top:16px; right:16px; z-index:100;
  width:40px; height:40px; border:2px solid var(--text); background:var(--card);
  color:var(--text); border-radius:0; cursor:pointer; font-size:18px; line-height:1;
  font-family:'Outfit',sans-serif; box-shadow:3px 3px 0 var(--shadow);
}
#themeToggle:active { box-shadow:1px 1px 0 var(--shadow); transform:translate(2px,2px); }

.term { width:100%; max-width:560px; border:2px solid var(--text); background:var(--card); box-shadow:6px 6px 0 var(--shadow); }
.term-bar { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:2px solid var(--text); }
.term-dot { width:9px; height:9px; border:2px solid var(--text); }
.term-dot.on { background:var(--accent); border-color:var(--accent); }
.term-title { margin-left:auto; font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); }
.term-body { padding:18px 20px 22px; font:13px/1.75 ui-monospace,monospace; min-height:170px; }
.term-body .p { color:var(--accent); }
.term-body .m { color:var(--muted); }
.term-body .ok { color:var(--accent); font-weight:600; }
.caret { display:inline-block; width:8px; height:14px; background:var(--accent); vertical-align:-2px; animation:blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity:0; } }
</style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle dark / light mode">◐</button>
<div class="stage">
<div class="term">
  <div class="term-bar"><span class="term-dot on"></span><span class="term-dot"></span><span class="term-dot"></span><span class="term-title">a1 · overnight run</span></div>
  <div class="term-body" id="termOut"></div>
</div>
</div>
<script>

(function () {
  const root = document.documentElement;
  const apply = t => {
    root.setAttribute('data-theme', t);
    root.style.colorScheme = t;
    if (window.roboRedraw) window.roboRedraw();
  };
  const forced = new URLSearchParams(location.search).get('theme');
  apply(forced || localStorage.getItem('robo-theme') || 'dark');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('robo-theme', next);
    apply(next);
  });
  window.addEventListener('message', e => {
    if (e.data && e.data.roboTheme) { localStorage.setItem('robo-theme', e.data.roboTheme); apply(e.data.roboTheme); }
  });
})();

const LINES = [
  ['p', '> a1 run weekly-report'],
  ['m', 'reading data/tasks.json ... 34 tasks'],
  ['m', 'drafting client summary ... done in 41s'],
  ['m', 'rendering /robo one-pager ... done'],
  ['ok', '✓ report ready · output/weekly-report.html'],
  ['p', '> _']
];
const out = document.getElementById('termOut');
let li = 0, ci = 0, cur2 = document.createElement('div');
out.appendChild(cur2);
function type() {
  if (li >= LINES.length) { out.lastChild.innerHTML = '<span class="p">&gt; </span><span class="caret"></span>'; return; }
  const [cls, txt] = LINES[li];
  ci++;
  cur2.innerHTML = '<span class="' + cls + '">' + txt.slice(0, ci).replace('>', '&gt;') + '</span>';
  if (ci >= txt.length) { li++; ci = 0; cur2 = document.createElement('div'); out.appendChild(cur2); setTimeout(type, 300); }
  else setTimeout(type, txt[ci] === ' ' ? 24 : 14 + Math.sin(ci) * 8);
}
type();

</script>
</body>
</html>
