<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card - /robo components</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Cpath d='M38 18 L58 24 L62 42 L48 60 L24 56 L18 34 Z' fill='%23ff6b1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
:root, html[data-theme="dark"] {
  --bg:#131311; --card:#24221c; --text:#e8e2d2; --muted:#8d8775; --accent:#ff6b1a;
  --line:rgba(232,226,210,.22); --shadow:#000; --cardline:#24221c;   /* Ink Well Soft: dark cards are borderless */
}
html[data-theme="light"] {
  --bg:#f2efe8; --card:#faf8f2; --text:#1c1a16; --muted:#6f6a5c; --accent:#ff6b1a;
  --line:rgba(28,26,22,.18); --shadow:rgba(28,26,22,.9); --cardline:#1c1a16;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Outfit',sans-serif; font-weight:400;
  transition:background .25s, color .25s;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:72px 28px;
}
.doto { font-family:'Doto',sans-serif; font-weight:900; margin:0 .18em; }
.kicker {
  font-size:11px; font-weight:400; letter-spacing:6px; text-transform:uppercase;
  color:var(--muted);
}
.stage { width:100%; max-width:860px; }
#themeToggle {
  position:fixed; top:16px; right:16px; z-index:100;
  width:40px; height:40px; border:2px solid var(--text); background:var(--card);
  color:var(--text); border-radius:0; cursor:pointer; font-size:18px; line-height:1;
  font-family:'Outfit',sans-serif; box-shadow:3px 3px 0 var(--shadow);
}
#themeToggle:active { box-shadow:1px 1px 0 var(--shadow); transform:translate(2px,2px); }

/* Ink Well Soft (locked 2026-07-08): r8, light = ink frame, dark = borderless raised surface */
.rcard {
  position:relative; border:2px solid var(--cardline); background:var(--card); border-radius:8px;
  padding:26px 26px 24px; max-width:340px;
  box-shadow:6px 6px 0 var(--shadow); transition:transform .18s ease, box-shadow .18s ease;
}
.rcard:hover { transform:translate(-2px,-4px); box-shadow:9px 9px 0 var(--shadow); }
.rcard.hot { --shadow:var(--accent); }
.rcard.hot .rcard-t { color:var(--accent); }
html[data-theme="light"] .rcard.hot { --cardline:var(--accent); }   /* dark hot stays borderless */
.rcard-ic { width:44px; height:44px; margin-bottom:18px; image-rendering:pixelated; }
.rcard-k { font-size:10px; letter-spacing:5px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
.rcard-t { font-size:21px; font-weight:500; letter-spacing:-0.5px; margin-bottom:8px; transition:color .15s; }
.rcard-s { font-size:14px; color:var(--muted); line-height:1.55; }
</style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle dark / light mode">◐</button>
<div class="stage">
<div class="rcard">
  <canvas class="rcard-ic" id="icDoc"></canvas>
  <div class="rcard-k">Module 03</div>
  <div class="rcard-t">Ship your first agent</div>
  <div class="rcard-s">Wire one skill, one memory file, and one schedule - then let it run a real task overnight.</div>
</div>
</div>
<script>

(function () {
  const root = document.documentElement;
  const apply = t => {
    root.setAttribute('data-theme', t);
    root.style.colorScheme = t;
    if (window.roboRedraw) window.roboRedraw();
  };
  const forced = new URLSearchParams(location.search).get('theme');
  apply(forced || localStorage.getItem('robo-theme') || 'dark');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('robo-theme', next);
    apply(next);
  });
  window.addEventListener('message', e => {
    if (e.data && e.data.roboTheme) { localStorage.setItem('robo-theme', e.data.roboTheme); apply(e.data.roboTheme); }
  });
})();

function sprite(canvasId, rows, palette, px) {
  const c = document.getElementById(canvasId); if (!c) return;
  const ctx = c.getContext('2d');
  c.width = rows[0].length * px; c.height = rows.length * px;
  ctx.clearRect(0,0,c.width,c.height);
  rows.forEach((row, y) => [...row].forEach((k, x) => {
    if (k !== '.') { ctx.fillStyle = palette[k]; ctx.fillRect(x * px, y * px, px, px); }
  }));
}
function drawIcon() {
  const ink = getComputedStyle(document.body).getPropertyValue('--text').trim();
  sprite('icDoc', ['..........','.kkkkkk...','.k....kk..','.k.....k..','.k.kkk.k..','.k.....k..','.k.kkk.k..','.k.....k..','.kkkkkkk..','..........'], { k: ink }, 6);
}
window.roboRedraw = drawIcon; drawIcon();

</script>
</body>
</html>
